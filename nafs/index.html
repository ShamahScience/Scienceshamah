<title>بمهاراتي أنافس</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#cfe8f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Tajawal:wght@500;700;800&family=Aref+Ruqaa:wght@700&display=swap">
<style>
/* Layout: national pastel scene (sky, Riyadh skyline, mud fort, flag) fills the screen;
   a wooden-framed whiteboard sits in the middle with the cartoon student beside it. */
:root{
  --sky-1:#cde7f6; --sky-2:#fdf1e4;
  --green:#0b6b3a;        /* Saudi flag green */
  --mint:#bfe6cf; --mint-deep:#5fae84;
  --rose:#f8cfdc; --rose-deep:#e07a9b;
  --butter:#fbe7a6; --lilac:#dcd0f3; --sky-chip:#cfe3fb;
  --wood:#d9a96b; --wood-deep:#a8743e;
  --ink:#1f3b2c; --ink-soft:#4d6a59;
  --board:#fffdf8;
  --good:#2f9e5d; --bad:#d9576f; --gold:#f5b82e;
  --f-display:"Baloo Bhaijaan 2","Tajawal","Geeza Pro","Segoe UI",system-ui,sans-serif;
  --f-body:"Tajawal","Geeza Pro","Segoe UI",system-ui,sans-serif;
  --f-cal:"Aref Ruqaa","Amiri",serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{direction:rtl;background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 70%);color:var(--ink);font-family:var(--f-body);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#root{min-height:100%}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---------- scenery ---------- */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.scene svg{position:absolute;bottom:0;height:auto}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;filter:blur(1px);animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;top:-70%;left:15%}
.cloud::after{width:40%;height:130%;top:-50%;right:12%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.skyline{left:0;width:min(46vw,560px)}
.fort{right:0;width:min(40vw,500px)}
.desk{position:absolute;left:0;right:0;bottom:0;height:7vh;background:linear-gradient(180deg,#e2b47a,#c58d52);box-shadow:0 -4px 10px rgba(120,70,20,.2)}
.scene .flag{position:absolute;bottom:26vh;right:1.5vw;width:min(17vw,210px);filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.flag .cloth{transform-origin:0 50%;animation:wave 3.2s ease-in-out infinite}
@keyframes wave{0%,100%{transform:skewY(0deg) scaleX(1)}50%{transform:skewY(-2.5deg) scaleX(.97)}}
.flag .shine{animation:shine 3.2s linear infinite}
@keyframes shine{from{transform:translateX(-120px)}to{transform:translateX(260px)}}
.petal{position:absolute;font-size:22px;animation:fall linear infinite;opacity:.85}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(360deg)}}

/* ---------- app frame ---------- */
.wrap{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:12px;padding-inline:16px;padding-block:12px 9vh;box-sizing:border-box}
.topbar{width:min(1100px,100%);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,3vw,32px);color:var(--green);text-shadow:0 2px 0 #fff;line-height:1.1}
.brand small{display:block;font-size:.5em;color:var(--ink-soft);font-weight:700;text-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:2px solid var(--mint);border-radius:999px;padding:4px 14px;font-weight:800;font-size:clamp(14px,1.7vw,18px);display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(95,174,132,.25);font-variant-numeric:tabular-nums}
.chip.score{border-color:var(--butter);box-shadow:0 3px 0 rgba(245,184,46,.35)}
.chip.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}

.progress{width:min(1100px,100%);display:flex;flex-direction:column;gap:6px}
.track{position:relative;height:16px;border-radius:999px;background:rgba(255,255,255,.8);border:2px solid #fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.08);overflow:hidden}
.fill{position:absolute;inset-block:0;right:0;border-radius:999px;background:repeating-linear-gradient(-45deg,var(--mint-deep) 0 12px,#79c79d 12px 24px);transition:width .6s cubic-bezier(.3,1.3,.5,1);animation:stripes 1s linear infinite}
@keyframes stripes{to{background-position:34px 0}}
.dots{display:flex;justify-content:space-between;gap:3px}
.dot{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.75)}
.dot.ok{background:var(--good)}.dot.no{background:var(--bad)}.dot.now{background:var(--gold);animation:pulse 1s infinite}
.dot.gap{margin-inline-start:8px}
@keyframes pulse{50%{opacity:.4}}
.plabel{display:flex;justify-content:space-between;font-weight:700;font-size:clamp(13px,1.5vw,16px);color:var(--ink-soft)}

.stage{width:min(1100px,100%);display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:14px;align-items:end}
.stage.solo{grid-template-columns:minmax(0,1fr)}

/* whiteboard */
.board{position:relative;background:var(--board);border:12px solid var(--wood);border-radius:22px;box-shadow:inset 0 0 0 3px var(--wood-deep),0 14px 30px rgba(80,50,20,.22);padding:clamp(14px,2.4vw,28px);background-image:linear-gradient(rgba(150,190,220,.18) 1px,transparent 1px);background-size:100% 34px}
.board::before{content:"";position:absolute;inset-inline:-12px;bottom:-26px;height:14px;margin-inline:12%;background:var(--wood-deep);border-radius:0 0 10px 10px}
.qenter{animation:qin .55s cubic-bezier(.2,1.2,.4,1)}
@keyframes qin{from{opacity:0;transform:translateX(-60px) rotate(-2deg) scale(.96)}to{opacity:1;transform:none}}
.qhead{display:flex;gap:14px;align-items:flex-start}
.qnum{flex:none;width:clamp(42px,5vw,58px);height:clamp(42px,5vw,58px);border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,2.8vw,32px);color:#fff;background:var(--c,var(--mint-deep));box-shadow:0 4px 0 rgba(0,0,0,.12)}
.qmeta{font-weight:800;font-size:clamp(12px,1.4vw,15px);color:var(--ink-soft);background:var(--tint,#eef7f1);border-radius:999px;padding:3px 12px;display:inline-block;margin-bottom:6px}
.qtext{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3.1vw,38px);line-height:1.35;text-wrap:balance}
.qbody{display:grid;grid-template-columns:minmax(0,1fr) clamp(120px,17vw,190px);gap:16px;align-items:center;margin-top:14px}
.illus{width:100%;aspect-ratio:1;max-width:100%;background:var(--tint,#eef7f1);border-radius:24px;display:grid;place-items:center;overflow:hidden}
.illus svg{width:92%;height:92%}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{position:relative;display:flex;align-items:center;gap:10px;text-align:start;background:#fff;border:3px solid var(--c,var(--mint));border-radius:18px;padding:12px 14px;min-height:64px;font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2.2vw,27px);color:var(--ink);box-shadow:0 5px 0 var(--c,var(--mint));transition:transform .15s,box-shadow .15s,background .2s}
.opt:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 8px 0 var(--c,var(--mint))}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--c,var(--mint))}
.opt .let{flex:none;width:1.7em;height:1.7em;border-radius:12px;display:grid;place-items:center;background:var(--tint,#eef7f1);font-weight:800}
.opt:disabled{cursor:default}
.opt.right{background:#dff5e7;border-color:var(--good);box-shadow:0 5px 0 var(--good);animation:yay .6s}
.opt.wrong{background:#fde3e8;border-color:var(--bad);box-shadow:0 5px 0 var(--bad);animation:shake .45s}
.opt.dim{opacity:.55}
.opt .mark{margin-inline-start:auto;font-size:1.1em}
@keyframes yay{40%{transform:scale(1.05)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.feedback{margin-top:16px;border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;animation:qin .4s}
.feedback.good{background:#e3f6ea;border:2px dashed var(--good)}
.feedback.bad{background:#fff0f3;border:2px dashed var(--rose-deep)}
.feedback .msg{flex:1 1 260px;min-width:0}
.feedback h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2.6vw,30px)}
.feedback p{margin:4px 0 0;font-size:clamp(16px,1.9vw,21px);line-height:1.6;font-weight:700;color:var(--ink-soft)}
.btn{border:0;border-radius:999px;padding:12px 26px;font-family:var(--f-display);font-weight:800;font-size:clamp(18px,2.2vw,24px);color:#fff;background:var(--green);box-shadow:0 5px 0 #064d29;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #064d29}
.btn.pink{background:var(--rose-deep);box-shadow:0 5px 0 #b45573}
.btn.gold{background:var(--gold);color:#4a3200;box-shadow:0 5px 0 #c58f12}
.btn.ghost{background:#fff;color:var(--green);box-shadow:0 5px 0 var(--mint)}

/* student character */
.buddy{position:relative;display:flex;flex-direction:column;align-items:center}
.buddy svg{width:100%;height:auto;overflow:visible}
.bubble{position:relative;background:#fff;border:3px solid var(--rose);border-radius:20px;padding:8px 12px;font-weight:800;font-size:clamp(15px,1.6vw,18px);text-align:center;line-height:1.45;margin-bottom:8px;box-shadow:0 4px 0 rgba(224,122,155,.25);animation:qin .4s}
.bubble::after{content:"";position:absolute;bottom:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:var(--rose);border-bottom:0}
.b-idle{animation:bob 2.6s ease-in-out infinite}
.b-happy{animation:hop .55s ease-in-out 3}
.b-sad{animation:tilt 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hop{50%{transform:translateY(-22px)}}
@keyframes tilt{50%{transform:rotate(-3deg)}}
.arm{transform-origin:150px 205px;animation:point 2.4s ease-in-out infinite}
.b-happy .arm{animation:cheer .4s ease-in-out infinite}
@keyframes point{50%{transform:rotate(-8deg)}}
@keyframes cheer{50%{transform:rotate(-28deg)}}
.blink{animation:blink 4s infinite;transform-origin:center 128px;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

/* start + result cards */
.card{width:min(680px,100%);background:var(--board);border:12px solid var(--wood);border-radius:28px;box-shadow:inset 0 0 0 3px var(--wood-deep),0 18px 40px rgba(80,50,20,.25);padding:clamp(18px,3.5vw,36px);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;animation:qin .6s cubic-bezier(.2,1.2,.4,1)}
.card h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5.6vw,58px);color:var(--green);line-height:1.15}
.card h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3.6vw,36px);color:var(--rose-deep)}
.card p{margin:0;font-size:clamp(17px,2.2vw,22px);font-weight:700;line-height:1.6}
.meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.field{width:100%;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:start}
.field label{font-weight:800;font-size:clamp(16px,2vw,20px)}
.field input{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,28px);padding:12px 18px;border-radius:18px;border:3px solid var(--mint);background:#fff;color:var(--ink);text-align:center}
.hint{color:var(--bad);font-weight:800;min-height:1.4em}
.startrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center;width:100%}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.stat{background:var(--tint);border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:clamp(26px,4vw,40px);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-weight:800;font-size:clamp(13px,1.6vw,16px);color:var(--ink-soft)}
.namebar{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3.4vw,34px);background:var(--rose);border-radius:16px;padding:6px 22px}
.cheer{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,3vw,30px);color:var(--green)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* effects */
.fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.star{position:fixed;left:var(--x);top:var(--y);font-size:var(--s);color:var(--gold);text-shadow:0 0 10px rgba(255,200,40,.9);animation:burst 1.3s cubic-bezier(.15,.8,.3,1) forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}80%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--r));opacity:0}}
.plus{position:fixed;left:var(--x);top:var(--y);transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:800;font-size:38px;color:var(--good);text-shadow:0 2px 0 #fff;animation:rise 1.2s ease-out forwards}
@keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
.conf{position:fixed;top:-20px;left:var(--x);width:10px;height:16px;background:var(--c);border-radius:3px;animation:confall var(--d) linear forwards}
@keyframes confall{to{transform:translateY(110vh) rotate(720deg) translateX(var(--sx))}}

.modal{position:fixed;inset:0;z-index:40;background:rgba(31,59,44,.45);display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal .card{max-height:92vh;overflow:auto}
.card .buddy{width:min(150px,40vw)}
.startrow .buddy{width:auto}
.modal img{width:min(320px,70vw);height:auto;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.2);-webkit-touch-callout:default;user-select:auto}
.toast{position:fixed;bottom:12vh;left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;font-weight:800;padding:10px 20px;border-radius:999px;animation:qin .3s}
.credit{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 1.2vh);left:0;right:0;z-index:2;text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(13px,1.6vw,17px);color:#5b3712;pointer-events:none}
.sound{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:30;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:var(--mint);font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.12)}

@media (max-width:760px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .stage .buddy{order:-1;flex-direction:row;gap:8px;align-items:center;justify-content:center}
  .stage .buddy svg{width:84px}
  .stage .bubble{margin:0;flex:1;max-width:340px}
  .stage .bubble::after{left:auto;right:-12px;bottom:auto;top:50%;margin:-10px 0 0;border:10px solid transparent;border-left-color:var(--rose);border-right:0}
  .qbody{grid-template-columns:minmax(0,1fr)}
  .illus{width:120px;justify-self:center;order:-1}
  .opts{grid-template-columns:minmax(0,1fr)}
  .startrow{grid-template-columns:minmax(0,1fr)}
  .startrow .buddy svg{width:120px}
  .scene .flag{width:30vw;bottom:14vh;opacity:.9}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback} = React;

/* ================= الأسئلة — منقولة حرفيًا من عرض المراجعة ================= */
const GROUPS = [
  {title:'صف وتركيب الخلية وربطها بوظائفها الحيوية', c:'#f2a93b', tint:'#fff4dc', name:'الأولى'},
  {title:'صف وتراكيب الخلية وربطها بوظائفها الحيوية', c:'#e07a9b', tint:'#fde8ef', name:'الثانية'},
  {title:'تحديد الاختلافات الأساسية من حيث التركيب والوظيفة بين الخلية النباتية والخلية الحيوانية', c:'#4f9fd8', tint:'#e3f0fb', name:'الثالثة'},
  {title:'تحديد الاختلافات الأساسية من حيث التركيب والوظيفة بين الخلية النباتية والخلية الحيوانية', c:'#8e6fd1', tint:'#efe9fb', name:'الرابعة'},
];
const QUESTIONS = [
  // المجموعة الأولى (الشريحة 3)
  {g:0,art:'human',q:'أي من المخلوقات الحية التالية يعتبر مثالاً على مخلوق عديد الخلايا؟',o:['البكتيريا','الإنسان','البراميسيوم','اليوجلينا'],a:1,
   e:'الإنسان يتكوّن من ملايين الخلايا، أما البكتيريا والبراميسيوم واليوجلينا فكلٌّ منها خلية واحدة فقط.'},
  {g:0,art:'organs',q:'ما الذي يشكله مجموعة من الأعضاء مثل القلب والمعدة والأمعاء التي تعمل معاً؟',o:['نسيج','عنصر','جهاز حيوي','خلية'],a:2,
   e:'الأعضاء التي تعمل معًا لأداء وظيفة واحدة تُكوِّن جهازًا حيويًا، مثل الجهاز الهضمي.'},
  {g:0,art:'mito',q:'ماذا يحدث لو فقدت الخلية الميتوكوندريا الخاصة بها؟',o:['لن تتمكن من تخزين الماء والغذاء.','ستتوقف عملية البناء الضوئي.','لن تتمكن من حماية نفسها.','لن تتمكن من تحويل الغذاء إلى طاقة.'],a:3,
   e:'الميتوكوندريا «مصنع الطاقة» في الخلية؛ فيها يتحول الغذاء إلى طاقة.'},
  {g:0,art:'microbe',q:'إذا لاحظت مخلوقًا مجهريًا تحت المجهر يتكون من خلية واحدة، أي مما يلي يمكن أن يكون؟',o:['نسيج عضلي','جهاز هضمي','جلد إنسان','براميسيوم'],a:3,
   e:'البراميسيوم مخلوق وحيد الخلية، أما النسيج العضلي والجهاز الهضمي وجلد الإنسان فتتكون من خلايا كثيرة.'},
  {g:0,art:'plantcell',q:'أي من التراكيب التالية مسؤول عن إعطاء الخلية النباتية شكلها الثابت وحمايتها؟',o:['الجدار الخلوي','الفجوات','النواة','السيتوبلازم'],a:0,
   e:'الجدار الخلوي غلاف قوي يحيط بالخلية النباتية، فيعطيها شكلها الثابت ويحميها.'},
  // المجموعة الثانية (الشريحة 4)
  {g:1,art:'levels',q:'ما التسلسل الصحيح لمستويات التنظيم في المخلوقات الحية عدة الخلايا، من الأصغر إلى الأكبر؟',o:['نسيج ↔ خلية ↔ عضو ↔ جهاز','خلية ↔ نسيج → عضو → جهاز','عضو → نسيج → خلية → جهاز','جهاز → عضو → نسيج → خلية'],a:1,

/* ================= sound ================= */
const Sound=(()=>{let ctx=null,on=true;
  const ac=()=>{if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ctx&&ctx.state==='suspended')ctx.resume();return ctx;};
  const tone=(f,t0,d,type='sine',v=.18,slide)=>{const c=ac();if(!c||!on)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime+t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+t0+d);g.gain.setValueAtTime(0,c.currentTime+t0);g.gain.linearRampToValueAtTime(v,c.currentTime+t0+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t0+d);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+.05);};
  return{
    toggle(){on=!on;return on;},get on(){return on;},unlock(){ac();},
    click(){tone(660,0,.08,'triangle',.12);},
    good(){[784,988,1175,1568].forEach((f,i)=>tone(f,i*.09,.45,'triangle',.16));tone(2093,.38,.6,'sine',.08);},
    bad(){tone(392,0,.25,'sine',.14,330);tone(330,.22,.35,'sine',.12,294);},
    fanfare(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.12,.5,'triangle',.15));},
    whoosh(){tone(300,0,.25,'sine',.05,900);},
  };})();

/* ================= effects ================= */
function useFx(){
  const [items,setItems]=useState([]);
  const add=useCallback((list,ms=1800)=>{const id=Math.random();setItems(s=>[...s,{id,list}]);setTimeout(()=>setItems(s=>s.filter(x=>x.id!==id)),ms);},[]);
  const stars=useCallback((x,y)=>{add([...Array(26)].map((_,i)=>{const a=Math.random()*6.283,d=80+Math.random()*220;
    return <span key={i} className="star" style={{'--x':x+'px','--y':y+'px','--dx':Math.cos(a)*d+'px','--dy':Math.sin(a)*d+'px','--r':(Math.random()*720-360)+'deg','--s':(16+Math.random()*30)+'px',animationDelay:Math.random()*.12+'s'}}>{Math.random()<.7?'★':'✦'}</span>;})
    .concat(<span key="p" className="plus" style={{'--x':x+'px','--y':y+'px'}}>+{AR(PER)}</span>));},[add]);
  const confetti=useCallback(()=>{const cols=['#f5b82e','#e07a9b','#5fae84','#4f9fd8','#8e6fd1','#0b6b3a'];
    add([...Array(90)].map((_,i)=><span key={i} className="conf" style={{'--x':Math.random()*100+'vw','--c':cols[i%6],'--d':(2.2+Math.random()*2)+'s','--sx':(Math.random()*120-60)+'px',animationDelay:Math.random()*.8+'s'}}/>),4200);},[add]);
  const layer=<div className="fx" aria-hidden="true">{items.map(it=><React.Fragment key={it.id}>{it.list}</React.Fragment>)}</div>;
  return {stars,confetti,layer};
}

const downloadsP = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(()=>null) : Promise.resolve(null);
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
async function drawResult(r){
  try{await Promise.all(['800 60px "Baloo Bhaijaan 2"','800 30px Tajawal','700 30px "Aref Ruqaa"'].map(f=>document.fonts.load(f)));}catch(e){}
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#cde7f6');g.addColorStop(.7,'#fdf1e4');x.fillStyle=g;x.fillRect(0,0,W,H);
  // flag
  x.fillStyle='#0b6b3a';rr(x,W-300,50,240,160,10);x.fill();x.fillStyle='#fff';x.font='700 28px "Aref Ruqaa", serif';x.textAlign='center';x.direction='rtl';x.fillText('لا إله إلا الله محمد رسول الله',W-180,125,200);
  x.strokeStyle='#fff';x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(W-250,165);x.lineTo(W-110,165);x.stroke();
  // board
  x.fillStyle='#d9a96b';rr(x,60,240,W-120,1000,40);x.fill();x.fillStyle='#fffdf8';rr(x,84,264,W-168,952,26);x.fill();
  x.textAlign='center';x.fillStyle='#0b6b3a';x.font='800 64px "Baloo Bhaijaan 2", Tajawal, sans-serif';x.fillText('🏆 نتيجة عالمة نافس',W/2,370);
  x.fillStyle='#e07a9b';x.font='800 40px "Baloo Bhaijaan 2", Tajawal, sans-serif';x.fillText('🌟 بمهاراتي أنافس 🌟',W/2,440);
  x.fillStyle='#f8cfdc';rr(x,240,480,W-480,90,24);x.fill();x.fillStyle='#1f3b2c';x.font='800 50px "Baloo Bhaijaan 2", Tajawal, sans-serif';x.fillText(r.name,W/2,542);
  const rows=[['عدد الأسئلة',AR(r.total),'#fff4dc'],['الإجابات الصحيحة',AR(r.right),'#e3f6ea'],['الإجابات الخاطئة',AR(r.wrong),'#fde8ef'],['النسبة المئوية',AR(r.pct)+'٪','#e3f0fb'],['النقاط',AR(r.points),'#efe9fb']];
  rows.forEach(([k,v,bg],i)=>{const y=610+i*96;x.fillStyle=bg;rr(x,150,y,W-300,80,22);x.fill();x.textAlign='right';x.fillStyle='#4d6a59';x.font='800 36px Tajawal, sans-serif';x.fillText(k,W-185,y+53);x.textAlign='left';x.fillStyle='#1f3b2c';x.font='800 46px "Baloo Bhaijaan 2", Tajawal, sans-serif';x.fillText(v,185,y+56);});
  x.textAlign='center';x.fillStyle='#0b6b3a';x.font='800 38px "Baloo Bhaijaan 2", Tajawal, sans-serif';
  const words=r.cheer.split(' ');let line='',lines=[];words.forEach(w=>{const t=line?line+' '+w:w;if(x.measureText(t).width>W-260){lines.push(line);line=w;}else line=t;});lines.push(line);
  lines.slice(0,2).forEach((l,i)=>x.fillText(l,W/2,1130+i*50));
  x.fillStyle='#5b3712';x.font='800 34px Tajawal, sans-serif';x.fillText('إعداد المعلمة: أ/ شامه البقمي',W/2,1290);
  x.fillStyle='#4d6a59';x.font='700 28px Tajawal, sans-serif';x.fillText('الابتدائية العشرون لتحفيظ القرآن · '+new Date().toLocaleDateString('ar-SA'),W/2,1330);
  return await new Promise(res=>c.toBlob(res,'image/png'));
}
function cheerFor(p){
  if(p===100) return 'مذهلة! أجبتِ عن جميع الأسئلة بشكل صحيح، أنتِ عالمة نافس الأولى 🏆';
  if(p>=80) return 'ممتازة يا بطلة! مستواكِ رائع، واصلي التألق 🌟';
  if(p>=60) return 'جيد جدًا! أنتِ على الطريق الصحيح، راجعي الأسئلة القليلة التي أخطأتِ فيها 💚';
  if(p>=40) return 'بداية جميلة! بالمراجعة والتدريب ستصبحين أقوى 🌷';
  return 'لا بأس يا عالمة المستقبل، كل محاولة تعلّمكِ شيئًا جديدًا. أعيدي المحاولة وستتفوقين 🌸';
}

function Play({name,onDone,fx}){
  const [i,setI]=useState(0);const [pick,setPick]=useState(null);const [answers,setAnswers]=useState([]);const [bump,setBump]=useState(0);const [group,setGroup]=useState(null);
  const q=QUESTIONS[i],G=GROUPS[q.g];const right=answers.filter(Boolean).length;const done=pick!==null;const ok=done&&pick===q.a;
  const choose=(k,e)=>{if(done)return;setPick(k);const good=k===q.a;setAnswers(a=>[...a,good]);
    if(good){const r=e.currentTarget.getBoundingClientRect();fx.stars(r.left+r.width/2,r.top+r.height/2);Sound.good();setBump(b=>b+1);}else Sound.bad();};
  const next=()=>{Sound.whoosh();const lastInGroup=i===QUESTIONS.length-1||QUESTIONS[i+1].g!==q.g;
    if(lastInGroup){const gq=QUESTIONS.map((x,j)=>j).filter(j=>QUESTIONS[j].g===q.g);const gr=gq.filter(j=>answers[j]).length;setGroup({g:q.g,right:gr,total:gq.length,last:i===QUESTIONS.length-1});fx.confetti();Sound.fanfare();return;}
    setPick(null);setI(i+1);};
  const cont=()=>{const last=group.last;setGroup(null);if(last){onDone(answers);return;}setPick(null);setI(i+1);};
  const fbRef=useRef(null);
  useEffect(()=>{if(done&&fbRef.current&&fbRef.current.scrollIntoView)setTimeout(()=>fbRef.current&&fbRef.current.scrollIntoView({behavior:'smooth',block:'nearest'}),150);},[done]);
  useEffect(()=>{window.scrollTo&&window.scrollTo({top:0,behavior:'smooth'});},[i]);
  const mood=!done?'idle':ok?'happy':'sad';
  const say=!done?(i===0?`هيا يا ${name}! اقرئي السؤال جيدًا 📖`:'ركّزي، أنتِ قادرة! 💪'):ok?'أحسنتِ! إجابة رائعة ⭐':'لا بأس، نتعلم من أخطائنا 🌷';
  return <>
    <div className="topbar">
      <div className="brand">🌟 بمهاراتي أنافس 🌟<small>مغامرة العلوم التفاعلية</small></div>
      <div className="chips"><span className="chip">👧 {name}</span><span key={bump} className={'chip score'+(bump?' bump':'')}>💚 {AR(right*PER)} نقطة</span></div>
    </div>
    <div className="progress" aria-label="تقدم الطالبة">
      <div className="plabel"><span>المجموعة {G.name} · السؤال {AR(i+1)} من {AR(QUESTIONS.length)}</span><span>{AR(Math.round(answers.length/QUESTIONS.length*100))}٪</span></div>
      <div className="track"><div className="fill" style={{width:(answers.length/QUESTIONS.length*100)+'%'}}/></div>
      <div className="dots">{QUESTIONS.map((x,j)=><span key={j} className={'dot'+(j<answers.length?(answers[j]?' ok':' no'):j===i?' now':'')+(j>0&&QUESTIONS[j-1].g!==x.g?' gap':'')}/>)}</div>
    </div>
    <div className="stage">
      <section className="board qenter" key={i} style={{'--c':G.c,'--tint':G.tint}}>
        <div className="qhead">
          <div className="qnum">{AR(i%5+1)}</div>
          <div style={{minWidth:0}}><span className="qmeta">{G.title}</span><h2 className="qtext">{q.q}</h2></div>
        </div>
        <div className="qbody">
          <div className="opts">
            {q.o.map((t,k)=>{let cls='opt';if(done){if(k===q.a)cls+=' right';else if(k===pick)cls+=' wrong';else cls+=' dim';}
              return <button key={k} className={cls} disabled={done} onClick={e=>choose(k,e)}><span className="let">{LETTERS[k]}</span><span>{t}</span>{done&&k===q.a&&<span className="mark">✅</span>}{done&&k===pick&&k!==q.a&&<span className="mark">❌</span>}</button>;})}
          </div>
          <div className="illus"><Art k={q.art}/></div>
        </div>
        {done && <div ref={fbRef} className={'feedback '+(ok?'good':'bad')} aria-live="polite">
          <div className="msg">{ok?<><h3>🎉 أحسنتِ يا بطلة!</h3><p>+{AR(PER)} نقاط 💚 {q.e}</p></>:<><h3>🌷 حاولي التعلم من الخطأ</h3><p>الإجابة الصحيحة: <b style={{color:'var(--good)'}}>{LETTERS[q.a]}. {q.o[q.a]}</b><br/>{q.e}</p></>}</div>
          <button className="btn" onClick={next} autoFocus>{i===QUESTIONS.length-1?'🏁 النتيجة':'التالي ⬅'}</button>
        </div>}
      </section>
      <Buddy mood={mood} say={say}/>
    </div>
    {group && <div className="modal" role="dialog" aria-modal="true">
      <div className="card">
        <Buddy mood="happy"/>
        <h1>🎉 أنهيتِ المجموعة {GROUPS[group.g].name}!</h1>
        <p className="cheer">أجبتِ {AR(group.right)} من {AR(group.total)} إجابات صحيحة {group.right===group.total?'— علامة كاملة! 🏅':'👏'}</p>
        <p>{group.last?'أكملتِ جميع المجموعات، لنرَ نتيجتكِ النهائية!':`استعدي للمجموعة ${GROUPS[group.g+1].name} 🚀`}</p>
        <button className="btn gold" onClick={cont} autoFocus>{group.last?'🏆 عرض النتيجة':'تابعي المغامرة ⬅'}</button>
      </div>
    </div>}
  </>;
}

function Result({name,answers,onRetry,fx}){
  const total=QUESTIONS.length,right=answers.filter(Boolean).length,wrong=total-right,pct=Math.round(right/total*100),points=right*PER,cheer=cheerFor(pct);
  const [img,setImg]=useState(null);const [blob,setBlob]=useState(null);const [toast,setToast]=useState('');const [busy,setBusy]=useState(false);
  useEffect(()=>{fx.confetti();Sound.fanfare();},[]);
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(''),3200);return()=>clearTimeout(t);},[toast]);
  const fname=`نتيجة-${name}-بمهاراتي-أنافس.png`.replace(/[\\/:*?"<>|]/g,'');
  const capture=async()=>{setBusy(true);const b=await drawResult({name,total,right,wrong,pct,points,cheer});setBusy(false);if(!b)return;setBlob(b);setImg(URL.createObjectURL(b));};
  const save=async()=>{const dl=await downloadsP;
    if(dl){try{await dl.save({filename:fname,data:blob});setToast('تم حفظ صورة النتيجة ✅');}catch(e){if(e&&e.code==='declined')return;setToast('تعذّر الحفظ هنا، اضغطي مطولًا على الصورة واحفظيها');}return;}
    const a=document.createElement('a');a.href=img;a.download=fname;document.body.appendChild(a);a.click();a.remove();setToast('إذا لم تُحفظ الصورة، اضغطي مطولًا عليها واختاري «حفظ الصورة»');};
  const S=[['عدد الأسئلة',AR(total),'#fff4dc'],['الإجابات الصحيحة',AR(right),'#e3f6ea'],['الإجابات الخاطئة',AR(wrong),'#fde8ef'],['النسبة المئوية',AR(pct)+'٪','#e3f0fb'],['النقاط',AR(points),'#efe9fb']];
  return <>
    <div className="card">
      <h1>🏆 نتيجة عالمة نافس</h1>
      <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',justifyContent:'center'}}><span style={{fontWeight:800,fontSize:'clamp(17px,2.2vw,22px)'}}>اسم الطالبة:</span><span className="namebar">{name}</span></div>
      <div className="stats">{S.map(([k,v,bg])=><div key={k} className="stat" style={{'--tint':bg}}><b>{v}</b><span>{k}</span></div>)}</div>
      <div style={{display:'flex',alignItems:'center',gap:12}}><div style={{width:110,flex:'none'}}><Buddy mood={pct>=60?'happy':'idle'}/></div><p className="cheer">{cheer}</p></div>
      <div className="row">
        <button className="btn pink" onClick={onRetry}>🔄 أعيدي المحاولة</button>
        <button className="btn" onClick={capture} disabled={busy}>{busy?'⏳ جارٍ التجهيز…':'📸 احفظي نتيجتكِ'}</button>
      </div>
      <p style={{fontSize:'clamp(14px,1.8vw,17px)',color:'var(--ink-soft)'}}>إعداد المعلمة: أ/ شامه البقمي · الابتدائية العشرون لتحفيظ القرآن</p>
    </div>
    {img && <div className="modal" role="dialog" aria-modal="true" onClick={e=>{if(e.target===e.currentTarget)setImg(null);}}>
      <div className="card">
        <h2>📸 صورة نتيجتكِ جاهزة</h2>
        <img src={img} alt={'صورة نتيجة '+name}/>
        <p style={{fontSize:'clamp(15px,1.9vw,18px)'}}>احفظيها ثم أرسليها إلى معلمتكِ. على الآيفون والآيباد يمكنكِ أيضًا الضغط مطولًا على الصورة واختيار «حفظ في الصور».</p>
        <div className="row"><button className="btn" onClick={save}>💾 حفظ الصورة</button><button className="btn ghost" onClick={()=>setImg(null)}>إغلاق</button></div>
      </div>
    </div>}
    {toast && <div className="toast" role="status">{toast}</div>}
  </>;
}

function App(){
  const [screen,setScreen]=useState('start');const [name,setName]=useState('');const [answers,setAnswers]=useState([]);const [snd,setSnd]=useState(true);const [run,setRun]=useState(0);
  const fx=useFx();
  return <>
    <Scene/>
    <button className="sound" aria-label="الصوت" onClick={()=>{setSnd(Sound.toggle());}}>{snd?'🔊':'🔇'}</button>
    <main className="wrap" style={screen!=='play'?{justifyContent:'center'}:null}>
      {screen==='start' && <Start onStart={n=>{setName(n);setScreen('play');}}/>}
      {screen==='play' && <Play key={run} name={name} fx={fx} onDone={a=>{setAnswers(a);setScreen('result');}}/>}
      {screen==='result' && <Result name={name} answers={answers} fx={fx} onRetry={()=>{Sound.click();setRun(r=>r+1);setAnswers([]);setScreen('play');}}/>}
    </main>
    <div className="credit">إعداد المعلمة: أ/ شامه البقمي · الابتدائية العشرون لتحفيظ القرآن</div>
    {fx.layer}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
