<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تحدي العالمات الصغيرات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a bright smart-board stage on lavender graph paper; one question card at a time; the star-box dock is pinned along the bottom on every screen */
:root{
  --paper:#fdfbff; --grid:rgba(123,77,255,.075); --surface:#ffffff; --ink:#2a1b4a; --muted:#6c5f8d; --line:#e9e1fb;
  --pink:#ff4f9a; --pink-d:#d42f77; --pink-s:#ffe4f0;
  --violet:#7b4dff; --violet-d:#5a2fe0; --violet-s:#efe8ff;
  --sky:#1fb2ec; --sky-d:#0a89bd; --sky-s:#ddf5ff;
  --gold:#ffc21a; --gold-d:#e09600; --gold-s:#fff4cf;
  --ok:#12a272; --ok-s:#dcf7ec; --bad:#e2434b; --bad-s:#ffe5e6;
  --display:"Baloo Bhaijaan 2","Tajawal",Tahoma,sans-serif;
  --body:"Tajawal","Segoe UI",Tahoma,sans-serif;
  --dock-h:156px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    radial-gradient(1200px 500px at 85% -10%,#ffe9f4 0,transparent 60%),radial-gradient(900px 500px at 0% 10%,#e6f6ff 0,transparent 60%);
  background-size:34px 34px,34px 34px,auto,auto;background-attachment:fixed;
  padding-bottom:calc(var(--dock-h) + 24px + env(safe-area-inset-bottom,0px))}
body.dock-min{padding-bottom:90px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:10px}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- background twinkles ---------- */
.twk{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.twk svg{position:absolute;width:22px;height:22px;fill:var(--gold);opacity:.55;animation:tw 3.6s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.6) rotate(0);opacity:.25}50%{transform:scale(1.1) rotate(25deg);opacity:.8}}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:20px;white-space:nowrap}
.brand .bstar{width:34px;height:34px;filter:drop-shadow(0 3px 0 var(--gold-d))}
.nav{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none;padding:4px 2px;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:700;font-size:15px;padding:7px 12px;border-radius:999px;border:2px solid transparent;white-space:nowrap}
.nav a:hover{background:var(--violet-s);color:var(--violet-d)}
.nav a.on{background:var(--violet);color:#fff;box-shadow:0 3px 0 var(--violet-d)}
.tools{display:flex;gap:6px;align-items:center}
.ibtn{border:0;background:var(--violet-s);color:var(--violet-d);border-radius:14px;min-width:44px;height:44px;padding:0 10px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 0 #d8cbff}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 #d8cbff}
.timer{font-variant-numeric:tabular-nums;background:var(--sky-s);color:var(--sky-d);box-shadow:0 3px 0 #b9e7fa;min-width:96px}
.timer.run{background:var(--sky);color:#fff;box-shadow:0 3px 0 var(--sky-d)}
.timer.end{background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--pink-d);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

main{position:relative;z-index:1;padding-block:22px 10px}

/* ---------- 3D buttons ---------- */
.btn{--c:var(--violet);--d:var(--violet-d);border:0;border-radius:18px;background:var(--c);color:#fff;font-weight:800;font-size:19px;min-height:58px;padding:10px 24px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 0 var(--d),0 12px 22px rgba(60,30,120,.18);transition:transform .12s,box-shadow .12s;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--d),0 16px 26px rgba(60,30,120,.2)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d),0 4px 8px rgba(60,30,120,.15)}
.btn.pink{--c:var(--pink);--d:var(--pink-d)} .btn.sky{--c:var(--sky);--d:var(--sky-d)} .btn.gold{--c:var(--gold);--d:var(--gold-d);color:#4a2c00}
.btn.ghost{--c:#fff;--d:var(--line);color:var(--violet-d);border:2px solid var(--line)}
.btn.sm{min-height:46px;font-size:16px;padding:6px 16px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- home ---------- */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:center;
  background:linear-gradient(135deg,#fff 0%,#fff 55%,var(--pink-s) 100%);border:3px solid #fff;border-radius:34px;padding:30px;
  box-shadow:0 0 0 2px var(--line),0 14px 0 -4px var(--violet-s),0 24px 50px rgba(90,47,224,.14);overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -60px -80px auto;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,var(--sky-s),transparent 70%);z-index:0}
.hero>*{position:relative;z-index:1;min-width:0}
.eyebrow{display:inline-flex;gap:8px;align-items:center;background:var(--violet-s);color:var(--violet-d);font-weight:800;font-size:15px;border-radius:999px;padding:5px 14px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:800;margin-top:12px;color:var(--ink)}
.hero h1 .hl{background:linear-gradient(90deg,var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-family:var(--display);font-size:clamp(20px,2.4vw,28px);font-weight:700;color:var(--violet-d);margin-top:4px}
.hero .motto{font-size:clamp(18px,2vw,23px);color:var(--ink);margin:14px 0 22px;font-weight:500}
.hero .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.mascot{width:min(230px,100%);justify-self:center;filter:drop-shadow(0 16px 18px rgba(90,47,224,.25));animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.goldbox{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#fffaf0,var(--gold-s));border:3px solid #ffe08a;border-radius:24px;padding:10px 18px 10px 12px;box-shadow:0 6px 0 #f3cf6b}
.goldbox svg{width:62px;height:72px}
.goldbox b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:#8a5a00;font-variant-numeric:tabular-nums}
.goldbox span{font-size:14px;color:#8a5a00;font-weight:700}
.hero-side{display:grid;justify-items:center;gap:14px}

.sec-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.sec-title h2{font-size:28px}
.sec-title p{margin:0;color:var(--muted);font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;perspective:1200px}
.scard{--c:var(--violet);--d:var(--violet-d);--s:var(--violet-s);position:relative;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);
  background:#fff;border-radius:26px;padding:20px 20px 18px;border:3px solid var(--s);
  box-shadow:0 10px 0 var(--s),0 18px 30px rgba(60,30,120,.12);transform:rotateX(8deg);transform-style:preserve-3d;transition:transform .25s,box-shadow .25s}
.scard:hover,.scard:focus-visible{transform:rotateX(0) translateY(-6px) scale(1.02);box-shadow:0 14px 0 var(--s),0 26px 40px rgba(60,30,120,.18)}
.scard .num{position:absolute;top:14px;left:16px;font-family:var(--display);font-weight:800;color:var(--c);opacity:.25;font-size:46px;line-height:1}
.scard .ico{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:34px;background:var(--s);box-shadow:inset 0 -5px 0 rgba(0,0,0,.06);transform:translateZ(30px)}
.scard h3{font-size:23px;margin-top:6px}
.scard p{margin:0;color:var(--muted);font-size:16px}
.scard .meta{margin-top:auto;padding-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--s);color:var(--d)}
.c-pink{--c:var(--pink);--d:var(--pink-d);--s:var(--pink-s)} .c-sky{--c:var(--sky);--d:var(--sky-d);--s:var(--sky-s)}
.c-gold{--c:var(--gold);--d:#9a6400;--s:var(--gold-s)} .c-violet{--c:var(--violet);--d:var(--violet-d);--s:var(--violet-s)}
.c-ok{--c:var(--ok);--d:#0b7a55;--s:var(--ok-s)}

/* ---------- section view ---------- */
.shead{--c:var(--violet);--d:var(--violet-d);--s:var(--violet-s);display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.shead .ico{width:58px;height:58px;border-radius:18px;background:var(--s);display:grid;place-items:center;font-size:30px;box-shadow:0 5px 0 var(--c)}
.shead h2{font-size:clamp(24px,3.2vw,34px)}
.shead p{margin:0;color:var(--muted);font-weight:500}
.shead .grow{flex:1;min-width:200px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:800;font-size:14px;color:var(--muted);padding:0;font-variant-numeric:tabular-nums}
.dots button.on{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.12)}
.dots button.done{border-color:var(--c);color:var(--d)}
.stage{position:relative;perspective:1400px;min-height:320px}
.ctrl{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px}
.ctrl .count{font-family:var(--display);font-weight:700;color:var(--muted);min-width:110px;text-align:center;font-variant-numeric:tabular-nums}

.card{position:relative;background:#fff;border-radius:30px;padding:clamp(18px,3vw,34px);border:3px solid #fff;
  box-shadow:0 0 0 2px var(--line),0 12px 0 -3px var(--s,var(--violet-s)),0 26px 50px rgba(60,30,120,.13)}
.enter{animation:enter .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes enter{from{opacity:0;transform:rotateY(-25deg) translateX(-40px) scale(.94)}to{opacity:1;transform:none}}
.qbadge{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:var(--d);background:var(--s);border-radius:999px;padding:4px 12px}
.q{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.4vw,38px);margin:12px 0 22px;line-height:1.35;text-wrap:balance}

/* MCQ: star answers */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.opt{--oc:var(--pink);--od:var(--pink-d);--os:var(--pink-s);position:relative;display:flex;align-items:center;gap:14px;text-align:right;
  background:#fff;border:3px solid var(--os);border-radius:22px;padding:12px 16px;min-height:80px;font-weight:700;font-size:clamp(17px,2vw,22px);
  box-shadow:0 7px 0 var(--os);transition:transform .15s,box-shadow .15s,background .2s}
.opt:nth-child(2){--oc:var(--violet);--od:var(--violet-d);--os:var(--violet-s)}
.opt:nth-child(3){--oc:var(--sky);--od:var(--sky-d);--os:var(--sky-s)}
.opt:nth-child(4){--oc:var(--gold);--od:var(--gold-d);--os:var(--gold-s)}
.opt:hover{transform:translateY(-3px);box-shadow:0 10px 0 var(--os)}
.opt .st{flex:none;width:58px;height:58px;position:relative;display:grid;place-items:center;transition:transform .5s}
.opt .st svg{position:absolute;inset:0;width:100%;height:100%;fill:var(--oc);filter:drop-shadow(0 3px 0 var(--od))}
.opt .st i{position:relative;font-style:normal;color:#fff;font-family:var(--display);font-weight:800;font-size:20px;margin-top:4px}
.opt.right{background:var(--ok-s);border-color:var(--ok);box-shadow:0 7px 0 #9fe0c6}
.opt.right .st{transform:rotate(360deg) scale(1.15)} .opt.right .st svg{fill:var(--gold);filter:drop-shadow(0 3px 0 var(--gold-d))}
.opt.wrong{background:var(--bad-s);border-color:var(--bad);box-shadow:0 7px 0 #f5b3b6;animation:shake .45s}
.opt.dim{opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.explain{margin-top:20px;border-radius:20px;padding:14px 18px;background:var(--ok-s);border:2px dashed var(--ok);font-size:clamp(17px,1.9vw,21px);font-weight:500;animation:enter .4s both}
.explain b{color:#0b7a55}
.explain.no{background:var(--bad-s);border-color:var(--bad)} .explain.no b{color:var(--bad)}

/* T/F */
.tf-note{position:relative;background:repeating-linear-gradient(transparent 0 42px,#e7f3ff 42px 44px),#fff;border-radius:22px;padding:22px 24px 22px 24px;border:2px solid var(--sky-s);margin:10px 0 22px}
.tf-note::before{content:"";position:absolute;top:0;bottom:0;right:58px;width:2px;background:#ffc3dc}
.tf-note .q{margin:0;padding-right:54px}
.tf-note .flask{position:absolute;right:10px;top:16px;font-size:30px}
.tfb{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.tfb .btn{min-width:200px;font-size:22px;min-height:70px}
.tfb .btn.right{--c:var(--ok);--d:#0b7a55;outline:4px solid #9fe0c6}
.tfb .btn.wrong{--c:var(--bad);--d:#a8262d;animation:shake .45s}

/* Drag & drop */
.dnd-prompt{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700;margin:-10px 0 16px;font-size:16px}
.zones{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.zones.order .zone{flex:1 1 150px;max-width:220px}
.zones.order .arrow{align-self:center;font-size:28px;color:var(--violet);font-weight:800}
.zones.match{flex-direction:column;align-items:stretch}
.zones.match .zone{display:grid;grid-template-columns:minmax(120px,30%) minmax(0,1fr);align-items:center;gap:12px}
.zones.sort .zone{flex:1 1 220px}
.zone{background:var(--paper);border:3px dashed #d6c8ff;border-radius:22px;padding:10px;transition:background .2s,border-color .2s}
.zone.hot{background:var(--violet-s);border-color:var(--violet)}
.zone .zl{font-family:var(--display);font-weight:800;font-size:19px;text-align:center;color:var(--violet-d);margin-bottom:8px}
.zones.order .zone .zl{width:38px;height:38px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;margin:0 auto 8px;font-size:18px}
.zones.match .zone .zl{margin:0;text-align:right;background:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 4px 0 var(--violet-s)}
.drop{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;justify-content:center;border-radius:14px}
.zones.sort .drop{min-height:120px}
.bank{margin-top:20px;min-height:76px;padding:14px;border-radius:22px;background:linear-gradient(180deg,var(--gold-s),#fff);border:2px solid #ffe08a;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.bank.hot{border-color:var(--gold-d)}
.bank:empty::before{content:"أحسنتِ! وُضعت جميع البطاقات ✨";color:#8a5a00;font-weight:700}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border:2px solid var(--violet-s);border-radius:16px;padding:10px 16px;font-weight:800;font-size:clamp(16px,1.8vw,20px);
  box-shadow:0 5px 0 #d8cbff;cursor:grab;transition:transform .12s;text-align:center}
.chip:hover{transform:translateY(-2px)}
.chip.sel{background:var(--violet);color:#fff;border-color:var(--violet);box-shadow:0 5px 0 var(--violet-d);transform:scale(1.06)}
.chip.dragging{opacity:.3}
.chip.ghost{position:fixed;z-index:200;pointer-events:none;transform:rotate(-4deg) scale(1.08);box-shadow:0 16px 30px rgba(60,30,120,.3);cursor:grabbing}
.chip.right{background:var(--ok-s);border-color:var(--ok);box-shadow:0 5px 0 #9fe0c6;color:#0b5c41}
.chip.wrong{background:var(--bad-s);border-color:var(--bad);box-shadow:0 5px 0 #f5b3b6;animation:shake .45s}
.dnd-img{margin-top:16px;border-radius:18px;overflow:hidden;border:2px solid var(--line);animation:enter .4s both}
.dnd-img img{display:block;width:100%}
.inline-actions{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}

/* Picture */
.pic{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:26px;align-items:center}
.frame{position:relative;background:#fff;border-radius:24px;padding:12px;border:3px solid var(--sky-s);box-shadow:0 8px 0 var(--sky-s);transform:rotate(-1.5deg);cursor:zoom-in}
.frame img{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:14px}
.frame .zoom{position:absolute;bottom:10px;left:10px;background:var(--sky);color:#fff;border-radius:12px;padding:4px 10px;font-size:14px;font-weight:800}
.frame::before{content:"";position:absolute;top:-12px;right:40%;width:90px;height:24px;background:rgba(255,194,26,.55);transform:rotate(3deg);border-radius:4px}
.pic .opts{grid-template-columns:1fr}
.pic .q{font-size:clamp(22px,2.8vw,32px)}

/* Surprise boxes */
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 20px;padding:20px 4px;perspective:900px}
.gift{position:relative;border:0;background:none;padding:0;height:170px;display:grid;place-items:end center}
.gift .body{position:relative;width:132px;height:104px;border-radius:14px;background:linear-gradient(160deg,var(--c),var(--d));box-shadow:0 10px 0 rgba(0,0,0,.12),inset 0 -10px 0 rgba(0,0,0,.08);transform:rotateX(14deg)}
.gift .body::before{content:"";position:absolute;inset:0 calc(50% - 12px);background:var(--gold);box-shadow:inset 0 -8px 0 var(--gold-d)}
.gift .lid{position:absolute;bottom:96px;width:148px;height:36px;border-radius:12px;background:linear-gradient(160deg,var(--c),var(--d));box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .7s;transform-origin:20% 100%}
.gift .lid::before{content:"";position:absolute;inset:0 calc(50% - 13px);background:var(--gold)}
.gift .bow{position:absolute;bottom:126px;font-size:38px;transition:transform .7s,opacity .5s}
.gift .n{position:absolute;bottom:34px;font-family:var(--display);font-weight:800;font-size:30px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2);z-index:2}
.gift:hover .body{animation:wiggle .5s}
@keyframes wiggle{25%{transform:rotateX(14deg) rotate(-4deg)}75%{transform:rotateX(14deg) rotate(4deg)}}
.gift.open .lid{transform:translate(-30px,-70px) rotate(-35deg);opacity:0}
.gift.open .bow{transform:translateY(-90px) scale(1.4);opacity:0}
.gift.used{opacity:.5;filter:grayscale(.5)}
.gift.used .lid,.gift.used .bow{display:none}
.gift.used .n::after{content:" ✓"}
.gift-q{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(80px)}to{opacity:1;transform:none}}
.cheer{text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(26px,3.6vw,40px);color:var(--pink);margin-top:14px;animation:pop .5s both}

/* Challenge flip */
.flip{position:relative;height:clamp(360px,48vh,460px);transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1);cursor:pointer}
.flip.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#fff,var(--s))}
.face .q{margin:14px 0}
.face .ans{font-size:clamp(19px,2.2vw,25px);font-weight:600;max-width:820px;line-height:1.7}
.face .hint{color:var(--muted);font-weight:700;font-size:15px}
.lvl{display:inline-flex;gap:6px;align-items:center}
.cd{font-variant-numeric:tabular-nums}

/* ---------- harvest ---------- */
.harvest{text-align:center}
.harvest h1{font-size:clamp(36px,5vw,60px)}
.harvest .thanks{font-size:clamp(19px,2.2vw,25px);max-width:760px;margin:10px auto 6px}
.harvest .motto2{display:inline-block;font-family:var(--display);font-weight:800;font-size:clamp(20px,2.6vw,30px);color:#fff;background:linear-gradient(90deg,var(--pink),var(--violet));border-radius:999px;padding:6px 26px;margin:8px 0 18px;box-shadow:0 6px 0 var(--violet-d)}
.stats{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.stat{background:#fff;border:2px solid var(--line);border-radius:20px;padding:10px 22px;min-width:150px}
.stat b{display:block;font-family:var(--display);font-size:34px;line-height:1.1;color:var(--violet-d);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-weight:700;font-size:15px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;text-align:center}
.pcard{position:relative;background:#fff;border-radius:24px;padding:16px 12px 14px;border:3px solid var(--violet-s);box-shadow:0 8px 0 var(--violet-s);animation:pop .5s both}
.pcard.r1{border-color:#ffd65c;box-shadow:0 8px 0 #ffe08a;background:linear-gradient(180deg,var(--gold-s),#fff)}
.pcard.r2{border-color:#d5dbe8;box-shadow:0 8px 0 #e3e7f0}
.pcard.r3{border-color:#f5c9a8;box-shadow:0 8px 0 #f8dcc6}
.pcard .medal{position:absolute;top:-14px;right:-8px;font-size:34px}
.pcard svg{width:96px;height:112px}
.pcard h3{font-size:21px;margin-top:4px}
.pcard .cnt{font-weight:800;color:#8a5a00;font-variant-numeric:tabular-nums}
.empty{background:#fff;border:3px dashed var(--line);border-radius:24px;padding:30px;color:var(--muted);font-weight:700}

/* ---------- dock: صندوق نجوم عالماتي ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:3px solid var(--gold);box-shadow:0 -10px 30px rgba(90,47,224,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:14px;align-items:center;padding-block:10px;max-width:1500px}
.dock-title{position:absolute;top:-17px;right:max(24px,env(safe-area-inset-right,0px));background:var(--gold);color:#4a2c00;font-family:var(--display);font-weight:800;font-size:15px;border-radius:12px 12px 0 0;padding:2px 14px;box-shadow:0 -2px 0 var(--gold-d) inset}
.selcard{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#fffaf0,var(--gold-s));border:2px solid #ffe08a;border-radius:20px;padding:6px 14px 6px 8px;min-width:190px;max-width:260px;text-align:right;border-style:solid}
.selcard svg{width:58px;height:68px;flex:none}
.selcard .nm{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.selcard .ct{font-weight:800;color:#8a5a00;font-size:15px;font-variant-numeric:tabular-nums}
.selcard.none .nm{color:var(--muted);font-size:16px;white-space:normal}
.selcard.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.08)}}
.award{display:flex;gap:8px}
.aw{border:0;border-radius:16px;min-width:92px;min-height:64px;padding:4px 10px;font-weight:800;font-size:15px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#4a2c00;background:var(--gold-s);box-shadow:0 5px 0 #f3cf6b;transition:transform .1s}
.aw .s{font-size:19px;letter-spacing:-2px;color:var(--gold-d)}
.aw.a2{background:#ffe7a1;box-shadow:0 5px 0 #f0c043}
.aw.a4{background:linear-gradient(135deg,var(--gold),#ffdd6e);box-shadow:0 5px 0 var(--gold-d)}
.aw.a4 .s{color:#9a5a00}
.aw:active{transform:translateY(4px);box-shadow:0 1px 0 #f0c043}
.aw small{font-size:12px;font-weight:700;opacity:.85}
.strip{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 8px;scroll-behavior:smooth;min-width:0}
.strip::-webkit-scrollbar{height:8px}.strip::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.stu{flex:none;display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px 4px 6px;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--line);max-width:190px}
.stu svg{width:28px;height:33px;flex:none}
.stu .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu .c{background:var(--gold-s);color:#8a5a00;border-radius:999px;padding:0 8px;font-size:14px;font-variant-numeric:tabular-nums}
.stu.on{border-color:var(--pink);background:var(--pink-s);box-shadow:0 4px 0 var(--pink)}
.stu.flash{background:var(--sky-s);border-color:var(--sky)}
.stu.bump{animation:bump .5s}
.add-quick{flex:none;display:flex;gap:6px;align-items:center}
.add-quick input{width:150px;height:44px;border:2px dashed #d6c8ff;border-radius:14px;padding:0 10px;background:#fff}
.dtools{display:flex;gap:6px}
.dock-pill{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:max(14px,env(safe-area-inset-left,0px));z-index:40}
.shakeit{animation:shake .45s}

.fly{position:fixed;z-index:300;pointer-events:none;width:40px;height:40px;margin:-20px 0 0 -20px}
.fly svg{width:100%;height:100%;fill:var(--gold);filter:drop-shadow(0 2px 0 var(--gold-d)) drop-shadow(0 0 10px rgba(255,194,26,.8))}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:250;width:100%;height:100%}

/* ---------- modals & toast ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(42,27,74,.45);display:grid;place-items:center;padding:16px}
.mbox{position:relative;background:#fff;border-radius:28px;max-width:720px;width:100%;max-height:min(88vh,900px);overflow:auto;padding:24px;box-shadow:0 30px 70px rgba(42,27,74,.35);animation:pop .4s both}
.mbox h2{font-size:28px;margin-bottom:8px}
.mx{position:absolute;top:12px;left:12px}
.zoomimg{max-width:1000px;text-align:center} .zoomimg img{max-height:78vh;border-radius:16px}
.bal{text-align:center}
.bal svg{width:170px;height:200px}
.bal .big{font-family:var(--display);font-weight:800;font-size:44px;color:#8a5a00;line-height:1;font-variant-numeric:tabular-nums}
.bal .row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.hist{margin-top:14px;font-size:15px;color:var(--muted);text-align:right;max-height:150px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-weight:800}
.field textarea,.field input{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--paper);width:100%}
.mlist{display:grid;gap:8px;margin:12px 0}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;align-items:center}
.mrow input{border:2px solid var(--line);border-radius:12px;padding:8px 10px;width:100%;min-width:0}
.mrow input[type=number]{text-align:center;font-variant-numeric:tabular-nums}
.danger{--c:var(--bad);--d:#a8262d}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.note{font-size:15px;color:var(--muted)}
hr.sep{border:0;border-top:2px dashed var(--line);margin:18px 0}
.toast{position:fixed;top:calc(80px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:400;background:var(--ink);color:#fff;font-weight:800;border-radius:16px;padding:10px 20px;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:pop .3s both;max-width:calc(100% - 32px);text-align:center}

footer.sign{position:relative;z-index:1;text-align:center;padding:26px 16px 10px;color:var(--muted);font-weight:700}
footer.sign b{font-family:var(--display);font-size:22px;color:var(--violet-d)}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .dock .wrap{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"sel aw" "strip strip" "tools tools"}
  .selcard{grid-area:sel;min-width:0}.award{grid-area:aw;justify-content:flex-end}.strip{grid-area:strip}.dtools{grid-area:tools;justify-content:center}
  :root{--dock-h:250px}
}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding:22px;text-align:center}.hero .row{justify-content:center}.mascot{width:150px}
  .opts{grid-template-columns:1fr}.pic{grid-template-columns:1fr}
  .zones.match .zone{grid-template-columns:1fr}
  .aw{min-width:70px;font-size:13px}
  .top .wrap{gap:8px}.brand span{display:none}
}
@media (max-width:520px){
  .dock .wrap{grid-template-columns:1fr;grid-template-areas:"sel" "aw" "strip" "tools"}
  .award{justify-content:center}.selcard{max-width:none}
  :root{--dock-h:330px}
  .tfb .btn{min-width:140px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- print: harvest board only ---------- */
@media print{
  body{background:#fff;padding:0}
  .top,.dock,.dock-pill,.twk,.noprint,.toast,#confetti{display:none!important}
  .pcard{break-inside:avoid;box-shadow:none}
  main{padding:0}
}
</style>

<script>
/* =====================================================================

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ar=n=>Number(n).toLocaleString('ar-EG');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

const view=$('#view');

/* ---------- storage ---------- */
const KEY='ulama-stars-v1';
let S={students:[],sel:null,log:[],sound:true,goal:20,pos:{},opened:[]};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.students))S=Object.assign(S,d)}catch(e){}}

const stu=id=>S.students.find(s=>s.id===id);

/* ---------- sound ---------- */
let AC=null;
function tone(seq){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;
  seq.forEach(([f,t,d,type,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+t);g.gain.linearRampToValueAtTime(v||.18,t0+t+.02);g.gain.exponentialRampToValueAtTime(.001,t0+t+d);o.connect(g).connect(AC.destination);o.start(t0+t);o.stop(t0+t+d+.05)})}catch(e){}}
const SND={
  star:()=>tone([[1318,0,.25,'triangle'],[1760,.08,.3,'triangle']]),
  award:n=>tone([[784,0,.2],[988,.1,.2],[1175,.2,.25],...(n>=2?[[1568,.3,.35,'triangle']]:[]),...(n>=4?[[1976,.42,.45,'triangle'],[2349,.55,.5,'triangle']]:[])]),
  ok:()=>tone([[660,0,.15,'triangle'],[880,.12,.3,'triangle']]),
  no:()=>tone([[220,0,.25,'square',.06],[180,.12,.3,'square',.05]]),

/* ---------- jar drawing ---------- */
function jar(n,opts={}){
  const goal=S.goal||20, cap=Math.min(n,goal), lvl=Math.min(n/goal,1);
  const id='j'+uid(); let stars='';
  if(opts.stars!==false){const per=5;for(let i=0;i<cap;i++){const r=i/per|0,c=i%per;const x=18+c*14.5+(r%2?7:0)-(r%2&&c===per-1?7:0),y=103-r*14.5;stars+=`<use href="#starp" transform="translate(${x-7} ${y-7}) scale(.14)" fill="#ffc21a" stroke="#e09600" stroke-width="5"/>`}}
  const fy=114-lvl*84;
  return `<svg viewBox="0 0 100 120" aria-hidden="true"><defs><clipPath id="${id}"><rect x="10" y="26" width="80" height="90" rx="18"/></clipPath>
    <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d6"/><stop offset="1" stop-color="#ffe08a"/></linearGradient></defs>
    <rect x="10" y="26" width="80" height="90" rx="18" fill="#ffffff" stroke="#c9b6ff" stroke-width="3"/>
    <g clip-path="url(#${id})"><rect x="0" y="${fy}" width="100" height="120" fill="url(#${id}g)"/>${stars}</g>
    <rect x="10" y="26" width="80" height="90" rx="18" fill="none" stroke="#c9b6ff" stroke-width="3"/>
    <path d="M22 40 Q20 70 24 100" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>
    <rect x="22" y="12" width="56" height="16" rx="6" fill="#ff4f9a" stroke="#d42f77" stroke-width="2"/>
    <rect x="30" y="6" width="40" height="8" rx="4" fill="#ffc21a"/>
    ${n>goal?`<text x="50" y="74" text-anchor="middle" font-size="22" font-weight="800" fill="#8a5a00" font-family="Tajawal">+${n-goal}</text>`:''}</svg>`;
}

/* ---------- toast / modal ---------- */
let toastT;
function toast(msg){$$('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2300)}
function modal(html,cls=''){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="mbox ${cls}" role="dialog" aria-modal="true"><button class="ibtn mx" data-close aria-label="إغلاق">✕</button>${html}</div>`;
  m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]'))close()});
  const close=()=>{m.remove();document.removeEventListener('keydown',k)};const k=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',k);
  $('#modalRoot').append(m);m.close=close;return m}
function ask(msg,yes='نعم',cls='danger'){return new Promise(res=>{const m=modal(`<h2>تأكيد</h2><p style="font-size:19px">${msg}</p><div class="btnrow"><button class="btn ${cls}" id="cy">${yes}</button><button class="btn ghost" id="cn">إلغاء</button></div>`);
  $('#cy',m).onclick=()=>{m.close();res(true)};$('#cn',m).onclick=()=>{m.close();res(false)}})}

/* ---------- confetti ---------- */
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
function confetti(n=120,ox,oy){if(RM)return;cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const cols=['#ff4f9a','#7b4dff','#1fb2ec','#ffc21a','#ffc21a'];ox=ox??innerWidth/2;oy=oy??innerHeight/3;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*9;parts.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,s:6+Math.random()*9,c:cols[i%5],star:Math.random()<.45,life:0})}
  if(!raf)raf=requestAnimationFrame(step)}
function drawStar(s){cx.beginPath();for(let i=0;i<10;i++){const r=i%2?s*.42:s,a=-Math.PI/2+i*Math.PI/5;cx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}cx.closePath();cx.fill()}
function step(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life<140&&p.y<innerHeight+40);
  for(const p of parts){p.life++;p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(0,1-p.life/140);cx.fillStyle=p.c;
    if(p.star)drawStar(p.s);else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
  raf=parts.length?requestAnimationFrame(step):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight)}

const total=()=>S.students.reduce((a,s)=>a+s.stars,0);
function addNames(text){const names=text.split(/[\n,،]+/).map(s=>s.trim()).filter(Boolean);let added=0;
  for(const n of names){if(!S.students.some(s=>s.name===n)){S.students.push({id:uid(),name:n,stars:0});added++}}
  if(added&&!S.sel)S.sel=S.students[S.students.length-added].id;save();renderDock();return added}
function quickAdd(){const i=$('#quickName');if(!i.value.trim())return i.focus();const n=addNames(i.value);toast(n?`أُضيفت ${ar(n)} ${n===1?'طالبة':'طالبات'} 💜`:'الاسم موجود مسبقًا');renderDock();setTimeout(()=>$('#quickName')?.focus(),0)}
strip.addEventListener('click',e=>{const b=e.target.closest('.stu');if(!b)return;if(S.sel===b.dataset.id){openBalance(b.dataset.id);return}S.sel=b.dataset.id;save();renderDock();SND.tick()});
selcard.onclick=()=>{if(S.sel)openBalance(S.sel);else if(!S.students.length)openManage();else toast('اضغطي على اسم طالبة من الشريط')};

function award(n,fromEl){
  const s=stu(S.sel);
  if(!s){dock.classList.remove('shakeit');void dock.offsetWidth;dock.classList.add('shakeit');toast(S.students.length?'اختاري اسم الطالبة أولًا 👇':'أضيفي أسماء الطالبات أولًا ⚙');SND.no();return}
  s.stars+=n;S.log.push({sid:s.id,n,t:Date.now()});save();
  const label=n===1?'نجمة':n===2?'نجمتان':'٤ نجوم';
  const finish=()=>{renderDock();selcard.classList.add('bump');const c=$(`.stu[data-id="${s.id}"]`);c&&c.classList.add('bump');if(n>=4)confetti(160);else if(n>=2)confetti(50,selcard.getBoundingClientRect().left+60,selcard.getBoundingClientRect().top)};
  SND.award(n);toast(`${label} لـ ${s.name} ✨`);
  if(RM||dock.hidden){finish();return}
  flyStars(n,fromEl||$(`.aw[data-n="${n}"]`),selcard,finish);
}
function flyStars(n,from,to,done){
  const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
  const tx=b.left+40,ty=b.top+b.height/2;let left=n;
  for(let i=0;i<n;i++){const f=document.createElement('div');f.className='fly';f.innerHTML=STAR_SVG;const sx=a.left+a.width/2+(i-(n-1)/2)*18,sy=a.top+a.height/2;f.style.left=sx+'px';f.style.top=sy+'px';document.body.append(f);
    const dx=tx-sx,dy=ty-sy;
    const an=f.animate([{transform:'translate(0,0) scale(.4) rotate(0)',opacity:0},{transform:`translate(${dx*.1}px,${-150-i*14}px) scale(1.7) rotate(160deg)`,opacity:1,offset:.35},{transform:`translate(${dx}px,${dy}px) scale(.5) rotate(400deg)`,opacity:.9}],{duration:900,delay:i*150,easing:'cubic-bezier(.4,0,.3,1)',fill:'both'});
    an.onfinish=()=>{f.remove();SND.star();if(--left===0)done()}}
}
$$('.aw').forEach(b=>b.onclick=()=>award(+b.dataset.n,b));
$('#undoBtn').onclick=()=>{const l=S.log.pop();if(!l)return;const s=stu(l.sid);if(s)s.stars=Math.max(0,s.stars-l.n);save();renderDock();toast(`تم التراجع: ${ar(l.n)} من رصيد ${s?s.name:''}`)};
$('#randBtn').onclick=()=>{if(S.students.length<2){toast('أضيفي طالبتين على الأقل');return}let k=0;const ids=S.students.map(s=>s.id);const pick=ids[Math.random()*ids.length|0];const steps=14+(Math.random()*6|0);
  const go=()=>{const id=k<steps?ids[k%ids.length]:pick;$$('.stu').forEach(c=>c.classList.toggle('flash',c.dataset.id===id));const c=$(`.stu[data-id="${id}"]`);c&&c.scrollIntoView({block:'nearest',inline:'center'});SND.tick();
    if(k++<steps)setTimeout(go,60+k*12);else{S.sel=pick;save();renderDock();SND.ok();toast(`🎲 ${stu(pick).name}`)}};go()};
$('#boardBtn').onclick=openBoard;$('#manageBtn').onclick=openManage;
$('#minBtn').onclick=()=>setDockMin(true);$('#dockPill').onclick=()=>setDockMin(false);
function setDockMin(v){dock.hidden=v;$('#dockPill').hidden=!v;document.body.classList.toggle('dock-min',v)}

function openBalance(id){const s=stu(id);if(!s)return;
  const hist=S.log.filter(l=>l.sid===id).slice(-12).reverse();
  const m=modal(`<div class="bal"><h2>${esc(s.name)}</h2>${jar(s.stars)}<div class="big">${ar(s.stars)}</div><div class="note">${starWord(s.stars)} في صندوقها · يمتلئ الصندوق عند ${ar(S.goal)} نجمة</div>
    <div class="row"><button class="btn sm ghost" data-d="-1">− نجمة</button><button class="btn sm gold" data-d="1">+ نجمة</button><button class="btn sm gold" data-d="2">+ نجمتان</button><button class="btn sm gold" data-d="4">+ ٤ نجوم</button></div>
    <div class="row"><input id="balSet" type="number" min="0" value="${s.stars}" style="width:110px;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center"><button class="btn sm sky" id="balApply">تعديل الرصيد</button></div>
    ${hist.length?`<div class="hist"><b>آخر النجوم:</b> ${hist.map(h=>`+${ar(h.n)} (${new Date(h.t).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})})`).join(' · ')}</div>`:''}</div>`);
  $$('[data-d]',m).forEach(b=>b.onclick=()=>{const d=+b.dataset.d;m.close();S.sel=id;if(d>0){award(d)}else{s.stars=Math.max(0,s.stars-1);const li=S.log.map(l=>l.sid).lastIndexOf(id);if(li>-1){S.log[li].n--;if(S.log[li].n<=0)S.log.splice(li,1)}save();renderDock();toast(`حُذفت نجمة من ${s.name}`)}});
  $('#balApply',m).onclick=()=>{const v=Math.max(0,parseInt($('#balSet',m).value)||0);s.stars=v;S.log=S.log.filter(l=>l.sid!==id);save();renderDock();m.close();toast(`رصيد ${s.name}: ${ar(v)}`)}}

function ranked(){return [...S.students].filter(s=>s.stars>0).sort((a,b)=>b.stars-a.stars)}
function boardHTML(list){if(!list.length)return `<div class="empty">لم تُمنح نجوم بعد ✨ اختاري طالبة وامنحيها نجومها من الصندوق في الأسفل.</div>`;
  let rank=0,prev=null;return `<div class="board">${list.map((s,i)=>{if(s.stars!==prev){rank=i+1;prev=s.stars}const md=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'';
    return `<div class="pcard ${rank<=3?'r'+rank:''}" style="animation-delay:${Math.min(i*.05,1)}s">${md?`<span class="medal">${md}</span>`:''}${jar(s.stars)}<h3>${esc(s.name)}</h3><div class="cnt">⭐ ${ar(s.stars)} ${starWord(s.stars)}</div></div>`}).join('')}</div>`}
function openBoard(){modal(`<h2>🏆 نجمات الحصة</h2><p class="note">ترتيب الطالبات حسب نجومهن الآن.</p>${boardHTML(ranked())}<div class="btnrow"><a class="btn sm pink" href="#harvest" data-close>حصاد نجماتنا 🌟</a></div>`)}

function openManage(){
  const m=modal(`<h2>⚙ إدارة صندوق النجوم</h2>
    <div class="field"><label for="bulk">إضافة أسماء الطالبات (اسم في كل سطر، أو افصلي بفاصلة)</label><textarea id="bulk" rows="4" placeholder="سارة&#10;ريم&#10;لمى"></textarea><div><button class="btn sm" id="bulkAdd">إضافة الأسماء</button></div></div>
    <hr class="sep"><b>الطالبات (${ar(S.students.length)})</b><p class="note" style="margin:0">عدّلي الاسم أو عدد النجوم مباشرة، أو احذفي طالبة.</p>
    <div class="mlist" id="mlist">${S.students.map(s=>`<div class="mrow" data-id="${s.id}"><input value="${esc(s.name)}" data-f="name" aria-label="اسم الطالبة"><input type="number" min="0" value="${s.stars}" data-f="stars" aria-label="عدد النجوم"><button class="ibtn" data-del title="حذف">🗑</button></div>`).join('')||'<p class="note">لا توجد أسماء بعد.</p>'}</div>
    <div class="field" style="max-width:260px"><label for="goalIn">عدد النجوم لامتلاء الصندوق</label><input id="goalIn" type="number" min="4" max="100" value="${S.goal}"></div>
    <hr class="sep"><b>الحفظ والنسخ الاحتياطي</b>
    <div class="btnrow"><button class="btn sm sky" id="expJson">⬇ نسخة احتياطية</button><label class="btn sm ghost" for="impFile">⬆ استعادة نسخة</label><input id="impFile" type="file" accept=".json,application/json" hidden><button class="btn sm ghost" id="expCsv">⬇ النتائج (Excel)</button></div>
    <hr class="sep"><b>حصة جديدة</b><p class="note" style="margin:4px 0">«بدء حصة جديدة» يصفّر النجوم ويُبقي الأسماء. احفظي نسخة احتياطية أولًا إن أردتِ الاحتفاظ بالرصيد السابق.</p>
    <div class="btnrow"><button class="btn sm gold" id="newSess">↻ بدء حصة جديدة</button><button class="btn sm danger" id="wipe">حذف كل البيانات</button></div>`);
  $('#bulkAdd',m).onclick=()=>{const n=addNames($('#bulk',m).value);m.close();toast(n?`أُضيفت ${ar(n)} ${n<=2||n>10?'طالبة':'طالبات'} 💜`:'لم تُضف أسماء جديدة');openManage()};
  $('#mlist',m).addEventListener('change',e=>{const r=e.target.closest('.mrow');if(!r)return;const s=stu(r.dataset.id);if(!s)return;
    if(e.target.dataset.f==='name'&&e.target.value.trim())s.name=e.target.value.trim();
    if(e.target.dataset.f==='stars'){s.stars=Math.max(0,parseInt(e.target.value)||0);S.log=S.log.filter(l=>l.sid!==s.id)}save();renderDock()});
  $('#mlist',m).addEventListener('click',async e=>{const b=e.target.closest('[data-del]');if(!b)return;const id=b.closest('.mrow').dataset.id;const s=stu(id);m.close();
    if(await ask(`حذف «${esc(s.name)}» ونجومها؟`,'حذف')){S.students=S.students.filter(x=>x.id!==id);S.log=S.log.filter(l=>l.sid!==id);if(S.sel===id)S.sel=null;save();renderDock()}openManage()});
  $('#goalIn',m).onchange=e=>{S.goal=Math.min(100,Math.max(4,parseInt(e.target.value)||20));save();renderDock()};
  $('#expJson',m).onclick=exportJson;$('#expCsv',m).onclick=exportCsv;
  $('#impFile',m).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.students))throw 0;
    S.students=d.students.map(s=>({id:s.id||uid(),name:String(s.name),stars:Math.max(0,+s.stars||0)}));S.log=Array.isArray(d.log)?d.log:[];S.goal=d.goal||S.goal;S.sel=null;save();renderDock();m.close();toast('تمت استعادة النسخة ✔');openManage()}catch(err){toast('الملف غير صالح')}};r.readAsText(f)};
  $('#newSess',m).onclick=async()=>{m.close();if(await ask('تصفير نجوم جميع الطالبات مع الإبقاء على الأسماء؟','ابدئي حصة جديدة','gold')){S.students.forEach(s=>s.stars=0);S.log=[];S.opened=[];S.pos={};save();renderDock();route();toast('حصة جديدة! بالتوفيق 🌟')}};
  $('#wipe',m).onclick=async()=>{m.close();if(await ask('حذف جميع الأسماء والنجوم نهائيًا؟','حذف الكل')){S.students=[];S.log=[];S.sel=null;S.opened=[];save();renderDock();route()}};
}
const stamp=()=>new Date().toISOString().slice(0,10);
function download(name,content,type){try{const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('تم الحفظ ⬇')}catch(e){toast('تعذّر التنزيل في هذا المتصفح؛ استخدمي «نسخ النتائج»')}}
function exportJson(){download(`نجوم-عالماتي-${stamp()}.json`,JSON.stringify({app:'تحدي العالمات الصغيرات',date:new Date().toISOString(),goal:S.goal,students:S.students,log:S.log},null,2),'application/json')}
function exportCsv(){const rows=[['الترتيب','اسم الطالبة','عدد النجوم']];[...S.students].sort((a,b)=>b.stars-a.stars).forEach((s,i)=>rows.push([i+1,s.name,s.stars]));
  download(`نتائج-حصة-المراجعة-${stamp()}.csv`,'﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function resultsText(){return `حصاد نجماتنا 🌟 — ${new Date().toLocaleDateString('ar-EG')}\n`+ranked().map((s,i)=>`${ar(i+1)}. ${s.name}: ${ar(s.stars)} ⭐`).join('\n')+'\nكل مشاركة تقربكِ من الإتقان 💜\nأ/ شامه البقمي'}

function renderNav(h){$('#nav').innerHTML=`<a href="#home" class="${h==='home'?'on':''}">الرئيسية</a>`+SECTIONS.map((s,i)=>`<a href="#${s.id}" class="${h===s.id?'on':''}">${s.icon} ${s.title}</a>`).join('')+`<a href="#harvest" class="${h==='harvest'?'on':''}">🌟 حصاد نجماتنا</a>`;
  const on=$('#nav a.on');on&&on.scrollIntoView({block:'nearest',inline:'center'})}
let cur={sec:null,i:0,reveal:null};
function route(){const h=(location.hash||'#home').slice(1);const sec=SECTIONS.find(s=>s.id===h);cur={sec:null,i:0,reveal:null};
  if(sec)renderSection(sec);else if(h==='harvest')renderHarvest();else renderHome();renderNav(sec?h:h==='harvest'?'harvest':'home');scrollTo({top:0,behavior:RM?'auto':'smooth'})}
addEventListener('hashchange',route);

  </section>

  <div class="cards">${SECTIONS.map((s,i)=>`<a class="scard ${COLOR[s.color]}" href="#${s.id}"><span class="num">${ar(i+1)}</span><span class="ico">${s.icon}</span><h3>${s.title}</h3><p>${s.desc}</p><div class="meta"><span class="tag">${ar(s.items.length)} ${s.kind==='dnd'?'أنشطة':s.kind==='boxes'?'صناديق':'أسئلة'}</span><span class="tag">≈ ${ar(s.kind==='dnd'?8:s.kind==='mcq'||s.kind==='tf'?6:7)} دقائق</span></div></a>`).join('')}
    <a class="scard c-ok" href="#harvest"><span class="num">★</span><span class="ico">🌟</span><h3>حصاد نجماتنا</h3><p>ختام الحصة: لوحة نجمات الحصة ورسالة الشكر</p><div class="meta"><span class="tag">طباعة وحفظ</span></div></a>
  </div>`;
}

function renderSection(sec){
  cur.sec=sec;cur.i=Math.min(S.pos[sec.id]||0,sec.items.length-1);
  const c=COLOR[sec.color];const isBox=sec.kind==='boxes';
  view.innerHTML=`<div class="shead ${c}"><span class="ico">${sec.icon}</span><div class="grow"><h2>${sec.title}</h2><p>${sec.desc}</p></div>${isBox?'':`<div class="dots" id="dots"></div>`}</div>
    <div class="stage ${c}" id="stage"></div>
    <div class="ctrl noprint" id="ctrl">${isBox?`<button class="btn gold" id="revealBtn" hidden>💡 إظهار الإجابة</button><button class="btn ghost" id="backBoxes" hidden>🎁 العودة للصناديق</button>`
      :`<button class="btn ghost" id="prevBtn" aria-label="السابق">→ السابق</button><button class="btn gold" id="revealBtn">💡 إظهار الإجابة</button><span class="count" id="count"></span><button class="btn" id="nextBtn">التالي ←</button>`}</div>`;
  $('#revealBtn').onclick=()=>cur.reveal&&cur.reveal();
  if(isBox){renderBoxes(sec);$('#backBoxes').onclick=()=>renderBoxes(sec);return}
  $('#prevBtn').onclick=()=>go(-1);$('#nextBtn').onclick=()=>go(1);
  showItem();
}
function go(d){const sec=cur.sec;if(!sec||sec.kind==='boxes')return;const n=cur.i+d;
  if(n<0)return;if(n>=sec.items.length){const idx=SECTIONS.indexOf(sec);location.hash=idx<SECTIONS.length-1?SECTIONS[idx+1].id:'harvest';return}cur.i=n;showItem()}
function showItem(){const sec=cur.sec,it=sec.items[cur.i];S.pos[sec.id]=cur.i;save();
  const st=$('#stage');st.innerHTML='';cur.reveal=null;const el=RENDER[sec.kind](it,cur.i,sec);el.classList.add('enter');st.append(el);
  $('#dots').innerHTML=sec.items.map((_,i)=>`<button class="${i===cur.i?'on':''}" data-i="${i}" aria-label="سؤال ${i+1}">${ar(i+1)}</button>`).join('');
  $$('#dots button').forEach(b=>b.onclick=()=>{cur.i=+b.dataset.i;showItem()});
  $('#count').textContent=`${ar(cur.i+1)} من ${ar(sec.items.length)}`;
  $('#prevBtn').disabled=cur.i===0;
  const idx=SECTIONS.indexOf(sec);$('#nextBtn').textContent=cur.i<sec.items.length-1?'التالي ←':(idx<SECTIONS.length-1?'القسم التالي ←':'حصاد نجماتنا ←');
  $('#revealBtn').disabled=false;}
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function explain(el,ok,txt,title){$$('.explain',el).forEach(x=>x.remove());const e=h('div','explain'+(ok?'':' no'),`<b>${title||(ok?'✔ الإجابة الصحيحة':'✘')}</b> ${txt}`);el.append(e);return e}
function cheer(){return CHEERS[Math.random()*CHEERS.length|0]}

/* ---------- renderers ---------- */
function mcqBlock(card,it){
  const opts=h('div','opts');const L=['أ','ب','ج','د'];
  it.o.forEach((t,i)=>{const b=h('button','opt',`<span class="st">${STAR_SVG}<i>${L[i]}</i></span><span>${esc(t)}</span>`);b.onclick=()=>pick(i,b);opts.append(b)});
  card.append(opts);let done=false;
  function pick(i,b){if(done)return;if(i===it.a){reveal(b)}else{b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');SND.no()}}
  function reveal(b){if(done)return;done=true;const btns=$$('.opt',opts);btns.forEach((x,k)=>{x.classList.remove('wrong');if(k===it.a)x.classList.add('right');else x.classList.add('dim')});
    SND.ok();const r=btns[it.a].getBoundingClientRect();confetti(b?60:30,r.left+40,r.top+30);explain(card,true,it.why,b?cheer():'✔ الإجابة الصحيحة:');$('#revealBtn').disabled=true}
  cur.reveal=()=>reveal(null);
}
const RENDER={
  mcq(it,i,sec){const c=h('div','card');c.innerHTML=`<span class="qbadge">⭐ السؤال ${ar(i+1)}</span><div class="q">${esc(it.q)}</div>`;mcqBlock(c,it);return c},
  tf(it,i){const c=h('div','card');c.innerHTML=`<span class="qbadge">🔍 العبارة ${ar(i+1)}</span><div class="tf-note"><span class="flask">🧪</span><div class="q">${esc(it.s)}</div></div>
      <div class="tfb"><button class="btn sky" data-v="1">✔ صحيحة</button><button class="btn pink" data-v="0">✘ خاطئة</button></div>`;
    let done=false;const reveal=(b)=>{if(done)return;done=true;const rb=$(`[data-v="${it.t?1:0}"]`,c);rb.classList.add('right');$$('.tfb .btn',c).forEach(x=>{if(x!==rb)x.style.opacity=.4});
      SND.ok();if(b)confetti(50);explain(c,true,(it.t?'':'<br>')+esc(it.fix),it.t?(b?cheer()+' العبارة صحيحة:':'✔ العبارة صحيحة:'):(b?cheer()+' العبارة خاطئة، والتصحيح:':'✘ العبارة خاطئة، والتصحيح:'));$('#revealBtn').disabled=true};
    $$('.tfb .btn',c).forEach(b=>b.onclick=()=>{if(done)return;if((b.dataset.v==='1')===it.t)reveal(b);else{b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');SND.no()}});
    cur.reveal=()=>reveal(null);return c},

/* ---------- drag & drop ---------- */
function makeDnd(it,i){
  const c=h('div','card');let zones,chips,kind=it.type;
  if(kind==='order'){zones=it.items.map((t,k)=>({label:ar(k+1),acc:['c'+k]}));chips=it.items.map((t,k)=>({id:'c'+k,t}))}
  else if(kind==='match'){zones=it.pairs.map((p,k)=>({label:p[0],acc:['c'+k]}));chips=it.pairs.map((p,k)=>({id:'c'+k,t:p[1]}))}
  else{let k=0;zones=it.groups.map(g=>({label:g.name,acc:g.items.map(()=>'c'+(k++))}));k=0;chips=it.groups.flatMap(g=>g.items.map(t=>({id:'c'+(k++),t})))}
  const cap=kind==='sort'?99:1;
  const kindName={order:'ترتيب',match:'مطابقة',sort:'تصنيف'}[kind];
  c.innerHTML=`<span class="qbadge">🧩 نشاط ${ar(i+1)} • ${kindName}</span><div class="q">${esc(it.title)}</div>
    <div class="dnd-prompt">✋ اسحبي البطاقة إلى مكانها، أو اضغطي البطاقة ثم اضغطي المكان.</div>
    <div class="zones ${kind}">${zones.map((z,k)=>`${kind==='order'&&k?'<span class="arrow" aria-hidden="true">←</span>':''}<div class="zone" data-z="${k}"><div class="zl">${esc(z.label)}</div><div class="drop"></div></div>`).join('')}</div>
    <div class="bank">${shuffle(chips).map(ch=>`<div class="chip" data-id="${ch.id}" tabindex="0">${esc(ch.t)}</div>`).join('')}</div>
    <div class="inline-actions"><button class="btn sm sky" data-check>✔ تحققي</button><button class="btn sm ghost" data-reset>↺ إعادة</button></div>`;
  const bank=$('.bank',c);
  function place(chip,target){chip.classList.remove('right','wrong','sel');
    if(target.classList.contains('zone')){const d=$('.drop',target);if(cap===1&&d.children.length){const old=d.firstElementChild;if(old===chip)return;bank.append(old);old.classList.remove('right','wrong')}d.append(chip)}else bank.append(chip);SND.tick()}
  function check(silent){let all=true,placed=0;$$('.chip',c).forEach(ch=>{const z=ch.closest('.zone');ch.classList.remove('right','wrong');if(!z){all=false;return}placed++;const ok=zones[+z.dataset.z].acc.includes(ch.dataset.id);ch.classList.add(ok?'right':'wrong');if(!ok)all=false});
    if(silent)return all;if(all){SND.ok();confetti(90);toast(cheer())}else{SND.no();toast(placed<chips.length?'ما زالت هناك بطاقات لم توضع بعد':'راجعي البطاقات الحمراء 💭')}return all}
  function reveal(){$$('.chip',c).forEach(ch=>{const k=zones.findIndex(z=>z.acc.includes(ch.dataset.id));$('.drop',$(`.zone[data-z="${k}"]`,c)).append(ch)});
    if(kind!=='sort'){/* keep zone order */}check(true);SND.ok();
    if(it.img&&!$('.dnd-img',c)){c.append(h('div','dnd-img',`<img src="${IMGS[it.img]}" alt="صورة توضيحية من ملف المراجعة">`))}}
  cur.reveal=reveal;
  $('[data-check]',c).onclick=()=>{check();if(it.img&&check(true)&&!$('.dnd-img',c))c.append(h('div','dnd-img',`<img src="${IMGS[it.img]}" alt="">`))};
  $('[data-reset]',c).onclick=()=>{shuffle($$('.chip',c)).forEach(ch=>{ch.classList.remove('right','wrong','sel');bank.append(ch)});$('.dnd-img',c)?.remove()};
  // pointer drag + tap-to-place
  let sel=null;
  c.addEventListener('pointerdown',e=>{const ch=e.target.closest('.chip');if(!ch||e.button>0)return;e.preventDefault();
    const sx=e.clientX,sy=e.clientY,r=ch.getBoundingClientRect();let ghost=null,hot=null;
    const mv=ev=>{if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){ghost=ch.cloneNode(true);ghost.classList.add('ghost');ghost.classList.remove('sel','right','wrong');ghost.style.width=r.width+'px';document.body.append(ghost);ch.classList.add('dragging')}
      if(ghost){ghost.style.left=(ev.clientX-r.width/2)+'px';ghost.style.top=(ev.clientY-r.height/2)+'px';const t=document.elementFromPoint(ev.clientX,ev.clientY);const z=t&&t.closest('.zone,.bank');if(hot&&hot!==z)hot.classList.remove('hot');if(z&&c.contains(z)){z.classList.add('hot');hot=z}}};
    const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);hot&&hot.classList.remove('hot');
      if(ghost){ghost.remove();ch.classList.remove('dragging');const t=document.elementFromPoint(ev.clientX,ev.clientY);const z=t&&t.closest('.zone,.bank');if(z&&c.contains(z))place(ch,z);if(sel){sel.classList.remove('sel');sel=null}}
      else{if(sel===ch){ch.classList.remove('sel');sel=null}else{sel&&sel.classList.remove('sel');sel=ch;ch.classList.add('sel')}}};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)});
  c.addEventListener('click',e=>{if(!sel||e.target.closest('.chip'))return;const z=e.target.closest('.zone,.bank');if(z){place(sel,z);sel=null}});
  c.addEventListener('keydown',e=>{const ch=e.target.closest('.chip');if(ch&&(e.key==='Enter'||e.key===' ')){e.preventDefault();sel&&sel.classList.remove('sel');sel=ch;ch.classList.add('sel')}});
  return c;
}
