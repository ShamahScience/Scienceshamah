<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعلّم وأربح – رحلة الطاقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --green: #1b5e20; --leaf: #2f8a3a; --mint: #e3f4d7; --cream: #fffbef; --ink: #2b3245; --pink: #c2366f; --red: #d23b3b; --gold: #f5c242; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; font-family: 'Noto Naskh Arabic', Tahoma, serif; font-weight: 700; color: var(--ink);
    background: #f2f7ec radial-gradient(circle at 10% 5%, #e3f4d7 0, transparent 40%), radial-gradient(circle at 95% 95%, #dff1fb 0, transparent 40%);
    display: flex; justify-content: center; padding: 14px;
  }
  .app { width: 100%; max-width: 560px; }
  .flags { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; }
  .flags span { width: 26px; height: 18px; border-radius: 3px; background: var(--green); }
  .flags span:nth-child(even) { background: #fff; border: 2px solid var(--green); }
  .card { background: #fff; border: 3px solid var(--green); border-radius: 22px; padding: 18px 16px; box-shadow: 0 6px 0 #c8dfc0; }
  h1 { margin: 0 0 4px; font-size: 30px; color: var(--green); text-align: center; line-height: 1.4; }
  h2 { margin: 4px 0; font-size: 24px; color: var(--green); text-align: center; }
  .sub { text-align: center; margin: 4px 0 12px; font-size: 18px; line-height: 1.7; }
  .btn {
    display: block; width: 100%; border: 3px solid var(--ink); border-radius: 16px; padding: 11px 14px; margin: 9px 0;
    font: inherit; font-size: 20px; text-align: right; background: var(--cream); color: var(--ink); cursor: pointer; line-height: 1.6;
  }
  .btn:active { transform: scale(.98); }
  .btn.main { background: var(--leaf); color: #fff; text-align: center; font-size: 22px; border-color: var(--green); }
  .btn.ok { background: #c9f0c0; border-color: var(--leaf); }
  .btn.no { background: #fde2e2; border-color: var(--red); animation: shake .35s; }
  .btn:disabled { cursor: default; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar { flex: 1; height: 14px; border-radius: 10px; background: #e6eee1; overflow: hidden; border: 2px solid var(--green); }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #8fd18a, var(--leaf)); transition: width .4s; }
  .stars { font-size: 18px; white-space: nowrap; }
  .tag { display: inline-block; background: #fff3c4; border: 2px dashed var(--gold); border-radius: 12px; padding: 0 10px; font-size: 16px; color: var(--pink); }
  .q { font-size: 22px; margin: 8px 0 4px; line-height: 1.7; }
  .emoji { font-size: 44px; text-align: center; margin: 2px 0; letter-spacing: 4px; }
  .msg { min-height: 36px; font-size: 19px; text-align: center; margin-top: 6px; line-height: 1.6; }
  .msg.good { color: var(--leaf); } .msg.bad { color: var(--red); }
  .pics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
  .pics.four { grid-template-columns: repeat(2, 1fr); }
  .pic { border: 3px solid var(--ink); border-radius: 18px; background: var(--cream); padding: 6px; text-align: center; cursor: pointer; font: inherit; font-size: 17px; color: var(--ink); }
  .pic img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 50%; display: block; }
  .pic.used { opacity: .3; cursor: default; }
  .pic.no { border-color: var(--red); animation: shake .35s; }
  .chain { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; min-height: 64px; margin: 8px 0; padding: 6px; border: 2px dashed var(--leaf); border-radius: 14px; background: #fbfdf9; }
  .chain .lnk { display: flex; flex-direction: column; align-items: center; font-size: 13px; width: 58px; }
  .chain .lnk img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--leaf); }
  .chain .arr { color: #e67e22; font-size: 22px; }
  .pyr { display: flex; flex-direction: column-reverse; align-items: center; gap: 4px; margin: 10px 0 4px; }
  .pyr div { height: 42px; border-radius: 8px; border: 2px dashed var(--green); display: flex; align-items: center; justify-content: center; font-size: 18px; background: #fbfdf9; }
  .pyr div.filled { border-style: solid; background: var(--mint); }
  .baskets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .baskets .btn { text-align: center; font-size: 17px; padding: 10px 4px; margin: 0; }
  .item { text-align: center; font-size: 26px; margin: 8px 0 12px; }
  .item img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--leaf); display: block; margin: 0 auto 4px; }
  .map { display: grid; gap: 10px; margin: 10px 0; }
  .station { display: flex; align-items: center; gap: 12px; border: 3px solid var(--ink); border-radius: 18px; padding: 10px 12px; font-size: 20px; background: var(--cream); }
  .station b { font-size: 30px; }
  .station.done { background: var(--mint); border-color: var(--leaf); }
  .station.now { border-color: var(--gold); box-shadow: 0 0 0 4px #fff3c4; }
  .station small { margin-inline-start: auto; font-size: 18px; }
  .ribbon { text-align: center; background: #fff3c4; border: 3px dashed #f5c242; border-radius: 16px; padding: 6px 8px; margin-bottom: 10px; line-height: 1.6; }
  .ribbon b { display: block; font-size: 26px; color: #c2366f; }
  .ribbon span { font-size: 18px; color: #1b5e20; }
  .sign { text-align: center; margin-top: 12px; color: #6b4fc0; }
  .confetti { position: fixed; top: -20px; font-size: 26px; animation: fall 1.6s linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(105vh) rotate(360deg); opacity: .2; } }
</style>
</head>
<body>
<div class="app">
  <div class="flags"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="card" id="screen"></div>
  <div class="sign">أ/ شامه البقمي 💚</div>
</div>

    { kind: 'sort', tag: 'صنّفي', q: 'صنّفي كل مخلوق في سلّته 🧺', baskets: ['منتِج 🌱', 'مستهلِك 🐰', 'محلِّل 🍄'], items: [
      { img: 'algae', name: 'الطحالب', b: 0 }, { e: '🍄', name: 'الفطر', b: 2 }, { img: 'mayfly', name: 'الذبابة المائية', b: 1 }, { img: 'thistle', name: 'نبات الشوك', b: 0 }, { e: '🦠', name: 'البكتيريا', b: 2 }, { img: 'heron', name: 'مالك الحزين', b: 1 }] },
  ] },
  { icon: '🌊', name: 'محطة الشبكة الغذائية', pages: 'ص١١٤', tasks: [
    { kind: 'choice', tag: 'المفردة', q: 'الشبكة الغذائية هي…', emoji: '🕸️', options: ['سلسلة غذائية واحدة طويلة', 'سلاسل غذائية متداخلة', 'هرم من الصخور'], a: 1 },
    { kind: 'choice', tag: 'المفردة', q: 'المفترس هو الذي…', emoji: '🦈 🐟', options: ['يصطاد غيره ليأكله', 'يُصطاد ويُؤكل', 'يصنع غذاءه بنفسه'], a: 0 },
    { kind: 'choice', tag: 'من أنا؟', q: 'آكلُ العوالق، وتأكلني التونة والدلفين والنورس. من أنا؟', emoji: '❓', options: ['🐟 سمكة السردين', '🐋 الحوت القاتل', '🌿 العوالق النباتية'], a: 0 },
    { kind: 'choice', tag: 'قراءة الشكل', q: 'أيّ مفترس في شبكة المحيط له أكبر عدد من الفرائس؟', emoji: '🌊', options: ['🐟 السردين', '🐋 الحوت القاتل', '🕊️ النورس'], a: 1 },
    { kind: 'choice', tag: 'أفكّر', q: 'السحلية تأكل السرعوف، والبومة تأكل السحلية. السحلية…', img: 'lizard', options: ['مفترس فقط', 'فريسة فقط', 'مفترس وفريسة معًا'], a: 2 },
  ] },
  { icon: '🔺', name: 'محطة هرم الطاقة', pages: 'ص١١٦', tasks: [
    { kind: 'pyramid', tag: 'ابني الهرم', q: 'ابني هرم الطاقة من القاعدة إلى القمة 👇', items: ['🦅 الصقور', '🌾 العشب', '🐦 العصافير', '🦗 الجراد'], answer: ['🌾 العشب', '🦗 الجراد', '🐦 العصافير', '🦅 الصقور'] },
    { kind: 'choice', tag: 'أتذكّر', q: 'كم ينتقل من طاقة النبات إلى آكلات الأعشاب؟', emoji: '🌾 ➜ 🦗', options: ['١٠٪', '٥٠٪', '٩٠٪'], a: 0 },
    { kind: 'choice', tag: 'هرم الطاقة', q: 'أين توجد أقلّ كمية من الطاقة في الهرم؟', emoji: '🔺', options: ['في القاعدة', 'في القمة', 'في الوسط'], a: 1 },
    { kind: 'choice', tag: 'أستنتج', q: 'لماذا يكون عدد المنتجات أكثر من المستهلكات؟', emoji: '🌾🌾🌾 🦅', options: ['لأن الطاقة تقلّ في كل مستوى', 'لأن المنتجات تتحرك أسرع', 'لأن المستهلكات لا تأكل'], a: 0 },
  ] },
  { icon: '🤼', name: 'محطة التنافس', pages: 'ص١١٥', tasks: [
    { kind: 'choice', tag: 'المفردة', q: 'التنافس هو…', emoji: '🐇🌾🐁', options: ['صراع المخلوقات على الطعام والماء', 'تعاون المخلوقات', 'نوم الحيوانات'], a: 0 },
    { kind: 'choice', tag: 'صح أم خطأ', q: 'النباتات تتنافس على ضوء الشمس والمواد المغذية.', emoji: '🌳☀️🌼', options: ['صح ✔', 'خطأ ✘'], a: 0 },
    { kind: 'choice', tag: 'أقارن', q: 'في الماء آكلات لحوم أكثر من اليابسة… لماذا؟', emoji: '🌊🦈', options: ['لأن الطحالب والعوالق كثيرة', 'لأن الماء بارد', 'لأن الأسماك كبيرة'], a: 0 },
  ] },
];
const EVENT = `<div class="ribbon"><b>🏆 تعلّم وأربح</b><span>فعالية الخميس • ١٨/٥/١٤٤٨هـ</span></div>`;
const PRAISE = ['أحسنتِ! 🌟', 'رائع يا عالمة! ✨', 'ممتاز! 💚', 'إجابة صحيحة! 🎉'];
const screen = document.getElementById('screen');
let st = 0, t = 0, stars = 0, earned = [0, 0, 0, 0], tries = 0;
const total = STATIONS.reduce((n, s) => n + s.tasks.length, 0);

function confetti() {
  for (let k = 0; k < 14; k++) {
    const s = document.createElement('div');
    s.className = 'confetti'; s.textContent = ['⭐', '🌿', '💚', '✨'][k % 4];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * 0.4 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 2200);
  }
}
function header() {
  const done = STATIONS.slice(0, st).reduce((n, s) => n + s.tasks.length, 0) + t;
  return `<div class="top"><div class="bar"><i style="width:${(done / total) * 100}%"></i></div><div class="stars">⭐ ${ar(stars)}</div></div>
    <div class="tag">${STATIONS[st].icon} ${STATIONS[st].name}</div>`;
}
function map() {
  screen.innerHTML = `${EVENT}<h1>🚂 رحلة الطاقة</h1><p class="sub">العلوم – الصف الرابع<br>السلاسل والشبكات الغذائية وهرم الطاقة</p>
    <div class="map">${STATIONS.map((s, k) => `<div class="station ${k < st ? 'done' : k === st ? 'now' : ''}"><b>${s.icon}</b>${s.name}<small>${k < st ? '⭐ ' + ar(earned[k]) + '/' + ar(s.tasks.length) : s.pages}</small></div>`).join('')}</div>
    <button class="btn main" id="go">${st === 0 ? 'ابدئي الرحلة 🚀' : 'إلى ' + STATIONS[st].name + ' 🚂'}</button>`;
  document.getElementById('go').onclick = () => { t = 0; task(); };
}
function next(ok) {
  if (ok && tries === 0) { stars++; earned[st]++; }
  if (ok) confetti();
  setTimeout(() => {
    t++;
    if (t < STATIONS[st].tasks.length) return task();
    st++;
    st < STATIONS.length ? map() : finish();
  }, 1200);
}
function task() {
  tries = 0;
  const q = STATIONS[st].tasks[t];
  ({ choice, chain, pyramid, sort })[q.kind](q);
}
function good(msg) { const m = document.getElementById('msg'); m.className = 'msg good'; m.textContent = msg || PRAISE[(st + t) % PRAISE.length]; }
function bad(msg) { tries++; const m = document.getElementById('msg'); m.className = 'msg bad'; m.textContent = msg || 'حاولي مرة أخرى 💡'; }
function shake(el) { el.classList.remove('no'); void el.offsetWidth; el.classList.add('no'); }

function choice(q) {
  screen.innerHTML = `${header()}<div class="tag" style="margin-top:6px">${q.tag}</div><div class="q">${q.q}</div>
    ${q.img ? `<div class="item">${pic(q.img)}</div>` : `<div class="emoji">${q.emoji || ''}</div>`}
    ${q.options.map((o, k) => `<button class="btn" data-k="${k}">${o}</button>`).join('')}<div class="msg" id="msg"></div>`;
  screen.querySelectorAll('.btn').forEach((b) => b.onclick = () => {
    if (+b.dataset.k === q.a) {
      b.classList.add('ok'); screen.querySelectorAll('.btn').forEach((x) => x.disabled = true); good(); next(true);
    } else { shake(b); b.disabled = true; bad(); }
  });
}
const NAMES = { thistle: 'نبات الشوك', caterpillar: 'اليرقة', mantis: 'السرعوف', lizard: 'السحلية', owl: 'البومة', algae: 'الطحالب', mayfly: 'الذبابة المائية', sunfish: 'سمكة الشمس', heron: 'مالك الحزين' };
function chain(q) {
  const built = [];
  const render = () => {
    screen.innerHTML = `${header()}<div class="tag" style="margin-top:6px">${q.tag}</div><div class="q">${q.q}</div>
      <div class="chain">${built.length ? built.map((k, i) => `${i ? '<span class="arr">←</span>' : ''}<span class="lnk">${pic(k)}${NAMES[k]}</span>`).join('') : '<span style="color:#7a869e">اضغطي على المخلوق الأول</span>'}</div>
      <div class="pics ${q.items.length === 4 ? 'four' : ''}">${q.items.map((k) => `<button class="pic ${built.includes(k) ? 'used' : ''}" data-k="${k}" ${built.includes(k) ? 'disabled' : ''}>${pic(k)}${NAMES[k]}</button>`).join('')}</div>
      <div class="msg" id="msg"></div>`;
    screen.querySelectorAll('.pic').forEach((b) => b.onclick = () => {
      const k = b.dataset.k;
      if (k === q.answer[built.length]) {
        built.push(k); render();
        if (built.length === q.answer.length) { good('سلسلة كاملة! 🌟'); next(true); }
      } else { shake(b); bad(built.length === 0 ? 'ابدئي بالمنتِج الذي يصنع غذاءه 🌱' : 'من يأكل ' + NAMES[built[built.length - 1]] + '؟ 💡'); }
    });
  };
  render();
}
function pyramid(q) {
  const placed = [];
  const render = () => {
    screen.innerHTML = `${header()}<div class="tag" style="margin-top:6px">${q.tag}</div><div class="q">${q.q}</div>
      <div class="pyr">${q.answer.map((_, k) => `<div class="${placed[k] ? 'filled' : ''}" style="width:${92 - k * 18}%">${placed[k] || (k === 0 ? 'القاعدة' : '…')}</div>`).join('')}</div>
      <div class="pics four">${q.items.map((s) => `<button class="pic ${placed.includes(s) ? 'used' : ''}" ${placed.includes(s) ? 'disabled' : ''}>${s}</button>`).join('')}</div>
      <div class="msg" id="msg"></div>`;
    screen.querySelectorAll('.pic').forEach((b) => b.onclick = () => {
      const s = b.textContent;
      if (s === q.answer[placed.length]) {
        placed.push(s); render();
        if (placed.length === q.answer.length) { good('هرم رائع! 🔺🌟'); next(true); }
      } else { shake(b); bad(placed.length === 0 ? 'ابدئي بالمنتجات في القاعدة 🌾' : 'حاولي مرة أخرى 💡'); }
    });
  };
  render();
}
function sort(q) {
  let i = 0;
  const render = () => {
    const it = q.items[i];
    screen.innerHTML = `${header()}<div class="tag" style="margin-top:6px">${q.tag} (${ar(i + 1)}/${ar(q.items.length)})</div><div class="q">${q.q}</div>
      <div class="item">${it.img ? pic(it.img) : `<div style="font-size:80px">${it.e}</div>`}${it.name}</div>
      <div class="baskets">${q.baskets.map((b, k) => `<button class="btn" data-k="${k}">${b}</button>`).join('')}</div><div class="msg" id="msg"></div>`;
    screen.querySelectorAll('.baskets .btn').forEach((b) => b.onclick = () => {
      if (+b.dataset.k === it.b) {
        b.classList.add('ok'); screen.querySelectorAll('.baskets .btn').forEach((x) => x.disabled = true);
        i++;
        if (i === q.items.length) { good('صنّفتِ الجميع! 🧺🌟'); next(true); }
        else { good(); setTimeout(render, 700); }
      } else { shake(b); bad(); }
    });
  };
  render();
}
function finish() {
  const rate = stars >= total - 2 ? '⭐⭐⭐' : stars >= total / 2 ? '⭐⭐' : '⭐';
  screen.innerHTML = `${EVENT}<h1>🏆 أنتِ مستكشفة الطاقة!</h1><div class="emoji" style="font-size:40px">${rate}</div>
    <h2>${ar(stars)} / ${ar(total)}</h2>
    <div class="map">${STATIONS.map((s, k) => `<div class="station done"><b>${s.icon}</b>${s.name}<small>⭐ ${ar(earned[k])}/${ar(s.tasks.length)}</small></div>`).join('')}</div>
    <p class="sub">النجمة تُحسب للإجابة الصحيحة من أول محاولة.</p>
    <button class="btn main" id="again">أبدأ الرحلة من جديد 🔄</button>`;
  confetti();
  document.getElementById('again').onclick = () => { st = 0; stars = 0; earned = [0, 0, 0, 0]; map(); };
}
map();
</script>
</body>
</html>
