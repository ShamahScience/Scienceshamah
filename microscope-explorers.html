<title>مختبر المستكشفات الصغيرات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: a bright classroom lab — sample cards on the left, the white microscope beside its big black-rimmed lens in the middle, info / zoom / activity cards on the right, tool tiles along the bench */
:root{
  color-scheme:light;
  --wall:#eef1f7; --bench:#f3f4f7;
  --panel:#ffffff; --panel-2:#f7f6fb; --ink:#2a2140; --muted:#6b6482; --line:#e4e0ee;
  --plum:#8b3aa6; --plum-2:#b0509e; --navy:#2c3a8f; --navy-2:#4a5bc4; --rose:#c4417c; --rose-2:#e06a9b;
  --blue:#2f7fe0; --blue-soft:#e3efff; --glow:#4fb6ff;
  --violet:#7a4fd0; --violet-soft:#efe7ff;
  --mint:#2f9e7d; --mint-soft:#dcf4ec; --peach-soft:#ffe8df;
  --gold:#f5b301; --butter:#ffd75e; --butter-soft:#fff5d1; --danger:#e0566a; --danger-soft:#ffe3e7;
  --wood-1:#e9b76e; --wood-2:#c98b42; --wood-ink:#4a2a0d;
  --banner-1:#ffc9de; --banner-2:#ffeaf3; --banner-ink:#4b1a6b;
  --f-display:'Baloo Bhaijaan 2','Tajawal',Tahoma,sans-serif;
  --f-body:'Tajawal','Segoe UI',Tahoma,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
#root{min-height:100%}
.scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;filter:blur(7px) saturate(1.05);transform:scale(1.04);pointer-events:none}
.scene-veil{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#ffffff40,#ffffff10 60%,#ffffff30);pointer-events:none}
.app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.shell{flex:1;width:100%;max-width:1560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 12px;display:flex;flex-direction:column;gap:14px}

.sig{position:relative;z-index:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 14px;text-align:center;color:var(--muted);font-size:14px;background:#ffffffcc;backdrop-filter:blur(6px)}
.sig b{font-family:var(--f-display);color:var(--plum);font-weight:700;font-size:16px}

/* icons */
.svg-ic{width:26px;height:26px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* generic buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 18px;border-radius:14px;border:2px solid transparent;background:var(--panel);color:var(--ink);font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--line),0 6px 16px #2a21401a;transition:transform .12s, box-shadow .12s, background .2s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.5}
.btn.primary{background:linear-gradient(180deg,#9a63e0,var(--violet));color:#fff;box-shadow:0 4px 0 #5a35a8}
.btn.blue{background:linear-gradient(180deg,#4b95ef,var(--blue));color:#fff;box-shadow:0 4px 0 #1f5cab}
.btn.peach{background:#ffb39f;color:#3a1a10;box-shadow:0 4px 0 #d9765e}
.btn.ghost{background:#fff;box-shadow:none;border-color:var(--line)}
.btn .ic{font-size:20px;line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;background:#fff;color:var(--ink);font-weight:700;font-size:14px;box-shadow:0 2px 0 var(--line)}

/* header: wooden sign · pink banner · home + tools */
.lab-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px 18px}
.wood{position:relative;transform:rotate(-3deg);background:
  repeating-linear-gradient(8deg,#0000 0 9px,#a8692a22 9px 11px),
  linear-gradient(180deg,var(--wood-1),var(--wood-2));
  color:var(--wood-ink);border:3px solid #a8692a;border-radius:10px;padding:8px 22px 10px;font-family:var(--f-display);font-weight:700;font-size:clamp(15px,1.5vw,20px);line-height:1.35;text-align:center;box-shadow:0 8px 18px #4a2a0d33;white-space:nowrap}
.wood::before,.wood::after{content:"";position:absolute;top:8px;width:9px;height:9px;border-radius:50%;background:#7a4a1c}
.wood::before{inset-inline-start:7px}.wood::after{inset-inline-end:7px}
.wood .heart{color:var(--danger)}
.banner{justify-self:center;display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,var(--banner-1),var(--banner-2));border:4px solid #fff;border-radius:999px;padding:8px 34px;box-shadow:0 10px 26px #c4417c33;min-width:0;max-width:100%}
.banner svg{width:clamp(38px,4vw,56px);height:auto;flex:none}
.banner h1{font-size:clamp(22px,3vw,40px);font-weight:800;color:var(--banner-ink);line-height:1.15}
.banner p{font-family:var(--f-display);color:#5d2f7a;font-size:clamp(14px,1.5vw,20px);font-weight:500}
.head-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.home-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:84px;height:80px;border-radius:18px;border:none;background:linear-gradient(180deg,#4b95ef,#1f63c6);color:#fff;font-size:12px;font-weight:700;box-shadow:0 5px 0 #154a99,0 10px 20px #1f63c64d}
.home-tile .svg-ic{width:34px;height:34px;fill:#fff;stroke:#fff}
.round{width:46px;height:46px;border-radius:50%;border:none;background:#fff;display:grid;place-items:center;color:var(--blue);box-shadow:0 3px 0 var(--line),0 6px 16px #2a21401a;position:relative}
.round .count{position:absolute;top:-4px;inset-inline-end:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--rose);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.progress-pill{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:#fff;box-shadow:0 3px 0 var(--line);font-weight:700;white-space:nowrap}
.progress-pill .stars{color:var(--gold)}

/* cards with coloured headers */
.card{background:#fffffff2;border-radius:var(--r);box-shadow:0 10px 28px #2a214022;overflow:hidden;min-width:0;border:1px solid #ffffff}
.card-h{padding:9px 14px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:19px;text-align:center}
.card-h.plum{background:linear-gradient(180deg,var(--plum-2),var(--plum))}
.card-h.navy{background:linear-gradient(180deg,var(--navy-2),var(--navy))}
.card-h.rose{background:linear-gradient(180deg,var(--rose-2),var(--rose))}
.card-b{padding:12px 14px 14px}

/* HOME */
.home{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:center}
.home-copy{display:flex;flex-direction:column;gap:16px;min-width:0}
.home-copy .card-b{display:flex;flex-direction:column;gap:14px}
.home-copy h2{font-size:clamp(24px,3vw,36px);font-weight:800}
.power{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.power-btn{width:96px;height:96px;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#ffffff 0%,#e8eef8 50%,#c3cfe2 100%);box-shadow:0 6px 0 #97a5bf,0 12px 30px #2f7fe033;display:grid;place-items:center;transition:transform .15s, box-shadow .3s}
.power-btn svg{width:46px;height:46px;stroke:#4a5672;stroke-width:3;fill:none;stroke-linecap:round}
.power-btn.on{background:radial-gradient(circle at 35% 30%,#f2fbff 0%,#8fd3ff 50%,#2f8de0 100%);box-shadow:0 6px 0 #1f63c6,0 0 50px #4fb6ffcc}
.power-btn.on svg{stroke:#fff}
.power-btn:active{transform:translateY(3px)}
.power-label{font-family:var(--f-display);font-size:22px;font-weight:700}
.welcome{position:relative;background:linear-gradient(180deg,#fff,#f3f9ff);border:3px solid var(--glow);border-radius:22px;padding:16px 20px;font-family:var(--f-display);font-size:clamp(19px,2vw,24px);font-weight:700;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.home-stage{position:relative;min-width:0;width:100%;height:min(68vh,640px);min-height:340px}
.three-host{position:absolute;inset:0}
.three-host canvas{display:block;width:100%!important;height:100%!important;touch-action:none;cursor:grab}
.home-hint{position:absolute;bottom:2%;inset-inline:0;text-align:center;color:var(--muted);font-size:14px;pointer-events:none}
.home-cards{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:13px;color:var(--muted)}

/* LAB grid: info (right) · stage · samples (left) */
.lab{display:grid;grid-template-columns:310px minmax(0,1fr) 330px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}

.samples-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sample{display:flex;flex-direction:column;gap:0;padding:0;border-radius:14px;border:3px solid transparent;background:var(--panel-2);overflow:hidden;text-align:center;box-shadow:0 2px 6px #2a214018;transition:transform .15s,border-color .2s,box-shadow .2s}
.sample:hover{transform:translateY(-2px)}
.sample.active{border-color:var(--glow);box-shadow:0 0 0 3px #4fb6ff55,0 6px 16px #4fb6ff55;background:var(--blue-soft)}
.sample canvas{display:block;width:100%;aspect-ratio:16/10;height:auto;background:#fff}
.samples-grid .sample:last-child:nth-child(odd) canvas{aspect-ratio:32/10}
.samples-grid .sample:last-child:nth-child(odd){grid-column:1/-1}
.sample .nm{display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700;padding:5px 4px 6px;line-height:1.25;font-size:15px;min-height:36px}
.sample .st{color:var(--gold)}

.challenge-cta{background:linear-gradient(135deg,#7a4fd0,#b06ad8);color:#fff;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 26px #7a4fd044}
.challenge-cta h2{font-size:20px}
.challenge-cta .btn{background:#fff;color:var(--violet);box-shadow:0 4px 0 #d8ccff}
.challenge-cta p{font-size:15px}

/* stage: microscope + lens */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.scope-stage{position:relative;width:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:center}
.lens-col{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.scope3d{position:relative;height:min(64vh,620px);min-height:320px;margin-inline-start:-34%;z-index:1}
.lens-wrap{position:relative;width:min(100%,58vh,600px);aspect-ratio:1/1;max-width:100%}
.lens-ring{position:absolute;inset:0;border-radius:50%;padding:3.6%;background:conic-gradient(from 200deg,#1d1f26,#4b4f5c,#15161b,#2c2f38,#5a5f6e,#1d1f26);box-shadow:0 22px 50px #0b0c1066,inset 0 2px 0 #ffffff40}
.lens-ring::before{content:"";position:absolute;inset:1.4%;border-radius:50%;border:2px solid #ffffff22;pointer-events:none}
.lens-inner{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#06090d;box-shadow:inset 0 0 0 3px #000}
.lens-inner::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 22%,#ffffff2e 0%,#ffffff00 32%);pointer-events:none}
.lens-inner canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;transition:filter .15s}
.lens-inner canvas.dragging{cursor:grabbing}
.lens-inner canvas.measure{cursor:crosshair}
.lens-glow{position:absolute;inset:-2%;border-radius:50%;pointer-events:none;box-shadow:0 0 70px 8px #4fb6ff80;opacity:.7}
.lens-name{margin-top:-26px;position:relative;z-index:3;background:linear-gradient(180deg,#2c2f3a,#14151b);color:#fff;font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2vw,24px);padding:6px 30px 8px;border-radius:16px;border:2px solid #4b4f5c;box-shadow:0 8px 18px #0006;max-width:90%;text-align:center}
.mag-badge{position:absolute;top:7%;inset-inline-end:7%;background:#14151be6;color:#fff;font-family:var(--f-display);font-weight:800;font-size:clamp(17px,2.2vw,24px);padding:2px 14px;border-radius:12px;font-variant-numeric:tabular-nums;direction:ltr;pointer-events:none;z-index:2;border:1px solid #ffffff33}
.sim-badge{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);background:#ffffffd9;color:var(--ink);font-size:12px;font-weight:700;padding:2px 10px;border-radius:10px;pointer-events:none;white-space:nowrap;z-index:2}
.flash{position:absolute;inset:0;border-radius:50%;background:#fff;opacity:0;pointer-events:none;z-index:3}
.flash.go{animation:flash .45s ease-out}
.rec-dot{position:absolute;top:7%;inset-inline-start:7%;display:flex;align-items:center;gap:6px;background:var(--danger);color:#fff;font-weight:700;padding:2px 12px;border-radius:12px;z-index:2;font-variant-numeric:tabular-nums}
.rec-dot::before{content:"";width:10px;height:10px;border-radius:50%;background:#fff;animation:blink 1s infinite}
.lens-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;font-family:var(--f-display);font-size:clamp(18px,2.4vw,26px);padding:18%;pointer-events:none}
.follow-tag,.measure-tag{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;font-weight:700;padding:2px 12px;border-radius:10px;z-index:2;white-space:nowrap;pointer-events:none}
.follow-tag{background:var(--mint)}
.measure-tag{background:var(--blue)}

/* tool tiles */
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;flex:1 1 78px;max-width:112px;min-height:88px;padding:8px 6px;border-radius:16px;border:2px solid #fff;background:linear-gradient(180deg,#ffffff,#eef3fb);color:var(--ink);font-weight:700;font-size:14px;line-height:1.2;box-shadow:0 4px 0 #d5dbe8,0 10px 22px #2a21401f;transition:transform .12s,box-shadow .12s}
.tile .svg-ic{width:34px;height:34px;color:var(--blue)}
.tile:hover:not(:disabled){transform:translateY(-2px)}
.tile:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #d5dbe8}
.tile:disabled{opacity:.45}
.tile.on{background:linear-gradient(180deg,#e3f1ff,#cfe5ff);border-color:var(--glow)}
.tile.rec{background:linear-gradient(180deg,#ff8a99,var(--danger));color:#fff}
.tile.rec .svg-ic{color:#fff}
.disclaim{font-size:13px;color:var(--muted);text-align:center;max-width:72ch;background:#ffffffb3;border-radius:12px;padding:6px 12px}

/* info card */
.info h2{font-size:26px;color:var(--plum);text-align:start}
.info .sci{color:var(--muted);font-size:13px;direction:ltr;text-align:end;font-style:italic}
.info .kind{display:inline-block;margin-block:6px;background:var(--mint-soft);color:#21705b;font-weight:700;font-size:14px;padding:2px 12px;border-radius:999px}
.info dl{display:grid;gap:6px;margin:6px 0 0}
.info dt{font-weight:700;color:var(--navy);font-size:14px}
.info dd{margin:0}
.info ul{margin:2px 0 0;padding-inline-start:20px}
.info .fact{margin-top:8px;background:var(--butter-soft);border-radius:12px;padding:8px 12px}
.info .fact b{color:#8a6400}
.info .note{margin-top:6px;font-size:13px;color:var(--muted)}
.info-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.speak-btn{width:52px;height:52px;border-radius:14px;border:none;background:linear-gradient(180deg,#4b95ef,#1f63c6);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 #154a99;flex:none}
.speak-btn.on{background:linear-gradient(180deg,#ff8a99,var(--danger));box-shadow:0 4px 0 #a83646}
.speak-btn .svg-ic{width:28px;height:28px}
.parts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.parts button{border:2px solid var(--line);background:var(--panel-2);border-radius:12px;padding:4px 12px;font-weight:700;min-height:40px}
.parts button.on{border-color:var(--plum);background:#f6e8fb;color:var(--plum)}

/* zoom card */
.zoom-row{display:flex;align-items:center;gap:10px;direction:ltr}
.zbtn{width:44px;height:44px;border-radius:50%;border:none;display:grid;place-items:center;font-size:28px;font-weight:800;line-height:1;flex:none;box-shadow:0 3px 0 #0002}
.zbtn.minus{background:#ffd0dc;color:var(--rose)}
.zbtn.plus{background:#d9e6ff;color:var(--navy)}
.zbtn:disabled{opacity:.4}
.zoom-row input[type=range]{flex:1;min-width:0;accent-color:var(--navy-2);height:30px}
.zticks{display:flex;justify-content:space-between;direction:ltr;padding-inline:54px;font-size:12px;font-weight:700;color:var(--muted);margin-top:-4px}
.zval{text-align:center;font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--navy);direction:ltr;line-height:1.2}
.zobj{text-align:center;font-size:13px;color:var(--muted)}
.obj-dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-inline:4px}
.focus-row{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.focus-row label{font-weight:700;white-space:nowrap;font-size:14px}
.focus-row input{flex:1;accent-color:var(--plum);min-width:0;height:28px}

/* activity (quiz) */
.quiz .q{font-family:var(--f-display);font-size:19px;font-weight:700;margin:2px 0 10px}
.radios{display:grid;gap:6px}
.radio{display:flex;gap:10px;align-items:center;text-align:start;width:100%;min-height:48px;padding:6px 10px;border-radius:12px;border:2px solid transparent;background:#fff;font-weight:700;font-size:17px;transition:background .2s,border-color .2s}
.radio:hover:not(:disabled){background:#fbeff5}
.radio .dot{width:28px;height:28px;border-radius:50%;border:3px solid #3b3a63;flex:none;display:grid;place-items:center;background:#fff}
.radio.sel .dot{border-color:var(--blue);background:var(--blue)}
.radio.sel .dot::after{content:"";width:9px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.radio.right{border-color:var(--mint);background:var(--mint-soft)}
.radio.wrong{border-color:var(--danger);background:var(--danger-soft)}
.check-btn{margin-top:10px;width:100%;min-height:48px;border:none;border-radius:14px;background:linear-gradient(180deg,#b07ae6,#8a4fd0);color:#fff;font-weight:700;font-size:17px;box-shadow:0 4px 0 #5f35a3;display:flex;align-items:center;justify-content:center;gap:8px}
.check-btn:disabled{opacity:.5}
.fb{margin-top:10px;padding:10px 12px;border-radius:14px;font-family:var(--f-display);font-weight:700;font-size:19px;display:flex;align-items:center;gap:10px}
.fb.ok{background:var(--mint-soft);color:#1f6e58}
.fb.no{background:var(--peach-soft);color:#8a3a24}
.wait{display:flex;align-items:center;gap:12px}
.ring{width:44px;height:44px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:#fbe1ec}
.ring .fg{stroke:var(--rose);stroke-linecap:round;transition:stroke-dashoffset .25s linear}

/* option buttons (challenge) */
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:start;width:100%;min-height:54px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:18px;transition:background .2s,border-color .2s}
.opt:hover:not(:disabled){border-color:var(--violet);background:var(--violet-soft)}
.opt .l{width:32px;height:32px;border-radius:50%;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;font-family:var(--f-display);flex:none}
.opt.right{border-color:var(--mint);background:var(--mint-soft)}
.opt.right .l{background:var(--mint);color:#fff}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt.wrong .l{background:var(--danger);color:#fff}

/* big star */
.star-burst{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50}
.star-burst .s{font-size:min(40vw,240px);line-height:1;filter:drop-shadow(0 10px 30px #f5b30199);animation:starIn 1.6s cubic-bezier(.2,1.3,.4,1) forwards}

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
'use strict';
/* ============================================================
   Shared helpers
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const wrapD = (d, W) => { d = ((d % W) + W) % W; return d > W / 2 ? d - W : d; };
const LEVELS = [{mag:40,obj:4,z:1},{mag:100,obj:10,z:2.5},{mag:400,obj:40,z:10}];
const BASE_R = 450; // world units visible across the lens radius at 40×

function closedSmooth(ctx, pts){
  const n = pts.length;
  ctx.beginPath();
  const m0x = (pts[n-1][0] + pts[0][0]) / 2, m0y = (pts[n-1][1] + pts[0][1]) / 2;

/* Label anchors: record a local point in device pixels using the current transform */
function anchor(ctx, L, x, y, text, dir){
  if (!L) return;
  const m = ctx.getTransform();
  L.push({x: m.a * x + m.c * y + m.e, y: m.b * x + m.d * y + m.f, text, dir: dir || 0});

/* ============================================================

/* ---------- 1. Bacteria (fluorescent stain on a dark field) ---------- */
const bacteria = {
  W: 1000, wrap: true, bg: ['#0f4650', '#03100f', '#1d6d72'], dark: true,
  init(r){
    const o = [];
    for (let i = 0; i < 70; i++) o.push({type:'rod', x:r()*1000, y:r()*1000, a:r()*TAU, L:8+r()*5, w:3, hue:r(), run:r()*2, sp:22+r()*16, ph:r()*TAU, r:9, pili:Array.from({length:22}, () => [r(), r() < .5 ? -1 : 1, .7 + r()*.8])});

    // out-of-focus cells in other focal planes (soft bokeh behind the sharp layer)
    const bokeh = Array.from({length:40}, () => ({x:r()*1000, y:r()*1000, a:r()*TAU, s:1.6 + r()*1.6, vx:(r()-.5)*5, vy:(r()-.5)*5}));

  },
  step(S, dt, t){
    const r = S.r;
    for (const b of S.bokeh){ b.x = (b.x + b.vx*dt + 1000) % 1000; b.y = (b.y + b.vy*dt + 1000) % 1000; }

  draw(ctx, S, V){
    const labelled = {};

      if (b.type === 'rod'){
        const L = b.L, w = b.w, hi = b.hue < .5 ? '#c9ffb0' : '#b3ffd6', mid = b.hue < .5 ? '#5ed46a' : '#45c98f', lo = b.hue < .5 ? '#1f7a3a' : '#17704f';

          for (const p of b.pili){ const x = -L/2 + w/2 + p[0]*(L - w), y = p[1]*w/2; ctx.moveTo(x, y); ctx.lineTo(x + (p[0] - .5)*.8, y + p[1]*p[2]*1.4); }
          ctx.stroke();
        }

        const g = ctx.createLinearGradient(0, -w/2, 0, w/2); g.addColorStop(0, lo); g.addColorStop(.42, hi); g.addColorStop(1, mid);
        if (glow){ ctx.shadowColor = '#6dff8f'; ctx.shadowBlur = 10*V.dpr; }
        ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;
        if (fine){ ctx.lineWidth = .3; ctx.strokeStyle = '#e9ffe0aa'; ctx.stroke();

      } else if (b.type === 'chain' || b.type === 'cluster'){
        if (glow){ ctx.shadowColor = '#5fe8c8'; ctx.shadowBlur = 8*V.dpr; }
        for (const p of b.pts){ ellipse(ctx, p[0], p[1], 2.1, 2.1); ctx.fillStyle = '#4fd1b0'; ctx.fill(); }
        ctx.shadowBlur = 0;
        if (fine) for (const p of b.pts){ ellipse(ctx, p[0]-.6, p[1]-.6, .8, .8); ctx.fillStyle = '#d9fff3aa'; ctx.fill(); }
        const key = b.type;
        if (V.L && !labelled[key] && Math.hypot(dx,dy) < V.Rw*.6){ labelled[key] = 1; anchor(ctx, V.L, b.pts[0][0], b.pts[0][1], key === 'chain' ? 'كروية في سلسلة' : 'كروية في عنقود', key === 'chain' ? 1 : -1); }
      } else {
        const L = b.L;
        ctx.beginPath();
        for (let s = 0; s <= 40; s++){ const x = -L/2 + L*s/40, y = Math.sin(s/40*TAU*3 - V.t*10 + b.ph)*2.6; s ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }

        ctx.strokeStyle = '#c8f06a'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.stroke(); ctx.shadowBlur = 0;
        if (fine){ ctx.strokeStyle = '#f6ffd0aa'; ctx.lineWidth = .6; ctx.stroke(); }
        if (V.L && !labelled.spiral && Math.hypot(dx,dy) < V.Rw*.6){ labelled.spiral = 1; anchor(ctx, V.L, 0, -3, 'بكتيريا حلزونية', 1); }
      }
    });
  }
};
/* ---------- 1b. E. coli (Gram-stained, pink): run-and-tumble swimming and binary fission ---------- */
const ECOLI_L0 = 10, ECOLI_CAP = 70;
function newEcoli(r, x, y, a, L){
  const nf = 6 + (r()*3|0);
  return {type:'ecoli', x, y, a, L:L || ECOLI_L0*(1 + r()*.9), w:4.2, run:r()*2, tumble:0, splay:0, sp:24 + r()*14, ph:r()*TAU, r:16, grow:.25 + r()*.2,
    div:0, flag:Array.from({length:nf}, () => ({u:r(), side:r() < .5 ? -1 : 1, ph:r()*TAU, out:(r() - .5)*1.4, len:26 + r()*14})),
    pili:Array.from({length:26}, () => [r(), r() < .5 ? -1 : 1, .6 + r()*.7]), nuc:Array.from({length:5}, () => [r() - .5, (r() - .5)*.5, .6 + r()*.6])};
}
const ecoli = {
  W: 1000, wrap: true, bg: ['#fbe9ef', '#ecc9d6', '#fffafc'],
  init(r){
    const o = [];
    for (let i = 0; i < 48; i++) o.push(newEcoli(r, r()*1000, r()*1000, r()*TAU));
    return {o, r};
  },
  step(S, dt){
    const r = S.r, born = [];
    for (const b of S.o){
      // run-and-tumble: flagella bundle behind while running, splay out while tumbling
      if (b.tumble > 0){ b.tumble -= dt; b.a += (r() - .5)*dt*16; if (b.tumble <= 0) b.run = .9 + r()*2.2; }
      else { b.run -= dt; if (b.run <= 0) b.tumble = .25 + r()*.3; }

      const v = (b.tumble > 0 ? 0 : b.sp)*(b.div > 0 ? .25 : 1);
      b.x = (b.x + Math.cos(b.a)*v*dt + (r() - .5)*dt*7 + 1000) % 1000;
      b.y = (b.y + Math.sin(b.a)*v*dt + (r() - .5)*dt*7 + 1000) % 1000;

        }
      }

  },
  draw(ctx, S, V){
    const labelled = {}, fine = V.kc > 2.2, mid = V.kc > 1;
    eachWrapped(ctx, S.o, V, 1000, (b, dx, dy) => {

        ctx.strokeStyle = '#c4547a66'; ctx.lineWidth = .14; ctx.beginPath();
        for (const p of b.pili){ const x = -L/2 + w/2 + p[0]*(L - w), y = p[1]*w/2; ctx.moveTo(x, y); ctx.lineTo(x + (p[0] - .5)*.7, y + p[1]*p[2]*1.2); }
        ctx.stroke();
      }
      // body; while dividing, two halves overlap less and less so a waist appears
      const bodyGrad = () => { const g = ctx.createLinearGradient(0, -w/2, 0, w/2); g.addColorStop(0, '#c23c66'); g.addColorStop(.45, '#f08aa8'); g.addColorStop(1, '#d24f78'); return g; };
      if (b.div > 0){
        const p = b.div, half = L/2, ov = (1 - p)*w*1.1;
        for (const sgn of [-1, 1]){ ctx.save(); ctx.translate(sgn*(half/2 - ov/4), 0); capsule(ctx, half + ov/2, w*(1 - .12*p)); ctx.fillStyle = bodyGrad(); ctx.fill(); if (mid){ ctx.lineWidth = .35; ctx.strokeStyle = '#8a2245aa'; ctx.stroke(); } ctx.restore(); }
      } else {
        capsule(ctx, L, w); ctx.fillStyle = bodyGrad(); ctx.fill();
        if (mid){ ctx.lineWidth = .35; ctx.strokeStyle = '#8a2245aa'; ctx.stroke(); }
      }
      if (fine){ // nucleoid: paler, irregular DNA region
        ctx.fillStyle = '#ffd3e055';
        for (const n of b.nuc){ ellipse(ctx, n[0]*L*.55, n[1]*w, n[2]*w*.35, n[2]*w*.25, n[0]*3); ctx.fill(); }
      }
      if (V.L && Math.hypot(dx, dy) < V.Rw*.6){
        if (!labelled.cell && !b.div){ labelled.cell = 1; anchor(ctx, V.L, 0, -w*.5, 'إي كولاي', -1); if (fine) anchor(ctx, V.L, -L*.2, w*.5 + .7, 'شعيرات', 1); }
        if (!labelled.div && b.div > .25){ labelled.div = 1; anchor(ctx, V.L, 0, w*.5, 'انقسام ثنائي', 1); }
        if (!labelled.flag && mid && b.flag.length && b.splay < .3 && !b.div){ labelled.flag = 1; anchor(ctx, V.L, -L/2 - 14, 0, 'أسواط', -1); }

};
function capsule(ctx, L, w){
  const r = w/2, h = L/2 - r;
  ctx.beginPath(); ctx.moveTo(-h, -r); ctx.lineTo(h, -r); ctx.arc(h, 0, r, -Math.PI/2, Math.PI/2); ctx.lineTo(-h, r); ctx.arc(-h, 0, r, Math.PI/2, Math.PI*1.5); ctx.closePath();
}
function eachWrapped(ctx, list, V, W, fn){
  for (const o of list){
    const dx = wrapD(o.x - V.cx, W), dy = wrapD(o.y - V.cy, W);
    const rr = (o.r || 20) + 4;
    if (dx*dx + dy*dy > (V.Rw + rr)*(V.Rw + rr)) continue;
    ctx.setTransform(V.k, 0, 0, V.k, V.half + dx*V.k, V.half + dy*V.k);
    ctx.rotate(o.a || 0);
    fn(o, dx, dy);
  }
}

/* pond debris — soft out-of-focus specks drifting slowly */
function makeDebris(r, n){ const d = []; for (let i = 0; i < n; i++) d.push({x:r()*1000, y:r()*1000, s:3+r()*10, vx:(r()-.5)*4, vy:(r()-.5)*4, c:r()<.5 ? '#8a9a6a' : '#a59a7a'}); return d; }
function stepDebris(d, dt){ for (const p of d){ p.x = (p.x + p.vx*dt + 1000) % 1000; p.y = (p.y + p.vy*dt + 1000) % 1000; } }
function drawDebris(ctx, d, V){
  for (const p of d){
    const dx = wrapD(p.x - V.cx, 1000), dy = wrapD(p.y - V.cy, 1000);
    if (Math.abs(dx) > V.Rw + 20 || Math.abs(dy) > V.Rw + 20) continue;
    ctx.setTransform(V.k, 0, 0, V.k, V.half + dx*V.k, V.half + dy*V.k);
    ctx.globalAlpha = .18; ellipse(ctx, 0, 0, p.s, p.s*.7, p.s); ctx.fillStyle = p.c; ctx.fill(); ctx.globalAlpha = 1;
  }
}

/* ---------- 2. Amoeba ---------- */
const amoeba = {
  W: 1000, wrap: true, bg: ['#fbfbf2', '#e9ecd9'],

        if (main){ g.ang += angDiff(main.ang, g.ang)*dt*.25*(1 - g.f); g.f = lerp(g.f, .9, dt*.08*main.cur); }
        g.ang += (r()-.5)*dt*.3; g.f = clamp(g.f + (r()-.5)*dt*.2, .05, .92);

  draw(ctx, S, V){

/* ---------- 3. Paramecium ---------- */
function slipperPts(L, W, n, squish){
  const top = [], bot = [];
  for (let i = 0; i <= n; i++){
    const u = i/n, x = -L/2 + u*L;
    let w = Math.pow(Math.sin(Math.PI*u), .75)*W/2*(1 + .12*Math.sin(Math.PI*u*1.2));
    w *= squish;
    const dent = W*.18*Math.exp(-Math.pow((u - .58)/.12, 2)); // oral groove on one side
    top.push([x, -w + dent]); bot.push([x, w]);
  }
  return top.concat(bot.reverse().slice(1, -1));
}
const paramecium = {
  W: 1000, wrap: true, bg: ['#f8fbf1', '#e5edd8'],
  init(r){

    return {o, r, debris:makeDebris(r, 22)};

      let v = p.sp;
      if (p.back > 0){ p.back -= dt; v = -p.sp*.6; if (p.back <= 0) p.a = p.turnTo; }
      p.a += Math.sin(t*1.7 + p.ph)*dt*.5;
      p.x = (p.x + Math.cos(p.a)*v*dt + 1000) % 1000; p.y = (p.y + Math.sin(p.a)*v*dt + 1000) % 1000;

  draw(ctx, S, V){
    drawDebris(ctx, S.debris, V);
    let best = null, bd = 1e9;
    for (const p of S.o){ const d = Math.hypot(wrapD(p.x - V.cx, 1000), wrapD(p.y - V.cy, 1000)); if (d < bd){ bd = d; best = p; } }
    eachWrapped(ctx, S.o, V, 1000, (p) => {
      const L = p.L, W = p.Wd, t = V.t, sq = 1 + .05*Math.sin(t*4 + p.ph);
      const pts = slipperPts(L, W, 40, sq);
      // cilia (metachronal wave)
      if (V.kc > .9){
        ctx.strokeStyle = '#7f9a6caa'; ctx.lineWidth = .45; ctx.beginPath();
        const n = pts.length;

          let nx = a1[1] - a0[1], ny = -(a1[0] - a0[0]); const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
          for (let k = 0; k < 2; k++){
            const bx = lerp(q[0], a1[0], k*.5), by = lerp(q[1], a1[1], k*.5);
            const beat = Math.sin(i*.55 + k*.27 - t*(p.back > 0 ? -14 : 14));
            const len = 4.5, tx = -nx*0 + (a1[0]-a0[0])/nl, ty = (a1[1]-a0[1])/nl;
            ctx.moveTo(bx, by); ctx.lineTo(bx - nx*len + tx*beat*2.4, by - ny*len + ty*beat*2.4);

        anchor(ctx, V.L, L*.08, W*.17, 'النواة الصغيرة', 1);
        anchor(ctx, V.L, L*.1, -W*.25, 'الأخدود الفموي', -1);
        anchor(ctx, V.L, -L*.45, W*.22, 'الأهداب', 1);
      }
    });
  }
};

/* ---------- Tissue builder (onion, leaf): brick rows with shared wavy walls ---------- */
function buildTissue(r, opt){
  const rows = [], {size, rowH, cellL, wav} = opt;
  const nRows = Math.ceil(size/rowH) + 1;
  const lines = [];
  for (let j = 0; j <= nRows; j++) lines.push({y:j*rowH + (r()-.5)*rowH*.15, a1:(r()*.5 + .5)*wav, f1:.006 + r()*.006, p1:r()*TAU, a2:r()*wav*.5, f2:.02 + r()*.01, p2:r()*TAU});
  const Y = (ln, x) => ln.y + ln.a1*Math.sin(x*ln.f1 + ln.p1) + ln.a2*Math.sin(x*ln.f2 + ln.p2);
  const cells = [];
  for (let j = 0; j < nRows; j++){
    let x = -r()*cellL;
    while (x < size){
      const len = cellL*(.7 + r()*.6), x0 = x, x1 = x + len, sk0 = (r()-.5)*rowH*.5, sk1 = (r()-.5)*rowH*.5;
      const top = lines[j], bot = lines[j + 1], poly = [];
      const steps = 8;
      for (let s = 0; s <= steps; s++){ const xx = lerp(x0 + sk0*0, x1, s/steps); poly.push([xx, Y(top, xx)]); }
      for (let s = steps; s >= 0; s--){ const xx = lerp(x0, x1, s/steps); poly.push([xx + (s === 0 ? sk0 : s === steps ? sk1 : 0)*0, Y(bot, xx)]); }
      const cx = (x0 + x1)/2, cy = (Y(top, cx) + Y(bot, cx))/2;
      cells.push({poly, x0, x1, y0:Math.min(Y(top, x0), Y(top, x1)) - wav*2, y1:Math.max(Y(bot, x0), Y(bot, x1)) + wav*2, cx, cy, len, h:Y(bot, cx) - Y(top, cx), seed:r(), nuc:[(r() - .5)*.6, (r() - .5)*.4]});

}
function polyPath(ctx, poly){ ctx.beginPath(); ctx.moveTo(poly[0][0], poly[0][1]); for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]); ctx.closePath(); }

/* ---------- 5. Onion epidermis (iodine stained) ---------- */
const onion = {
  W: 1300, wrap: false, bg: ['#fff8e8', '#f3e2bd'],
  init(r){ return {cells: buildTissue(r, {size:1300, rowH:52, cellL:175, wav:6})}; },
  step(){},
  draw(ctx, S, V){
    tissueTransform(ctx, V);
    const vx0 = V.cx - V.Rw, vx1 = V.cx + V.Rw, vy0 = V.cy - V.Rw, vy1 = V.cy + V.Rw;
    const near = V.L ? nearestCell(S.cells, V.cx, V.cy) : null;
    for (const c of S.cells){
      if (c.x1 < vx0 || c.x0 > vx1 || c.y1 < vy0 || c.y0 > vy1) continue;
      polyPath(ctx, c.poly);
      const sh = 230 + c.seed*16;
      ctx.fillStyle = `rgb(${sh},${200 + c.seed*25},${130 + c.seed*30})`; ctx.fill();
      ctx.strokeStyle = '#9c6b2e'; ctx.lineWidth = 2.6; ctx.stroke();
      if (V.kc > .9){ ctx.strokeStyle = '#f8e7c2'; ctx.lineWidth = .8; ctx.stroke(); }

      ellipse(ctx, nx, ny, 9, 7.5, c.seed*3); ctx.fillStyle = '#b07a35'; ctx.fill(); ctx.strokeStyle = '#7a4c17'; ctx.lineWidth = 1; ctx.stroke();

      if (c === near){
        anchor(ctx, V.L, c.x0 + c.len*.25, c.poly[2][1], 'الجدار الخلوي', -1);
        anchor(ctx, V.L, nx, ny, 'النواة', 1);
        anchor(ctx, V.L, c.cx - c.nuc[0]*c.len*.8, c.cy - c.nuc[1]*c.h, 'الفجوة العصارية', 1);
        anchor(ctx, V.L, c.x1 - 8, c.cy + c.h*.3, 'السيتوبلازم', -1);
      }
    }
  }
};
function tissueTransform(ctx, V){ ctx.setTransform(V.k, 0, 0, V.k, V.half - V.cx*V.k, V.half - V.cy*V.k); }

/* ---------- 6. Leaf cells (Elodea) with cytoplasmic streaming ---------- */
const leaf = {
  W: 1300, wrap: false, bg: ['#f6fbef', '#dcebcf'],
  init(r){
    const cells = buildTissue(r, {size:1300, rowH:46, cellL:120, wav:3});
    for (const c of cells){
      c.chl = []; const n = 14 + (r()*8|0);
      for (let i = 0; i < n; i++) c.chl.push({s:r(), rot:r()*TAU, sz:.85 + r()*.3});
      c.dir = r() < .5 ? 1 : -1; c.speed = .035 + r()*.03; c.hasNuc = r() < .35;
    }
    return {cells};
  },
  step(S, dt){ for (const c of S.cells) for (const p of c.chl) p.s = (p.s + c.dir*c.speed*dt + 1) % 1; },
  draw(ctx, S, V){
    tissueTransform(ctx, V);
    const vx0 = V.cx - V.Rw, vx1 = V.cx + V.Rw, vy0 = V.cy - V.Rw, vy1 = V.cy + V.Rw;
    const near = V.L ? nearestCell(S.cells, V.cx, V.cy) : null;
    for (const c of S.cells){
      if (c.x1 < vx0 || c.x0 > vx1 || c.y1 < vy0 || c.y0 > vy1) continue;
      polyPath(ctx, c.poly); ctx.fillStyle = `rgb(${214 + c.seed*14},${236},${196 + c.seed*14})`; ctx.fill();
      ctx.strokeStyle = '#6f8f4e'; ctx.lineWidth = 2; ctx.stroke();
      if (c.hasNuc && V.kc > .8){ ellipse(ctx, c.cx + c.nuc[0]*c.len*.5, c.cy, 6, 5); ctx.fillStyle = '#e9f1dccc'; ctx.fill(); ctx.strokeStyle = '#8aa070'; ctx.lineWidth = .6; ctx.stroke(); }
      // chloroplasts travel around an inset loop of the cell
      const ins = 7, x0 = c.x0 + ins, x1 = c.x1 - ins, y0 = c.cy - c.h/2 + ins, y1 = c.cy + c.h/2 - ins;
      const w = Math.max(1, x1 - x0), h = Math.max(1, y1 - y0), P = 2*(w + h);
      let firstPt = null;
      for (const p of c.chl){
        let d = p.s*P, x, y;
        if (d < w){ x = x0 + d; y = y0; } else if ((d -= w) < h){ x = x1; y = y0 + d; } else if ((d -= h) < w){ x = x1 - d; y = y1; } else { d -= w; x = x0; y = y1 - d; }

        if (V.kc > 1.6){ ctx.strokeStyle = '#25601b'; ctx.lineWidth = .5; ctx.stroke(); ellipse(ctx, x - 1, y - 1, 1.2, .9, p.rot); ctx.fillStyle = '#8fd27a'; ctx.fill(); }
        if (!firstPt) firstPt = [x, y];
      }
      if (c === near){
        if (firstPt) anchor(ctx, V.L, firstPt[0], firstPt[1], 'البلاستيدات الخضراء', -1);
        anchor(ctx, V.L, c.cx, c.poly[3][1], 'الجدار الخلوي', 1);
        anchor(ctx, V.L, c.cx, c.cy, 'السيتوبلازم يتحرك', 1);
      }
    }
  }
};

/* ---------- 7. Spirogyra ---------- */
const spirogyra = {
  W: 1300, wrap: false, bg: ['#f7fbf3', '#dfeedd'],
  init(r){
    const f = [];
    const specs = [[650, 330, .12], [600, 620, -.08], [700, 900, .2], [450, 1120, -.15], [900, 170, -.3]];
    for (const s of specs){
      const cells = []; const n = 22;
      for (let i = 0; i < n; i++) cells.push({len:58 + r()*14, ph:r()*TAU, two:r() < .25});
      f.push({x:s[0], y:s[1], a:s[2], cells, w:24 + r()*4, ph:r()*TAU, total:cells.reduce((a, c) => a + c.len, 0)});
    }
    return {f};
  },
  step(){},
  draw(ctx, S, V){
    const t = V.t;
    let bestCell = null, bd = 1e9;
    for (const fl of S.f){
      const a = fl.a + Math.sin(t*.25 + fl.ph)*.025, ox = fl.x + Math.sin(t*.18 + fl.ph)*8, oy = fl.y + Math.cos(t*.21 + fl.ph)*6;
      let x = -fl.total/2;
      for (const c of fl.cells){
        const ccx = x + c.len/2;
        const wx = ox + Math.cos(a)*ccx, wy = oy + Math.sin(a)*ccx + Math.sin(ccx*.004 + t*.3 + fl.ph)*10;
        x += c.len;
        if (Math.abs(wx - V.cx) > V.Rw + 60 || Math.abs(wy - V.cy) > V.Rw + 60) continue;
        ctx.setTransform(V.k, 0, 0, V.k, V.half + (wx - V.cx)*V.k, V.half + (wy - V.cy)*V.k);
        ctx.rotate(a + Math.cos(ccx*.004 + t*.3 + fl.ph)*.04);
        drawSpiroCell(ctx, c, fl.w, V);
        const d = Math.hypot(wx - V.cx, wy - V.cy);
        if (V.L && d < bd){ bd = d; bestCell = {m:ctx.getTransform(), c, w:fl.w}; }
      }
    }
    if (bestCell && V.L){
      ctx.setTransform(bestCell.m);
      const c = bestCell.c, W = bestCell.w, L = c.len;
      anchor(ctx, V.L, -L*.18, Math.sin(-.18*TAU*1.4 + c.ph)*(W/2 - 4), 'البلاستيدة الحلزونية', -1);
      anchor(ctx, V.L, 0, 0, 'النواة', 1);
      anchor(ctx, V.L, L/2, W*.3, 'الجدار الخلوي', 1);
      anchor(ctx, V.L, -L*.4, -W*.5, 'خيط من خلايا متصلة', -1);
    }
  }
};
function drawSpiroCell(ctx, c, W, V){
  const L = c.len, hw = W/2;
  // wall + vacuole
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-L/2, -hw, L, W, 3) : ctx.rect(-L/2, -hw, L, W);
  ctx.fillStyle = '#e9f5e3e8'; ctx.fill(); ctx.strokeStyle = '#7da36b'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(L/2, -hw); ctx.lineTo(L/2, hw); ctx.strokeStyle = '#6a9257'; ctx.lineWidth = 1.8; ctx.stroke();
  const turns = 1.4, amp = hw - 4, bands = c.two ? 2 : 1;
  for (let b = 0; b < bands; b++){
    const off = b*Math.PI;
    // back half (faint), then front half (strong)
    for (const front of [false, true]){
      ctx.beginPath(); let pen = false;
      for (let s = 0; s <= 60; s++){
        const u = s/60, x = -L/2 + 2 + u*(L - 4), th = u*TAU*turns + c.ph + off, y = Math.sin(th)*amp, isFront = Math.cos(th) > 0;
        if (isFront === front){ pen ? ctx.lineTo(x, y) : ctx.moveTo(x, y); pen = true; } else pen = false;
      }
      ctx.strokeStyle = front ? '#2f8a2c' : '#2f8a2c44'; ctx.lineWidth = front ? 4.6 : 3.6; ctx.lineCap = 'round'; ctx.stroke();
      if (front && V.kc > 1.4){ ctx.strokeStyle = '#7fcf6a'; ctx.lineWidth = 1; ctx.stroke(); }
    }
    // pyrenoids along the ribbon
    if (V.kc > 1.1){
      for (let s = 1; s < 9; s++){ const u = s/9, th = u*TAU*turns + c.ph + off; if (Math.cos(th) <= 0) continue; ellipse(ctx, -L/2 + 2 + u*(L - 4), Math.sin(th)*amp, 1.7, 1.7); ctx.fillStyle = '#e8f6d8'; ctx.fill(); }
    }
  }
  // nucleus suspended by cytoplasmic strands
  if (V.kc > 1){ ctx.strokeStyle = '#a8c39a99'; ctx.lineWidth = .5; ctx.beginPath(); for (let j = 0; j < 6; j++){ const aa = j/6*TAU + .3; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(aa)*L*.4, Math.sin(aa)*hw*.95); } ctx.stroke(); }
  ellipse(ctx, 0, 0, 4.2, 3.4); ctx.fillStyle = '#f4f6ea'; ctx.fill(); ctx.strokeStyle = '#829b74'; ctx.lineWidth = .7; ctx.stroke();
}

/* ---------- 8. Insect parts (prepared slide, no motion) ---------- */
const insect = {
  W: 1200, wrap: false, bg: ['#fffdf7', '#f1ead8'],
  init(r){
    // wing: hairs scattered over the membrane
    const hairs = []; for (let i = 0; i < 2600; i++) hairs.push([r(), r(), r()*.6 - .3]);
    const eyeHex = []; const hr = 15;
    for (let q = -40; q <= 40; q++) for (let rr = -40; rr <= 40; rr++){
      const x = hr*1.5*q, y = hr*Math.sqrt(3)*(rr + q/2);
      if (x*x + y*y < 430*430) eyeHex.push([600 + x, 600 + y]);
    }
    const bristles = []; for (let i = 0; i < 160; i++) bristles.push([r(), r() < .5 ? -1 : 1, .6 + r()*.8]);
    return {hairs, eyeHex, hr, bristles, part:'wing'};
  },
  step(){},
  draw(ctx, S, V){
    // each part is scaled about the slide centre so the whole part fits the 40× field
    const sc = {wing:.66, eye:.9, leg:.7}[S.part] || 1;
    V = Object.assign({}, V, {k:V.k*sc, kc:V.kc*sc, Rw:V.Rw/sc, cx:600 + (V.cx - 600)/sc, cy:600 + (V.cy - 600)/sc});
    tissueTransform(ctx, V);
    if (S.part === 'wing') drawWing(ctx, S, V);
    else if (S.part === 'eye') drawEye(ctx, S, V);

  }
};
function wingOutline(ctx){
  ctx.beginPath(); ctx.moveTo(140, 560);
  ctx.bezierCurveTo(380, 410, 820, 380, 1080, 470);
  ctx.bezierCurveTo(1150, 520, 1130, 640, 1040, 690);
  ctx.bezierCurveTo(820, 800, 420, 790, 230, 680);
  ctx.bezierCurveTo(170, 640, 130, 600, 140, 560); ctx.closePath();
}
function drawWing(ctx, S, V){
  wingOutline(ctx);
  const g = ctx.createLinearGradient(140, 420, 1100, 760);
  g.addColorStop(0, '#e8eef6cc'); g.addColorStop(.4, '#f3e9f7cc'); g.addColorStop(.7, '#e6f4eecc'); g.addColorStop(1, '#f6f0dccc');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#8a7a5a'; ctx.lineWidth = 2; ctx.stroke();
  // microtrichia (only drawn where visible)
  if (V.kc > .7){
    ctx.save(); wingOutline(ctx); ctx.clip();
    ctx.strokeStyle = '#8a7a5a66'; ctx.lineWidth = .5; ctx.beginPath();
    for (const h of S.hairs){ const x = 140 + h[0]*1000, y = 380 + h[1]*430; if (Math.abs(x - V.cx) > V.Rw || Math.abs(y - V.cy) > V.Rw) continue; ctx.moveTo(x, y); ctx.lineTo(x + 3.5, y + h[2]*3); }
    ctx.stroke(); ctx.restore();
  }

  ctx.lineCap = 'round'; ctx.strokeStyle = '#6b5636';
  const vein = (w, pts) => { ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); ctx.bezierCurveTo(pts[2], pts[3], pts[4], pts[5], pts[6], pts[7]); ctx.stroke(); };

  vein(4, [150, 565, 420, 470, 760, 460, 1060, 520]);
  vein(3.4, [160, 572, 430, 520, 760, 540, 1080, 600]);
  vein(3.2, [170, 580, 440, 580, 780, 610, 1040, 690]);
  vein(3, [190, 600, 420, 650, 640, 690, 860, 760]);
  vein(2.6, [210, 630, 330, 690, 420, 720, 520, 770]);
  ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(560, 515); ctx.lineTo(585, 565); ctx.moveTo(760, 560); ctx.lineTo(790, 625); ctx.moveTo(470, 590); ctx.lineTo(490, 650); ctx.stroke();
  // marginal bristles on trailing edge
  if (V.kc > .5){ ctx.strokeStyle = '#6b563699'; ctx.lineWidth = .9; ctx.beginPath(); for (let i = 0; i <= 80; i++){ const u = i/80, x = lerp(1040, 230, u), y = 690 + Math.sin(u*Math.PI)*105; ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 12); } ctx.stroke(); }
  anchor(ctx, V.L, 700, 410, 'العرق الأمامي', -1);
  anchor(ctx, V.L, 640, 600, 'الغشاء الشفاف', 1);
  anchor(ctx, V.L, 860, 545, 'العروق', -1);
  anchor(ctx, V.L, 520, 777, 'شعيرات الحافة', 1);
}
function drawEye(ctx, S, V){
  const R = 440;
  ellipse(ctx, 600, 600, R, R);
  const g = ctx.createRadialGradient(480, 470, 40, 600, 600, R);
  g.addColorStop(0, '#d9785e'); g.addColorStop(.6, '#a2392e'); g.addColorStop(1, '#5b1b1a');

  // ommatidia (hexagonal facets)
  const hr = S.hr*.96;
  ctx.beginPath();
  for (const h of S.eyeHex){
    if (Math.abs(h[0] - V.cx) > V.Rw + hr || Math.abs(h[1] - V.cy) > V.Rw + hr) continue;
    for (let i = 0; i < 6; i++){ const a = i/6*TAU, x = h[0] + Math.cos(a)*hr, y = h[1] + Math.sin(a)*hr; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.closePath();
  }
  ctx.strokeStyle = '#3d0f0fcc'; ctx.lineWidth = 1.6; ctx.stroke();
  if (V.kc > 1.2){
    ctx.fillStyle = '#ffffff55';
    for (const h of S.eyeHex){ if (Math.abs(h[0] - V.cx) > V.Rw || Math.abs(h[1] - V.cy) > V.Rw) continue; ellipse(ctx, h[0] - 4, h[1] - 4, 3, 2); ctx.fill(); }
  }

function nearestHex(list, x, y){ let b = null, bd = 1e9; for (const h of list){ const d = (h[0] - x)**2 + (h[1] - y)**2; if (d < bd){ bd = d; b = h; } } return b; }
function drawLeg(ctx, S, V){
  // segments: coxa → trochanter → femur → tibia → 5 tarsomeres → claws
  const segs = [[170, 190, 260, 250, 60, 'الحرقفة'], [260, 250, 300, 290, 40, ''], [300, 290, 560, 470, 46, 'الفخذ'], [560, 470, 820, 720, 30, 'الساق'], [820, 720, 880, 790, 20, ''], [880, 790, 925, 840, 18, ''], [925, 840, 960, 880, 17, ''], [960, 880, 990, 915, 16, ''], [990, 915, 1025, 955, 16, 'الرسغ']];
  segs.forEach((s, i) => {
    const [x0, y0, x1, y1, w] = s, a = Math.atan2(y1 - y0, x1 - x0), L = Math.hypot(x1 - x0, y1 - y0);
    ctx.save(); ctx.translate(x0, y0); ctx.rotate(a);

    if (V.kc > .45){ ctx.strokeStyle = '#4b2e14cc'; ctx.lineWidth = 1.4; ctx.beginPath(); for (let j = 0; j < 14; j++){ const u = (j + .5)/14, side = j % 2 ? 1 : -1; ctx.moveTo(u*L, side*w*.45); ctx.lineTo(u*L + 18, side*(w*.45 + 16)); } ctx.stroke(); }
    ctx.beginPath(); ctx.ellipse(L/2, 0, L/2 + w*.15, w/2, 0, 0, TAU);
    const g = ctx.createLinearGradient(0, -w/2, 0, w/2); g.addColorStop(0, '#d8a865'); g.addColorStop(.5, '#a8692c'); g.addColorStop(1, '#6e4219');
    ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#4b2e14'; ctx.lineWidth = 2; ctx.stroke();
    if (V.kc > 1){ ctx.fillStyle = '#4b2e1466'; for (let j = 0; j < 20; j++){ ellipse(ctx, (j*.618 % 1)*L, ((j*.37 % 1) - .5)*w*.6, 1.6, 1.6); ctx.fill(); } }
    if (s[5]) anchor(ctx, V.L, L/2, -w/2, s[5], i % 2 ? 1 : -1);
    ctx.restore();
  });
  // claws and pad (pulvillus)
  ctx.save(); ctx.translate(1030, 960);
  ctx.strokeStyle = '#3a210c'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(40, 0, 50, 34); ctx.moveTo(0, 0); ctx.quadraticCurveTo(10, 40, -14, 58); ctx.stroke();
  ellipse(ctx, 22, 22, 16, 9, .8); ctx.fillStyle = '#f2d9a4cc'; ctx.fill(); ctx.strokeStyle = '#a07a3a'; ctx.lineWidth = 1; ctx.stroke();
  anchor(ctx, V.L, 50, 34, 'المخالب', 1);
  anchor(ctx, V.L, 22, 22, 'الوسادة اللاصقة', -1);
  ctx.restore();
}

const SPECIMENS = {bacteria, ecoli, amoeba, paramecium, euglena, onion, leaf, spirogyra, insect};

/* ============================================================
   Lens engine — draws the eyepiece view on a canvas
   ============================================================ */
class LensEngine {
  constructor(){
    this.canvas = null; this.ctx = null; this.dpr = 1; this.size = 0;
    this.id = null; this.S = null; this.spec = null;
    this.lz = 0; this.zt = 1; this.cx = 500; this.cy = 500;
    this.t = 0; this.power = 0; this.powerTarget = 0;
    this.trans = 0; this.labels = true; this.follow = null;
    this.focusOffset = 0; this.onTick = null; this.running = false; this.measure = null; this.um = 1;
  }
  attach(canvas){
    this.canvas = canvas; this.ctx = canvas.getContext('2d');
    this.resize();
    if (!this.running){ this.running = true; this.last = performance.now(); requestAnimationFrame(this.loop.bind(this)); }
  }
  detach(canvas){ if (this.canvas === canvas) this.canvas = null; }
  resize(){
    if (!this.canvas) return;
    const r = this.canvas.getBoundingClientRect();
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    const px = Math.max(100, Math.round(r.width*this.dpr));
    if (this.canvas.width !== px){ this.canvas.width = px; this.canvas.height = px; }
    this.size = px;
  }
  setSample(id, seed){
    const spec = SPECIMENS[id];
    this.id = id; this.spec = spec;
    const part = this.S && this.S.part;
    this.S = spec.init(mulberry32(seed || 1234));
    if (id === 'insect' && part) this.S.part = part;
    this.cx = spec.W/2; this.cy = spec.W/2; this.follow = null;
    this.trans = 1;
    // warm up the motion so organisms are mid-activity
    for (let i = 0; i < 40; i++) spec.step(this.S, 1/20, i/20);
  }
  get zoom(){ return Math.exp(this.lz); }
  pan(dxPx, dyPx){
    const k = this.size/2/(BASE_R/this.zoom)/this.dpr;
    this.cx -= dxPx/k; this.cy -= dyPx/k; this.follow = null; this.clampView();
  }

function drawScene(cv){
  const w = Math.max(320, window.innerWidth), h = Math.max(480, window.innerHeight), d = Math.min(window.devicePixelRatio || 1, 1.5);
  cv.width = Math.round(w*d); cv.height = Math.round(h*d);
  const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#e6ecf6'); g.addColorStop(.62, '#f4eef0'); g.addColorStop(.63, '#dfe3ea'); g.addColorStop(1, '#f3f4f7');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  // window with daylight
  const wx = w*.04, wy = h*.04, ww = w*.3, wh = h*.48;
  const sky = c.createLinearGradient(0, wy, 0, wy + wh); sky.addColorStop(0, '#cfe9ff'); sky.addColorStop(1, '#fff6e6');
  c.fillStyle = sky; c.fillRect(wx, wy, ww, wh);
  c.fillStyle = '#ffffffcc'; c.beginPath(); c.arc(wx + ww*.7, wy + wh*.3, ww*.22, 0, TAU); c.fill();
  c.strokeStyle = '#ffffff'; c.lineWidth = 10; c.strokeRect(wx, wy, ww, wh);
  c.lineWidth = 6; c.beginPath(); c.moveTo(wx + ww/2, wy); c.lineTo(wx + ww/2, wy + wh); c.moveTo(wx, wy + wh/2); c.lineTo(wx + ww, wy + wh/2); c.stroke();
  // shelves with glassware and plants
  const r = mulberry32(9), pastel = ['#9fd8ff', '#ffb3c7', '#b9f2c9', '#ffe08a', '#c9b6ff', '#8fe3d8'];
  const shelf = (x0, x1, y) => {
    c.fillStyle = '#d9c6ad'; c.fillRect(x0, y, x1 - x0, 10); c.fillStyle = '#bfa88b'; c.fillRect(x0, y + 10, x1 - x0, 4);
    let x = x0 + 12;
    while (x < x1 - 30){
      const t = r(), ht = 30 + r()*50, wd = 18 + r()*24, col = pastel[(r()*pastel.length)|0];
      if (t < .2){ // plant
        c.fillStyle = '#e4a07a'; c.fillRect(x, y - 24, wd + 6, 24);
        c.fillStyle = '#6dbb6a'; for (let k = 0; k < 6; k++){ c.beginPath(); c.ellipse(x + wd/2 + (r() - .5)*wd*1.4, y - 30 - r()*36, 10, 20, (r() - .5)*1.6, 0, TAU); c.fill(); }
      } else if (t < .55){ // flask
        c.fillStyle = '#ffffffaa'; c.fillRect(x + wd*.35, y - ht, wd*.3, ht*.5);
        c.beginPath(); c.moveTo(x + wd*.35, y - ht*.5); c.lineTo(x, y); c.lineTo(x + wd, y); c.lineTo(x + wd*.65, y - ht*.5); c.closePath(); c.fill();
        c.fillStyle = col; c.beginPath(); c.moveTo(x + wd*.18, y - ht*.25); c.lineTo(x, y); c.lineTo(x + wd, y); c.lineTo(x + wd*.82, y - ht*.25); c.closePath(); c.fill();
      } else { // jar / test tubes
        c.fillStyle = '#ffffffaa'; c.fillRect(x, y - ht, wd, ht); c.fillStyle = col; c.fillRect(x, y - ht*.55, wd, ht*.55);
      }
      x += wd + 10 + r()*16;
    }
  };
  shelf(w*.62, w*.98, h*.16); shelf(w*.62, w*.98, h*.38); shelf(w*.02, w*.36, h*.6);
  // poster
  const px = w*.4, py = h*.12, pw = w*.13, ph = h*.36;
  c.fillStyle = '#fff'; c.fillRect(px, py, pw, ph); c.strokeStyle = '#e7d6ef'; c.lineWidth = 6; c.strokeRect(px, py, pw, ph);
  c.fillStyle = '#7a4fd0'; c.font = `800 ${Math.max(14, pw*.2)}px "Baloo Bhaijaan 2", Tajawal, sans-serif`; c.textAlign = 'center'; c.direction = 'rtl';
  ['اكتشف', 'لاحظ', 'تعلّم', 'استمتع'].forEach((t, i) => c.fillText(t, px + pw/2, py + ph*(.24 + i*.2)));
  // bench edge highlight
  c.fillStyle = '#ffffff99'; c.fillRect(0, h*.63, w, 6);
  c.fillStyle = '#c9cfd9'; c.beginPath(); c.ellipse(w*.72, h*.82, 60, 14, 0, 0, TAU); c.fill();
  c.fillStyle = '#7fc4ee66'; c.fillRect(w*.86, h*.66, 26, 70); c.fillRect(w*.9, h*.68, 26, 66);
}

/* ---------------- Lens ---------------- */
function Lens({sampleId, levelIdx, setLevel, focus, recording, recSecs, flashKey, followOn, setFollowOn, onNeedSample, measureOn, onMeasured}){
  const canvasRef = useRef(null), magRef = useRef(null);
  const pointers = useRef(new Map()), gesture = useRef(null), wheelLock = useRef(0), mref = useRef(measureOn);
  mref.current = measureOn;
  useEffect(() => {
    const c = canvasRef.current; lens.attach(c);
    const ro = new ResizeObserver(() => lens.resize()); ro.observe(c);
    lens.onTick = (e) => { if (magRef.current) magRef.current.textContent = Math.round(40*e.zoom) + '×'; };
    const h = (e) => { e.preventDefault(); const now = performance.now(); if (now - wheelLock.current < 450) return; wheelLock.current = now; setLevel(l => clamp(l + (e.deltaY < 0 ? 1 : -1), 0, 2)); };
    c.addEventListener('wheel', h, {passive:false});
    return () => { ro.disconnect(); lens.detach(c); lens.onTick = null; c.removeEventListener('wheel', h); };
  }, []);
  const blur = Math.abs(focus - 50)/50*7;
  const local = (e) => { const r = canvasRef.current.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const onDown = (e) => {
    const c = canvasRef.current; try { c.setPointerCapture(e.pointerId); } catch (_) {}
    if (mref.current && sampleId){ const [x, y] = local(e); lens.measure = {x0:x, y0:y, x1:x, y1:y}; pointers.current.set(e.pointerId, {measure:true}); return; }
    pointers.current.set(e.pointerId, {x:e.clientX, y:e.clientY, x0:e.clientX, y0:e.clientY});
    if (pointers.current.size === 2){ const [a, b] = [...pointers.current.values()]; gesture.current = {d0:Math.hypot(a.x - b.x, a.y - b.y), done:false}; }
    c.classList.add('dragging');
  };
  const onMove = (e) => {
    const p = pointers.current.get(e.pointerId); if (!p) return;
    if (p.measure){ const [x, y] = local(e); if (lens.measure){ lens.measure.x1 = x; lens.measure.y1 = y; } return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (pointers.current.size === 1){ if (Math.hypot(p.x - p.x0, p.y - p.y0) > 6){ lens.pan(dx, dy); if (followOn) setFollowOn(false); } }
    else if (pointers.current.size === 2 && gesture.current && !gesture.current.done){
      const [a, b] = [...pointers.current.values()], d = Math.hypot(a.x - b.x, a.y - b.y), ratio = d/gesture.current.d0;
      if (ratio > 1.35){ setLevel(l => Math.min(2, l + 1)); gesture.current.done = true; }
      if (ratio < .74){ setLevel(l => Math.max(0, l - 1)); gesture.current.done = true; }
    }
  };
  const onUp = (e) => {
    const p = pointers.current.get(e.pointerId); pointers.current.delete(e.pointerId);
    if (p && p.measure){ const m = lens.measure; if (m && Math.hypot(m.x1 - m.x0, m.y1 - m.y0) > 8) onMeasured(lens.measureText()); else lens.measure = null; return; }
    if (pointers.current.size < 2) gesture.current = null;
    canvasRef.current.classList.remove('dragging');
    if (p && Math.hypot(p.x - p.x0, p.y - p.y0) < 6 && !gesture.current){
      if (!sampleId){ onNeedSample(); return; }
      const [x, y] = local(e);
      const f = lens.pick(x, y);
      setFollowOn(!!f); if (f) Sound.click();
    }
  };
  return html`<div class="lens-wrap">
    <div class="lens-glow"></div>
    <div class="lens-ring"><div class="lens-inner">
      <canvas id="lens-canvas" ref=${canvasRef} class=${measureOn ? 'measure' : ''} style=${{filter:blur > .3 ? `blur(${blur.toFixed(1)}px)` : 'none'}}
        onPointerDown=${onDown} onPointerMove=${onMove} onPointerUp=${onUp} onPointerCancel=${onUp}
        role="img" aria-label=${sampleId ? 'منظر العينة ' + SAMPLE_BY_ID[sampleId].name + ' تحت المجهر' : 'عدسة المجهر'}></canvas>
      ${!sampleId ? html`<div class="lens-msg">اختاري عينة من القائمة لتظهر هنا 🔍</div>` : null}
      <div class=${'flash' + (flashKey ? ' go' : '')} key=${flashKey}></div>
    </div></div>
    <div class="mag-badge" ref=${magRef}>${LEVELS[levelIdx].mag}×</div>
    ${recording ? html`<div class="rec-dot">تسجيل ${recSecs}ث</div>` : null}
    ${measureOn ? html`<div class="measure-tag">اسحبي خطًا على الجزء الذي تريدين قياسه</div>`
      : followOn ? html`<div class="follow-tag">نتتبّع الكائن — اسحبي لإيقاف التتبّع</div>` : null}
    <div class="sim-badge">محاكاة تعليمية</div>
  </div>`;
}

function InfoCard({s, part, setPart, speaking, onSpeak}){

function QuizCard({progress, quiz, answer, onAnswer, onNow}){
  const [sel, setSel] = useState(null);
  if (!quiz){
    const left = Math.max(0, Math.ceil(QUESTION_DELAY - progress)), frac = clamp(progress/QUESTION_DELAY, 0, 1), C = 2*Math.PI*18;
    return html`<section class="card quiz">
      <div class="card-h rose">نشاط تفاعلي</div>
      <div class="card-b wait">
        <svg class="ring" viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="18"/><circle class="fg" cx="22" cy="22" r="18" stroke-dasharray=${C} stroke-dashoffset=${C*(1 - frac)} transform="rotate(-90 22 22)"/></svg>
        <div style=${{flex:1}}>
          <p>شاهدي العينة جيدًا… سيظهر سؤال المستكشفة الذكية بعد <b>${left.toLocaleString('ar-EG')}</b> ثوانٍ.</p>
          <button class="btn ghost" style=${{minHeight:'40px', marginTop:'6px', padding:'2px 12px'}} onClick=${onNow}>أنا جاهزة الآن</button>
        </div>
      </div>
    </section>`;
  }
  const done = answer && answer.correct;
  return html`<section class="card quiz fade-in">
    <div class="card-h rose">🧠 المستكشفة الذكية</div>
    <div class="card-b">
      <p class="q">${quiz.q}</p>
      <div class="radios" role="radiogroup" aria-label=${quiz.q}>
        ${quiz.o.map((o, i) => {
          let cls = 'radio';
          const picked = answer ? answer.pick === i : sel === i;
          if (picked) cls += ' sel';
          if (answer && answer.pick === i) cls += answer.correct ? ' right' : ' wrong';
          if (done && i === quiz.a) cls += ' right';
          return html`<button key=${i} role="radio" aria-checked=${picked} class=${cls} disabled=${!!answer} onClick=${() => { Sound.click(); setSel(i); }}><span class="dot"></span>${LETTERS[i]}- ${o}</button>`;
        })}
      </div>
      ${answer ? (answer.correct
        ? html`<div class="fb ok">⭐ رائعة يا عالمة المستقبل!</div>`
        : html`<div class="fb no">🌱 محاولة جميلة! شاهدي العينة مرة أخرى.</div>`)
        : html`<button class="check-btn" disabled=${sel === null} onClick=${() => onAnswer(sel)}><${Icon} n="check" />تحقق من الإجابة</button>`}

/* ---------------- Challenge ---------------- */
function buildChallenge(){
  const pool = SAMPLES.map(s => s.quiz).concat(EXTRA_Q);
  return shuffle(pool).slice(0, 5).map(shuffledQ);
}
function Challenge({onFinish, onBack}){
  const [qs] = useState(buildChallenge);
  const [i, setI] = useState(0);
  const [pick, setPick] = useState(null);
  const [res, setRes] = useState([]);
  const [burst, setBurst] = useState(null);
  const q = qs[i];
  const answer = (k) => {
    if (pick !== null) return;
    setPick(k); const ok = k === q.a; setRes(r => r.concat(ok));
    if (ok){ Sound.success(); setBurst('رائعة يا عالمة المستقبل!'); } else Sound.tryAgain();
  };
  const next = () => { Sound.click(); if (i < 4){ setI(i + 1); setPick(null); } else onFinish(res.filter(Boolean).length); };
  return html`<main class="shell fade-in"><div class="challenge">
    <header class="topbar" style=${{width:'100%'}}>
      <h1 style=${{fontSize:'clamp(24px,3vw,34px)'}}>🏆 التحدي العلمي</h1>
      <button class="btn peach" onClick=${onBack}><span class="ic">🏠</span>العودة للمختبر</button>
    </header>
    <div class="dots" aria-label="تقدم الأسئلة">${qs.map((_, k) => html`<i key=${k} class=${k < res.length ? (res[k] ? 'ok' : 'no') : k === i ? 'cur' : ''}></i>`)}</div>
    <section class="panel ch-card">
      <span class="chip">السؤال ${(i + 1).toLocaleString('ar-EG')} من ٥</span>
      <p class="ch-q">${q.q}</p>
      <div class="opts">
        ${q.o.map((o, k) => {
          let cls = 'opt';
          if (pick !== null){ if (k === q.a) cls += ' right'; else if (k === pick) cls += ' wrong'; }
          return html`<button key=${i + '-' + k} class=${cls} disabled=${pick !== null} onClick=${() => answer(k)}><span class="l">${LETTERS[k]}</span>${o}</button>`;
        })}
      </div>
      ${pick !== null ? html`<div class=${'fb ' + (pick === q.a ? 'ok' : 'no')}>${pick === q.a ? '⭐ رائعة يا عالمة المستقبل!' : '🌱 محاولة جميلة! الإجابة الصحيحة مظللة بالأخضر.'}</div>
        <div class="row" style=${{marginTop:'14px', justifyContent:'flex-start'}}><button class="btn primary" onClick=${next}>${i < 4 ? 'السؤال التالي ←' : 'شاهدي نتيجتك ←'}</button></div>` : null}
    </section>
    ${burst ? html`<${StarBurst} text=${burst} onDone=${() => setBurst(null)} />` : null}
  </div></main>`;
}
function Result({score, onCert, onRetry, onBack}){
  const msg = score === 5 ? 'مذهلة! أنتِ عالمة مجهريات حقيقية!' : score >= 3 ? 'أحسنتِ! معلوماتك رائعة.' : 'بداية جميلة! عودي للمختبر وشاهدي العينات ثم حاولي مرة أخرى.';
  return html`<main class="shell fade-in"><div class="challenge">
    <section class="panel ch-card result">
      <h1 style=${{fontSize:'clamp(24px,3vw,34px)'}}>نتيجتك في التحدي</h1>

      <p style=${{fontFamily:'var(--f-display)', fontSize:'22px', fontWeight:700}}>${msg}</p>

  </div></main>`;
}

/* ---------------- Certificate (drawn on canvas so it can be saved as an image) ---------------- */
function drawCertificate(canvas, name, score){
  const W = 1600, H = 1130; canvas.width = W; canvas.height = H;
  const c = canvas.getContext('2d');
  const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#f6f1ff'); g.addColorStop(.5, '#fffaf0'); g.addColorStop(1, '#e8f7f1');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // pastel cells drifting in the margins
  const r = mulberry32(5);
  for (let i = 0; i < 26; i++){ const x = r()*W, y = r() < .5 ? r()*170 : H - r()*170, s = 18 + r()*40; c.beginPath(); c.ellipse(x, y, s, s*.7, r()*3, 0, TAU); c.fillStyle = ['#d8ccff99', '#bfeedd99', '#ffe0d499', '#fff0b399'][i % 4]; c.fill(); }
  c.lineWidth = 14; c.strokeStyle = '#7856d8'; c.strokeRect(46, 46, W - 92, H - 92);
  c.lineWidth = 3; c.strokeStyle = '#ffd75e'; c.strokeRect(74, 74, W - 148, H - 148);
  c.direction = 'rtl'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = '#3aa58a'; c.font = '700 38px "Baloo Bhaijaan 2", Tajawal, sans-serif'; c.fillText('مختبر المستكشفات الصغيرات', W/2, 170);
  c.fillStyle = '#2b2442'; c.font = '800 96px "Baloo Bhaijaan 2", Tajawal, sans-serif'; c.fillText('شهادة', W/2, 290);
  c.fillStyle = '#7856d8'; c.font = '800 70px "Baloo Bhaijaan 2", Tajawal, sans-serif'; c.fillText('مستكشفة العالم المجهري', W/2, 400);
  c.fillStyle = '#6a6382'; c.font = '500 40px Tajawal, sans-serif'; c.fillText('تُمنح هذه الشهادة للمستكشفة', W/2, 505);
  const nm = (name || '').trim() || '..............................';
  c.fillStyle = '#2b2442'; c.font = '800 84px "Baloo Bhaijaan 2", Tajawal, sans-serif'; c.fillText(nm, W/2, 610);
  c.strokeStyle = '#ffd75e'; c.lineWidth = 5; c.beginPath(); c.moveTo(W/2 - 380, 672); c.lineTo(W/2 + 380, 672); c.stroke();
  c.fillStyle = '#2b2442'; c.font = '500 38px Tajawal, sans-serif';
  c.fillText('لإتمامها رحلة استكشاف المخلوقات الحية الدقيقة بالمجهر الرقمي', W/2, 745);
  c.fillText(`وحصولها على ${score.toLocaleString('ar-EG')} من ٥ نجوم في التحدي العلمي`, W/2, 800);
  c.font = '64px sans-serif'; c.fillText('⭐'.repeat(Math.max(0, score)) || '🌱', W/2, 885);
  let date = ''; try { date = new Date().toLocaleDateString('ar-SA', {year:'numeric', month:'long', day:'numeric'}); } catch (e) { date = new Date().toDateString(); }
  c.font = '500 30px Tajawal, sans-serif'; c.fillStyle = '#6a6382';
  c.textAlign = 'right'; c.fillText('التاريخ: ' + date, W - 160, 990);
  c.textAlign = 'left'; c.fillStyle = '#2b2442'; c.font = '700 36px "Baloo Bhaijaan 2", Tajawal, sans-serif'; c.fillText('المعلمة: أ/ شامه البقمي', 160, 990);
  // seal
  c.save(); c.translate(W/2, 1000); c.fillStyle = '#ffd75e'; c.beginPath(); for (let i = 0; i < 24; i++){ const a = i/24*TAU, rr = i % 2 ? 52 : 64; c.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } c.closePath(); c.fill();
  c.fillStyle = '#7856d8'; c.beginPath(); c.arc(0, 0, 42, 0, TAU); c.fill(); c.font = '44px sans-serif'; c.textAlign = 'center'; c.fillText('🔬', 0, 4); c.restore();
}
function Certificate({score, name, setName, onAlbum, onHome, onLab}){
  const cv = useRef(null), [img, setImg] = useState('');
  useEffect(() => {
    let alive = true;
    const go = () => { if (!alive || !cv.current) return; drawCertificate(cv.current, name, score); try { setImg(cv.current.toDataURL('image/png')); } catch (e) { setImg(''); } };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go);
    return () => { alive = false; };
  }, [name, score]);
  return html`<main class="shell fade-in">
    <header class="topbar"><h1 style=${{fontSize:'clamp(24px,3vw,34px)'}}>🎓 شهادتك الرقمية</h1>
      <div class="tb-actions"><button class="btn" onClick=${onLab}>🔬 المختبر</button><button class="btn peach" onClick=${onHome}><span class="ic">🏠</span>الرئيسية</button></div></header>
    <div class="cert">
      <section class="panel" style=${{display:'flex', flexDirection:'column', gap:'12px'}}>
        <div class="field"><label for="student-name">اكتبي اسمك</label>
          <input id="student-name" value=${name} maxLength="32" placeholder="مثال: ريم محمد" onInput=${e => setName(e.target.value)} autoComplete="off" /></div>
        <p>يتغير اسمك في الشهادة مباشرة.</p>
        <button class="btn primary" onClick=${() => onAlbum(img)} disabled=${!img}>🖼️ أضيفي الشهادة إلى الألبوم</button>
        <p class="hint">لحفظ الشهادة على جهازك: اضغطي على صورة الشهادة مطولًا (في الجوال أو السبورة الذكية) أو انقري بالزر الأيمن واختاري «حفظ الصورة».</p>
      </section>
      <div style=${{minWidth:0}}>
        <canvas ref=${cv} hidden></canvas>
        ${img ? html`<img src=${img} alt=${'شهادة مستكشفة العالم المجهري للطالبة ' + (name || '')} />` : html`<div class="panel">جارٍ تجهيز الشهادة…</div>`}
      </div>
    </div>
  </main>`;
}

/* ---------------- App ---------------- */
function pickRecorderType(){
  if (!window.MediaRecorder) return null;
  for (const t of ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4']) { try { if (MediaRecorder.isTypeSupported(t)) return t; } catch (e) {} }
  return '';
}
const REC_TYPE = pickRecorderType();
const CAN_RECORD = REC_TYPE !== null && typeof HTMLCanvasElement !== 'undefined' && !!HTMLCanvasElement.prototype.captureStream;

function App(){
  const [screen, setScreen] = useState('home');
  const [power, setPower] = useState(false);
  const [sampleId, setSampleId] = useState(null);
  const [levelIdx, setLevelIdx] = useState(0);
  const [focus, setFocus] = useState(50);
  const [labels, setLabels] = useState(true);
  const [part, setPart] = useState('wing');
  const [viewed, setViewed] = useState({}); // id -> seconds watched
  const [starred, setStarred] = useState({});
  const [quiz, setQuiz] = useState(null);
  const [answer, setAnswer] = useState(null);
  const [toast, setToast] = useState('');
  const [burst, setBurst] = useState(null);
  const [album, setAlbum] = useState([]);
  const [albumOpen, setAlbumOpen] = useState(false);
  const [muted, setMuted] = useState(false);
  const [recording, setRecording] = useState(false);
  const [recSecs, setRecSecs] = useState(0);
  const [flashKey, setFlashKey] = useState(0);
  const [followOn, setFollowOn] = useState(false);
  const [speaking, setSpeaking] = useState(false);
  const [measureOn, setMeasureOn] = useState(false);
  const [moreOpen, setMoreOpen] = useState(false);
  const [score, setScore] = useState(0);
  const [name, setName] = useState('');
  const recRef = useRef(null), toastT = useRef(0), focusAnim = useRef(0);

  const say = useCallback((m) => { setToast(m); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToast(''), 3600); }, []);

  // keep engines in sync
  useEffect(() => { lens.powerTarget = power ? 1 : 0; Scope3D && Scope3D.setPower(power); }, [power]);
  useEffect(() => { lens.zt = LEVELS[levelIdx].z; Scope3D && Scope3D.setTurret(levelIdx); }, [levelIdx]);
  useEffect(() => { lens.labels = labels; }, [labels]);
  useEffect(() => { if (lens.S && sampleId === 'insect') lens.S.part = part; }, [part, sampleId]);
  useEffect(() => { Scope3D && Scope3D.turnKnob((focus - 50)/50*Math.PI); }, [focus]);
  useEffect(() => { Sound.muted = muted; }, [muted]);

  // watch timer → smart explorer question
  useEffect(() => {
    if (screen !== 'lab' || !sampleId || quiz) return;
    const id = setInterval(() => {
      setViewed(v => Object.assign({}, v, {[sampleId]: Math.min(QUESTION_DELAY, (v[sampleId] || 0) + .25)}));
    }, 250);
    return () => clearInterval(id);
  }, [screen, sampleId, quiz]);
  const progress = sampleId ? (viewed[sampleId] || 0) : 0;
  useEffect(() => {
    if (sampleId && !quiz && progress >= QUESTION_DELAY && screen === 'lab'){ setQuiz(shuffledQ(SAMPLE_BY_ID[sampleId].quiz)); setAnswer(null); Sound.pop(); }
  }, [progress, sampleId, quiz, screen]);
  const explored = SAMPLES.filter(s => (viewed['done_' + s.id])).length;
  useEffect(() => { if (sampleId && progress >= QUESTION_DELAY && !viewed['done_' + sampleId]) setViewed(v => Object.assign({}, v, {['done_' + sampleId]: true})); }, [progress, sampleId]);

  const stopSpeech = () => { Speech.stop(); setSpeaking(false); };

  const autoFocus = () => {
    // the image starts a little blurry and settles, like turning the fine-focus knob
    cancelAnimationFrame(focusAnim.current);
    const start = performance.now(), from = 50 + (Math.random() < .5 ? -1 : 1)*30;
    const step = (now) => { const u = Math.min(1, (now - start)/1100); setFocus(Math.round(lerp(from, 50, 1 - Math.pow(1 - u, 3)))); if (u < 1) focusAnim.current = requestAnimationFrame(step); };
    focusAnim.current = requestAnimationFrame(step);
  };

  const pick = (id) => {
    if (id === sampleId) return;
    stopSpeech(); Sound.slide();
    lens.setSample(id, Math.floor(Math.random()*1e9)); lens.measure = null; lens.um = umPerUnit(id, part);
    if (id === 'insect') lens.S.part = part;
    Scope3D && Scope3D.setSlide(SAMPLE_BY_ID[id].color);
    setSampleId(id); setQuiz(null); setAnswer(null); setFollowOn(false);
    setViewed(v => Object.assign({}, v, {[id]: v['done_' + id] ? 0 : (v[id] || 0)}));
    autoFocus();
  };

  const actions = {
    pick,
    setLevel: (l) => { setLevelIdx(prev => {
      const n = clamp(typeof l === 'function' ? l(prev) : l, 0, 2);
      if (n !== prev){ Sound.zoom(n > prev); lens.measure = null; }
      // swimmers leave a high-power field quickly, so zooming in locks onto the nearest one
      if (n > prev && n > 0 && !lens.follow && lens.followNearest()) setFollowOn(true);
      return n; }); },
    zoomIn: () => actions.setLevel(l => Math.min(2, l + 1)),
    zoomOut: () => actions.setLevel(l => Math.max(0, l - 1)),
    next: () => { const i = sampleId ? SAMPLES.findIndex(s => s.id === sampleId) : -1; pick(SAMPLES[(i + 1) % SAMPLES.length].id); },
    needSample: () => say('اختاري عينة من قائمة العينات أولًا 🦠'),
    setFocus: (v) => { cancelAnimationFrame(focusAnim.current); setFocus(v); },
    toggleLabels: () => { Sound.click(); setLabels(x => !x); },
    setPart: (p) => { Sound.click(); setPart(p); lens.trans = .6; lens.measure = null; lens.um = umPerUnit(sampleId, p); autoFocus(); },
    toggleMeasure: () => { Sound.click(); setMeasureOn(m => { if (m) lens.measure = null; else { setFollowOn(false); lens.follow = null; say('اسحبي خطًا على العينة لقياسها. القياس تقريبي ضمن المحاكاة.'); } return !m; }); },
    measured: (txt) => { Sound.pop(); say('📏 الطول التقريبي ' + txt); },
    openMore: () => { Sound.click(); setMoreOpen(true); },
    setFollowOn,
    toggleMute: () => { setMuted(m => { Sound.muted = !m; if (m) Sound.click(); return !m; }); },
    home: () => { stopSpeech(); if (recording) stopRec(); Sound.click(); setScreen('home'); },
    openAlbum: () => { Sound.click(); setAlbumOpen(true); },
    challenge: () => { stopSpeech(); if (recording) stopRec(); Sound.click(); setScreen('challenge'); },
    quizNow: () => setViewed(v => Object.assign({}, v, {[sampleId]: QUESTION_DELAY})),
    answer: (i) => {
      if (!quiz || answer) return;
      const correct = i === quiz.a; setAnswer({pick:i, correct});
      if (correct){ Sound.success(); setBurst('رائعة يا عالمة المستقبل!'); setStarred(s => Object.assign({}, s, {[sampleId]: true})); }
      else { Sound.tryAgain(); setTimeout(() => { setQuiz(null); setAnswer(null); setViewed(v => Object.assign({}, v, {[sampleId]: 0})); }, 2600); }
    },
    snap: () => {
      if (!lens.canvas) return;
      Sound.shutter(); setFlashKey(k => k + 1);
      const src = lens.canvas, sz = src.width, out = document.createElement('canvas'), pad = Math.round(sz*.16);
      out.width = sz; out.height = sz + pad; const c = out.getContext('2d');
      c.fillStyle = '#ffffff'; c.fillRect(0, 0, out.width, out.height);
      c.save(); c.beginPath(); c.arc(sz/2, sz/2, sz/2 - 4, 0, TAU); c.clip();
      c.filter = Math.abs(focus - 50) > 4 ? `blur(${(Math.abs(focus - 50)/50*7*lens.dpr).toFixed(1)}px)` : 'none';
      c.drawImage(src, 0, 0); c.restore();
      c.lineWidth = 8; c.strokeStyle = '#7856d8'; c.beginPath(); c.arc(sz/2, sz/2, sz/2 - 4, 0, TAU); c.stroke();
      const s = SAMPLE_BY_ID[sampleId], mag = LEVELS[levelIdx].mag;
      c.direction = 'rtl'; c.textAlign = 'center'; c.fillStyle = '#2b2442';
      c.font = `700 ${Math.round(pad*.3)}px "Baloo Bhaijaan 2", Tajawal, sans-serif`;
      c.fillText(`${s.parts ? s.parts[part].name : s.name} — ${mag}× (محاكاة تعليمية)`, sz/2, sz + pad*.42);
      c.font = `500 ${Math.round(pad*.2)}px Tajawal, sans-serif`; c.fillStyle = '#6a6382';
      c.fillText('مختبر المستكشفات الصغيرات — إعداد المعلمة: أ/ شامه البقمي', sz/2, sz + pad*.78);
      const url = out.toDataURL('image/png');
      setAlbum(a => [{id:Date.now(), type:'img', src:url, title:`${s.name} ${mag}×`}].concat(a));
      say('📸 حُفظت الصورة في الألبوم');
    },
    toggleRec: () => { recording ? stopRec() : startRec(); },
    speak: () => {
      if (speaking){ stopSpeech(); return; }
      if (!sampleId) return;
      const s = SAMPLE_BY_ID[sampleId], p = s.parts ? s.parts[part] : null;
      const text = [p ? p.name : s.name, s.kind, s.where, s.move, 'ماذا نشاهد؟ ' + (p ? p.see : s.see).join('، '), (p ? p.fact : s.fact) ? 'هل تعلمين؟ ' + (p ? p.fact : s.fact) : ''].join('. ');
      const r = Speech.speak(text, () => setSpeaking(false));
      if (r === 'ok') setSpeaking(true);
      else if (r === 'unsupported') say('متصفحك لا يدعم القراءة الصوتية. يمكنك قراءة البطاقة بدلًا من ذلك.');
      else say('لا يوجد صوت عربي مثبت على هذا الجهاز، فتعذّرت القراءة. جرّبي متصفح Chrome أو Edge أو جهازًا آخر.');
    }
  };

  function startRec(){
    if (!CAN_RECORD || !lens.canvas) return;
    try {
      const stream = lens.canvas.captureStream(30);
      const rec = REC_TYPE ? new MediaRecorder(stream, {mimeType:REC_TYPE}) : new MediaRecorder(stream);
      const chunks = []; const s = SAMPLE_BY_ID[sampleId];
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        clearInterval(recRef.current && recRef.current.timer);
        const blob = new Blob(chunks, {type:rec.mimeType || 'video/webm'});
        if (blob.size){ setAlbum(a => [{id:Date.now(), type:'video', src:URL.createObjectURL(blob), title:`🎥 ${s.name}`}].concat(a)); say('🎥 حُفظ التسجيل في الألبوم'); }
        else say('لم يُسجَّل شيء. حاولي مرة أخرى.');
        setRecording(false); setRecSecs(0); recRef.current = null;
      };
      rec.start(500); Sound.rec();
      const t0 = Date.now();
      const timer = setInterval(() => { const secs = Math.floor((Date.now() - t0)/1000); setRecSecs(secs); if (secs >= 20) stopRec(); }, 250);
      recRef.current = {rec, timer}; setRecording(true); say('بدأ التسجيل (حتى ٢٠ ثانية)');
    } catch (e) { say('تعذّر بدء التسجيل في هذا المتصفح.'); setRecording(false); }
  }
  function stopRec(){ const r = recRef.current; if (r && r.rec.state !== 'inactive'){ clearInterval(r.timer); r.rec.stop(); } }

  const onPower = () => {
    if (!power){
      Sound.power(); setPower(true);
      setTimeout(() => { Speech.speak('مرحبًا أيتها المستكشفة الصغيرة! هيا نكتشف عالمًا لا تراه أعيننا!'); }, 700);
    } else { Sound.powerOff(); setPower(false); stopSpeech(); }
  };
  const enterLab = () => { Sound.click(); setScreen('lab'); if (!sampleId) setTimeout(() => say('اختاري عينة من قائمة العينات 🦠'), 400); };

  const stars = Object.keys(starred).length;
  const labState = {sampleId, levelIdx, focus, explored, stars, labels, part, recording, recSecs, flashKey, followOn, speaking, progress, quiz, answer, starred, muted, albumCount:album.length, canRecord:CAN_RECORD, measureOn};

  let body;
  if (screen === 'home') body = html`<${Home} power=${power} onPower=${onPower} onEnter=${enterLab} />`;
  else if (screen === 'lab') body = html`<${Lab} state=${labState} actions=${actions} />`;
  else if (screen === 'challenge') body = html`<${Challenge} onFinish=${(sc) => { setScore(sc); setScreen('result'); }} onBack=${() => setScreen('lab')} />`;
  else if (screen === 'result') body = html`<${Result} score=${score} onCert=${() => { Sound.success(); setScreen('cert'); }} onRetry=${() => setScreen('challenge')} onBack=${() => setScreen('lab')} />`;
  else body = html`<${Certificate} score=${score} name=${name} setName=${setName} onAlbum=${(src) => { setAlbum(a => [{id:Date.now(), type:'img', src, title:'🎓 شهادتي'}].concat(a)); say('🎓 أُضيفت الشهادة إلى الألبوم'); setAlbumOpen(true); }} onHome=${() => setScreen('home')} onLab=${() => setScreen('lab')} />`;

  return html`<${React.Fragment}><${Scene} /><div class="app" dir="rtl" lang="ar">
    ${body}
    <${Signature} />
    ${albumOpen ? html`<${Album} items=${album} onClose=${() => setAlbumOpen(false)} onDelete=${(id) => setAlbum(a => a.filter(x => x.id !== id))} />` : null}
    ${burst ? html`<${StarBurst} text=${burst} onDone=${() => setBurst(null)} />` : null}
    ${moreOpen && sampleId ? html`<${MoreInfo} s=${SAMPLE_BY_ID[sampleId]} part=${part} onClose=${() => setMoreOpen(false)} />` : null}
    <${Toast} msg=${toast} />
  </div></${React.Fragment}>`;
}

document.documentElement.setAttribute('dir', 'rtl');
document.documentElement.setAttribute('lang', 'ar');
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
