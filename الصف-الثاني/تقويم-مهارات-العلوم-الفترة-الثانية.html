<title>تقويم مهارات العلوم ثاني</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: a pastel science notebook; a start card, then one question group per screen with a leaf progress bar, then a result card and review. */
:root{--bg:#F1F8F2;--card:#FFFFFF;--ink:#24402E;--soft:#5E7A66;--green:#4CAF6A;--dgreen:#2E7D4A;--mint:#E3F4E6;--sky:#DDEFFB;--blue:#3B8BD0;
  --pink:#F7DDE6;--gold:#F4B400;--ok:#2E9E5B;--okbg:#E2F5E8;--no:#D64545;--nobg:#FDE6E6;--line:#CFE3D4;
  --display:"Baloo Bhaijaan 2","Tajawal",Tahoma,sans-serif;--body:"Tajawal",Tahoma,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.6;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 30px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.head{background:linear-gradient(180deg,#D9F0DF,#fff);border:3px solid var(--line);border-radius:26px;padding:14px 18px;text-align:center}
.head h1{font-family:var(--display);font-size:clamp(26px,5vw,40px);margin:0;color:var(--dgreen);line-height:1.2}
.head p{margin:2px 0 0;font-weight:800;color:var(--soft)}
.chip{display:inline-block;background:var(--sky);color:#1F5E92;border-radius:99px;padding:2px 14px;font-weight:800;font-size:16px;margin-top:6px}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:18px}
.start label{display:block;font-weight:800;margin:8px 0 4px}
.start input{width:100%;font:inherit;font-size:20px;border:3px solid var(--line);border-radius:14px;padding:8px 12px}
.big{display:block;width:100%;margin-top:16px;border:0;border-radius:18px;background:var(--green);color:#fff;font-family:var(--display);font-size:26px;font-weight:800;padding:12px;box-shadow:0 5px 0 var(--dgreen)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--dgreen)}
.hint{color:var(--soft);font-weight:700;font-size:16px;margin:6px 0 0}
.prog{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#DCEBDD;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.prog b{font-family:var(--display);white-space:nowrap}
.qh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:24px;font-weight:800}
.qh h2{margin:0;font-family:var(--display);font-size:clamp(21px,4vw,27px);color:var(--dgreen);line-height:1.3;flex:1;min-width:0}
.mark{font-weight:800;color:#7B4FA0;font-size:16px;white-space:nowrap}
.item{border-top:2px dashed var(--line);padding:12px 0}
.item:first-of-type{border-top:0;padding-top:0}
.q{font-weight:800;margin:0 0 8px;font-size:20px}
.withimg{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:12px;align-items:center}
.withimg img{width:100%;border-radius:14px}
@media (max-width:560px){.withimg{grid-template-columns:1fr}.withimg img{max-width:220px;margin:0 auto;display:block}}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:8px;border:3px solid #CFE0EE;background:#fff;border-radius:16px;padding:8px 10px;min-height:56px;text-align:start;font-weight:700;font-size:18px}
.opt .l{flex:none;width:32px;height:32px;border-radius:10px;background:var(--sky);display:grid;place-items:center;font-weight:800;color:#1F5E92}
.opt.sel{border-color:var(--blue);background:#EAF4FD}.opt.sel .l{background:var(--blue);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--no);background:var(--nobg)}
/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mb{display:flex;align-items:center;justify-content:space-between;gap:8px;border:3px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-weight:800;font-size:20px;min-height:62px}
.mb img{height:46px;max-width:110px;object-fit:contain}
.mb.pick{border-color:var(--blue);background:#EAF4FD}
.mb .tag{min-width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px}
/* tf */
.tf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.tfb{display:flex;gap:8px}.tfb button{width:62px;height:52px;border-radius:14px;border:3px solid var(--line);background:#fff;font-size:26px;font-weight:800}
.tfb button.sel{border-color:var(--blue);background:#EAF4FD}.tfb .right{border-color:var(--ok);background:var(--okbg)}.tfb .wrong{border-color:var(--no);background:var(--nobg)}
/* fill */
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.bank span{background:var(--mint);border:2px solid #B9DDBF;border-radius:99px;padding:3px 16px;font-weight:800}
.fill{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fill .ch{border:2px solid #CFE0EE;border-radius:12px;background:#fff;padding:4px 12px;font-weight:800;font-size:17px}
.fill .ch.sel{border-color:var(--blue);background:#EAF4FD}.fill .ch.right{border-color:var(--ok);background:var(--okbg)}.fill .ch.wrong{border-color:var(--no);background:var(--nobg)}
.fimg{height:54px;border-radius:10px}
/* order */
.order{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.order{grid-template-columns:repeat(2,minmax(0,1fr))}}
.oc{border:3px solid var(--line);border-radius:16px;background:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:20px;position:relative}
.oc img{height:80px;max-width:100%;object-fit:contain}
.oc .n{position:absolute;top:-10px;right:-10px;width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:20px}
.small{border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px 14px;font-weight:800;font-size:16px;margin-top:10px}
/* numbers */
.nm{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
@media (max-width:620px){.nm,.match{grid-template-columns:1fr}}
.hab{display:flex;align-items:center;gap:10px;border:3px solid var(--line);border-radius:16px;padding:6px 10px;background:#fff;font-weight:800}
.hab img{width:120px;border-radius:10px}.hab .k{width:36px;height:36px;border-radius:10px;background:#F0F6D8;border:2px solid #B9C97A;display:grid;place-items:center;font-family:var(--display);font-size:20px;flex:none}
.desc{display:flex;align-items:center;gap:10px;border:3px solid var(--line);border-radius:16px;padding:8px 10px;background:#fff;font-weight:800}
.desc .circ{display:flex;gap:6px}.desc .circ button{width:44px;height:44px;border-radius:50%;border:3px solid #9BD3A8;background:#fff;font-family:var(--display);font-size:20px;font-weight:800}
.desc .circ button.sel{background:var(--green);color:#fff;border-color:var(--green)}.desc .circ .right{background:var(--ok);color:#fff}.desc .circ .wrong{background:var(--no);color:#fff;border-color:var(--no)}
.fix{display:none;margin-top:6px;background:var(--okbg);color:var(--ok);border-radius:10px;padding:2px 10px;font-weight:800;font-size:16px}
.review .fix{display:inline-block}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.nav button{border:0;border-radius:16px;padding:10px 20px;font-weight:800;font-size:20px;background:var(--sky);color:#1F5E92;min-width:120px}
.nav .fin{background:var(--gold);color:#4A3500}
.warn{color:var(--no);font-weight:800;text-align:center;min-height:24px}
.res{text-align:center}
.res .score{font-family:var(--display);font-size:64px;color:var(--dgreen);line-height:1}
.res .msg{font-family:var(--display);font-size:28px;color:#7B4FA0;margin:8px 0}
.sumrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.sumrow span{background:var(--mint);border-radius:12px;padding:4px 12px;font-weight:800}
.rbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rbtns button{border:0;border-radius:16px;padding:10px 20px;font-weight:800;font-size:19px;background:var(--sky);color:#1F5E92}
.foot{text-align:center;color:var(--soft);font-size:13px;font-weight:700}
.cert{margin-top:16px;background:#fff;border:4px solid var(--gold);border-radius:26px;padding:8px;box-shadow:0 10px 26px rgba(244,180,0,.22)}
.cert-in{border:3px dashed #9BD3A8;border-radius:20px;padding:16px 14px;text-align:center;background:radial-gradient(circle at 50% 0,#FFF8DD,#fff 65%);display:flex;flex-direction:column;gap:6px;align-items:center}
.cert-top{display:flex;justify-content:space-between;width:100%;font-size:14px;font-weight:800;color:var(--soft);flex-wrap:wrap;gap:4px}
.cert h3{font-family:var(--display);font-size:clamp(28px,6vw,42px);margin:4px 0 0;color:var(--dgreen);line-height:1.15}
.seal{width:84px;height:84px;border-radius:50%;background:var(--gold);border:5px double #fff;box-shadow:0 0 0 4px var(--gold);display:grid;place-content:center;color:#fff;font-weight:800;line-height:1.1}
.seal b{font-size:30px}
.cert .line{margin:0;font-weight:700;font-size:18px}
.cert .who{font-family:var(--display);font-size:clamp(28px,6vw,40px);font-weight:800;color:#C2185B;border-bottom:3px solid var(--gold);padding:0 22px;max-width:100%;overflow-wrap:anywhere}
.cert .stars{font-size:30px;letter-spacing:3px}
.cert-foot{display:flex;justify-content:space-between;width:100%;gap:10px;flex-wrap:wrap;margin-top:6px}
.cert-foot div{display:flex;flex-direction:column;border-top:2px solid #E9C46A;padding-top:4px;min-width:130px;font-weight:800}
.cert-foot small{color:var(--soft);font-weight:700}
.conf{position:fixed;pointer-events:none;z-index:9;font-size:26px;animation:fly 1.3s forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
