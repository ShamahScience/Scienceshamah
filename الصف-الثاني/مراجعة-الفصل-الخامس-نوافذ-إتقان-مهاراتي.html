html,body{height:100%}
body{margin:0;background:#EBDDE6;color:var(--ink);font-family:var(--body);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:4px solid var(--mauve-d);outline-offset:3px}
#stage{user-select:none;-webkit-user-select:none;position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:clip;border-radius:18px;
  box-shadow:0 20px 60px rgba(74,47,58,.25);background:var(--ivory)}
.screen{position:absolute;inset:0;overflow:clip}
.backdrop{position:absolute;inset:0;background-image:var(--cover);background-size:cover;background-position:center}
.backdrop.soft{filter:blur(7px) saturate(.9);transform:scale(1.06)}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,250,244,.55),rgba(255,250,244,.78))}

/* ---------- start ---------- */
#start .field{position:absolute;border:0;background:transparent;font-family:var(--display);font-weight:800;font-size:34px;color:#7B2E4C;text-align:center}
#start .field::placeholder{color:#B88A9C}
#day{left:66.2%;top:11.3%;width:11.6%;height:7.2%}
#date{left:39.8%;top:11.3%;width:12.2%;height:7.2%;font-size:30px}
.ribbon{position:absolute;left:41.6%;top:57.6%;width:34.8%;height:10.6%;border-radius:22px;
  background:linear-gradient(180deg,#F6C9D7,#EBA9BF);border:3px solid #fff;box-shadow:0 6px 0 #D88EA8,0 10px 24px rgba(199,111,142,.35);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:46px;color:#5C2140}
.bigbtn{position:absolute;left:35.5%;top:76%;width:29%;height:10.5%;border:4px solid #fff;border-radius:999px;
  background:linear-gradient(180deg,#A6D7A9,#6FB27A);color:#fff;font-family:var(--display);font-weight:800;font-size:44px;
  text-shadow:0 2px 0 rgba(0,0,0,.18);box-shadow:0 8px 0 #4F8A5B,0 16px 30px rgba(79,138,91,.4);transition:transform .15s}
.bigbtn:active{transform:translateY(5px);box-shadow:0 3px 0 #4F8A5B}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}

/* ---------- shared chrome ---------- */
.girl{position:absolute;left:-6px;bottom:0;width:230px;filter:drop-shadow(0 8px 14px rgba(74,47,58,.25));pointer-events:none}
.topbar{position:absolute;top:16px;left:20px;right:20px;height:74px;display:flex;align-items:center;gap:14px;flex-direction:row}
.wtitle{font-family:var(--display);font-weight:800;font-size:38px;color:#fff;background:linear-gradient(180deg,#D98BA7,#C76F8E);
  border:3px solid #fff;border-radius:22px;padding:4px 26px;box-shadow:0 5px 0 #A9566F;white-space:nowrap}
.rail{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.85);border:3px solid #fff;
  border-radius:999px;height:62px;padding:0 18px;box-shadow:0 4px 14px rgba(74,47,58,.12)}
.rail .s{width:40px;height:40px;display:grid;place-items:center;font-size:30px;line-height:1;filter:grayscale(1) opacity(.35);transition:filter .3s,transform .3s}
.rail .s.ok{filter:none;transform:scale(1.12)}
.rail .s.rv{filter:none}
.rail .s.rv::before{content:"🩷"}
.rail .s:not(.rv)::before{content:"⭐"}
.rail b{font-family:var(--display);font-size:28px;color:var(--mauve-d);margin-inline-start:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tool{height:62px;min-width:62px;padding:0 18px;border-radius:20px;border:3px solid #fff;background:var(--mauve-l);color:var(--mauve-d);
  font-family:var(--display);font-weight:800;font-size:26px;box-shadow:0 4px 0 #CDBFE3;white-space:nowrap}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 #CDBFE3}
.sign{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:24px;color:#6B3A4E;
  background:linear-gradient(180deg,#FFF8EC,#F3E2C8);border:3px solid #E7CFA9;border-radius:16px;padding:2px 26px;box-shadow:0 3px 0 #D9BD93;white-space:nowrap}

/* ---------- board of windows ---------- */
.board{position:absolute;left:250px;right:40px;top:120px;bottom:70px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px 30px;align-content:center}
.win{position:relative;height:330px;border:0;background:none;padding:0;perspective:900px}
.frame{position:absolute;inset:0;border-radius:150px 150px 22px 22px;background:linear-gradient(180deg,#E7C9A2,var(--wood));border:6px solid var(--wood-d);
  box-shadow:0 10px 0 #8F653D,0 18px 30px rgba(74,47,58,.25);overflow:hidden}
.pane{position:absolute;inset:14px 14px 70px;border-radius:130px 130px 10px 10px;background:linear-gradient(180deg,#CDE7F6,#EAF6E6);overflow:hidden;
  display:grid;place-items:center;font-size:96px}
.shut{position:absolute;top:14px;bottom:70px;width:calc(50% - 14px);transition:transform .7s cubic-bezier(.3,.7,.3,1);backface-visibility:hidden;
  background:repeating-linear-gradient(180deg,#F6D3DF 0 22px,#EDB9CB 22px 26px);border:4px solid #fff}
.shut.r{right:14px;border-radius:0 130px 0 0;transform-origin:right center}
.shut.l{left:14px;border-radius:130px 0 0 0;transform-origin:left center}
.win.open .shut.r{transform:rotateY(-108deg)}
.win.open .shut.l{transform:rotateY(108deg)}
.win .label{position:absolute;left:12px;right:12px;bottom:12px;height:50px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--display);font-weight:800;font-size:28px;color:var(--ink)}
.win .num{position:absolute;top:-6px;right:50%;transform:translateX(50%);width:52px;height:52px;border-radius:50%;background:var(--rose-d);color:#fff;border:4px solid #fff;
  display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;z-index:3}
.win .badge{position:absolute;top:8px;left:12px;z-index:3;font-size:46px;display:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.win.done .frame{background:linear-gradient(180deg,#CFE9CF,var(--sage));border-color:var(--sage-d);box-shadow:0 10px 0 #3F7149,0 18px 30px rgba(79,138,91,.3)}
.win.done .shut{background:repeating-linear-gradient(180deg,#DDF1DC 0 22px,#BFE0BF 22px 26px)}
.win.done .num{background:var(--sage-d)}
.win.done .badge{display:block}
.win .cnt{position:absolute;top:10px;right:14px;z-index:3;background:#fff;border-radius:999px;padding:0 12px;font-weight:800;font-size:20px;color:var(--rose-d);border:2px solid var(--rose)}

/* ---------- question window ---------- */
.panel{position:absolute;left:250px;right:36px;top:110px;bottom:70px;background:rgba(255,250,244,.94);border:4px solid #fff;border-radius:34px;
  box-shadow:0 14px 40px rgba(74,47,58,.16);padding:22px 30px;display:flex;flex-direction:column;gap:14px;animation:openwin .5s cubic-bezier(.2,.8,.3,1)}
@keyframes openwin{from{opacity:0;transform:perspective(1200px) rotateX(-8deg) scale(.96)}to{opacity:1;transform:none}}
.qhead{display:flex;align-items:center;gap:14px}
.qnum{flex:none;font-family:var(--display);font-weight:800;font-size:24px;color:#fff;background:var(--mauve-d);border-radius:999px;padding:2px 18px}
.page{flex:none;font-weight:800;font-size:20px;color:#8A5A00;background:#FFF1CF;border:2px solid #F0D592;border-radius:999px;padding:2px 14px}
.status{margin-inline-start:auto;flex:none;font-weight:800;font-size:22px;border-radius:999px;padding:4px 18px;border:3px solid}
.status.none{color:#8B7A1E;background:#FFF7D1;border-color:#F0DE8A}
.status.ok{color:var(--sage-d);background:var(--sage-l);border-color:var(--sage)}
.status.rv{color:var(--rose-d);background:var(--rose-l);border-color:var(--rose)}
.qtext{font-family:var(--book);font-weight:700;font-size:40px;line-height:1.7;margin:0;color:var(--ink)}
.qtext .tag{color:#C0392B}
.body{flex:1;min-height:0;display:flex;gap:24px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.fig{margin:0;background:#fff;border:4px solid #fff;border-radius:22px;box-shadow:0 6px 18px rgba(74,47,58,.14);overflow:hidden;position:relative}
.fig img{display:block;width:100%;height:100%;object-fit:cover;background:#fff}
.fig.contain img{object-fit:contain}
.fig figcaption{position:absolute;bottom:8px;right:8px;background:rgba(255,241,207,.95);border:2px solid #F0D592;color:#8A5A00;border-radius:999px;padding:0 12px;font-weight:800;font-size:17px}
.answer{background:var(--sage-l);border:4px solid var(--sage);border-radius:24px;padding:12px 22px;font-family:var(--book);font-weight:700;font-size:30px;line-height:1.7;color:#2F5E39;animation:pop .4s}
.answer b{font-family:var(--display);color:var(--sage-d)}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.03)}100%{transform:none;opacity:1}}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{height:66px;padding:0 26px;border-radius:22px;border:3px solid #fff;font-family:var(--display);font-weight:800;font-size:28px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.btn.reveal{background:var(--gold);color:#5A3B00;box-shadow:0 5px 0 var(--gold-d)}
.btn.nav{background:var(--mauve-l);color:var(--mauve-d);box-shadow:0 5px 0 #CDBFE3}
.btn.again{background:#fff;color:var(--rose-d);border-color:var(--rose)}
.btn.okb{background:var(--sage);color:#fff;box-shadow:0 5px 0 var(--sage-d)}
.btn.rvb{background:var(--rose);color:#fff;box-shadow:0 5px 0 var(--rose-d)}
.btn[disabled]{opacity:.35;pointer-events:none}
.spacer{flex:1}
.teacher{display:flex;gap:12px;align-items:center;background:#fff;border:3px dashed var(--mauve);border-radius:22px;padding:8px 14px;font-weight:800;font-size:22px;color:var(--mauve-d)}

/* vocab */
.wordbox{display:flex;flex-direction:column;gap:14px;align-items:stretch;background:#FFFBEA;border:4px solid #F0A04B;border-radius:22px;padding:16px;min-width:300px}
.wordbox h3{margin:0;text-align:center;font-family:var(--display);font-size:26px;color:#B76A12}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;background:#FFF176;border:3px solid #F2C14E;border-radius:18px;padding:6px 16px;text-align:center;
  font-family:var(--book);font-weight:700;font-size:34px;color:var(--ink);cursor:grab;box-shadow:0 4px 0 #E0B23A;position:relative;z-index:2}
.chip.sel{outline:4px solid var(--mauve-d)}
.chip.drag{z-index:50;box-shadow:0 14px 26px rgba(0,0,0,.25);cursor:grabbing}
.sent{font-family:var(--book);font-weight:700;font-size:36px;line-height:2;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.slot{min-width:260px;min-height:70px;border-bottom:4px dotted var(--rose-d);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;background:rgba(251,231,238,.6)}
.slot.hover{background:var(--mauve-l)}
.slot.ok{background:var(--sage-l);border-bottom-color:var(--sage-d)}
.slot.ok .chip{background:#CFEFCF;border-color:var(--sage);box-shadow:0 4px 0 var(--sage-d);cursor:default}
.slot.bad{animation:shake .4s;background:var(--rose-l)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* compare */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.vs .h{font-family:var(--display);font-weight:800;font-size:30px;text-align:center;border-radius:18px;padding:4px;color:#fff}

/* mcq */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{min-height:84px;border-radius:24px;border:4px solid var(--rose);background:#fff;font-family:var(--book);font-weight:700;font-size:36px;color:var(--ink);
  display:flex;align-items:center;gap:14px;padding:0 22px;text-align:start;box-shadow:0 5px 0 #F0C6D4}
.opt .l{flex:none;width:52px;height:52px;border-radius:50%;background:var(--rose-l);display:grid;place-items:center;font-family:var(--display);font-size:28px;color:var(--rose-d)}
.opt.right{background:var(--sage-l);border-color:var(--sage-d);box-shadow:0 5px 0 var(--sage)}
.opt.right .l{background:var(--sage-d);color:#fff}
.opt.wrong{background:var(--rose-l);animation:shake .4s}
.opt.wrong .l{background:var(--rose-d);color:#fff}
.opt.locked{pointer-events:none}

/* landforms grid */
.lfs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.lf{background:#fff;border:4px solid #fff;border-radius:22px;box-shadow:0 5px 14px rgba(74,47,58,.12);padding:6px;text-align:center}
.lf img{width:100%;display:block}
.lf b{display:block;font-family:var(--display);font-size:30px;color:#fff;border-radius:14px;margin-top:4px}
.lf p{margin:6px 0 0;font-family:var(--book);font-weight:700;font-size:24px;line-height:1.5;color:#2F5E39;background:var(--sage-l);border-radius:12px;padding:4px 6px;animation:pop .4s}

/* harvest */
.harvest{position:absolute;left:250px;right:36px;top:110px;bottom:70px;background:rgba(255,250,244,.95);border:4px solid #fff;border-radius:34px;
  box-shadow:0 14px 40px rgba(74,47,58,.16);padding:26px 34px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;animation:openwin .5s}
.harvest h2{margin:0;font-family:var(--display);font-size:56px;color:var(--rose-d);line-height:1.2}
.harvest .sub{margin:0;font-family:var(--book);font-weight:700;font-size:30px;color:var(--mauve-d)}
.hstars{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;width:100%}
.hs{border-radius:20px;padding:8px 4px;border:3px solid #E6DCE9;background:#FAF7FC}
.hs i{display:block;font-style:normal;font-size:52px;line-height:1.1}
.hs span{font-weight:800;font-size:18px;color:var(--ink-soft)}
.hs.ok{background:var(--sage-l);border-color:var(--sage)}
.hs.rv{background:var(--rose-l);border-color:var(--rose)}
.hs.none i{filter:grayscale(1) opacity(.3)}
.counts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.count{border-radius:22px;padding:8px 26px;font-weight:800;font-size:28px;border:3px solid}
.count.ok{color:var(--sage-d);background:var(--sage-l);border-color:var(--sage)}
.count.rv{color:var(--rose-d);background:var(--rose-l);border-color:var(--rose)}
.count.none{color:#8B7A1E;background:#FFF7D1;border-color:#F0DE8A}
.cheer{font-family:var(--display);font-weight:800;font-size:40px;color:var(--sage-d);background:var(--sage-l);border:4px solid var(--sage);border-radius:26px;padding:10px 30px;animation:pop .5s}
.confirm{display:flex;gap:10px;align-items:center;font-weight:800;font-size:24px;color:var(--rose-d)}

/* toast + sparkle */
.toast{position:absolute;left:50%;top:100px;transform:translate(-50%,-30px);opacity:0;transition:.3s;z-index:60;background:#fff;border:4px solid var(--rose);
  border-radius:999px;padding:10px 34px;font-family:var(--display);font-weight:800;font-size:34px;color:var(--rose-d);box-shadow:0 10px 30px rgba(0,0,0,.18);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{border-color:var(--sage);color:var(--sage-d)}
.spark{position:absolute;z-index:70;pointer-events:none;font-size:40px;animation:fly .9s forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- state (kept while moving between windows; also remembered on this device) ---- */
const KEY='nawafith-ch5-v1';
let S={st:Array(10).fill('none'),filled:[null,null,null],day:'',date:''};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&Array.isArray(r.st)&&r.st.length===10)S=Object.assign(S,r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---- stage scaling ---- */
let scale=1;
function fit(){scale=Math.min(innerWidth/1600,innerHeight/900);$('#stage').style.transform=`translate(-50%,-50%) scale(${scale})`}
addEventListener('resize',fit);fit();

/* ---- sound + feedback ---- */
let AC=null;
function tone(f,t,d,type='sine',g=.16){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain();
  o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,AC.currentTime+t);v.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(v).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d)}catch(e){}}
const sGood=()=>{tone(784,0,.18);tone(1047,.12,.32)}, sBad=()=>tone(240,0,.25,'triangle',.1), sOpen=()=>{tone(523,0,.12);tone(659,.08,.15)},
      sWin=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.35,'triangle',.14));
const GOOD=['أحسنتِ! أتقنتِ المهارة 🌟','رائعة يا عالمتي! ⭐','إجابة صحيحة 🌸'];
const BAD=['حاولي مرة أخرى يا عالمتي 💪','قريبة جدًّا! فكّري مرة ثانية 🌸','لا بأس، نتعلّم من أخطائنا 🌱'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
let tt;
function toast(m,good){const t=$('#toast');t.textContent=m;t.classList.toggle('good',!!good);t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1900)}
function spark(el){const st=$('#stage').getBoundingClientRect(),r=el.getBoundingClientRect();
  const x=(r.left+r.width/2-st.left)/scale,y=(r.top+r.height/2-st.top)/scale;
  for(let i=0;i<8;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'⭐':'🌸';s.style.left=x+'px';s.style.top=y+'px';
    s.style.setProperty('--dx',(Math.random()*240-120)+'px');s.style.setProperty('--dy',(-60-Math.random()*140)+'px');$('#stage').appendChild(s);setTimeout(()=>s.remove(),900)}}
function setSt(i,v,el){const was=S.st[i];if(v==='rv'&&was==='ok')return;S.st[i]=v;save();rail();
  if(v==='ok'&&was!=='ok'){sGood();toast(pick(GOOD),true);if(el)spark(el)}
  if(v==='rv'){sBad();toast(pick(BAD))}}

/* ---- progress rail ---- */
function rail(){const r=$('#rail');r.innerHTML='';S.st.forEach((v,i)=>{const s=document.createElement('span');s.className='s'+(v==='ok'?' ok':v==='rv'?' rv':'');s.title='السؤال '+AR(i+1);r.appendChild(s)});
  const b=document.createElement('b');b.textContent=AR(S.st.filter(v=>v==='ok').length)+' / ١٠';r.appendChild(b)}

/* ---- navigation ---- */
function showInner(){$('#start').hidden=true;$('#inner').hidden=false}
$('#go').onclick=()=>{sOpen();showInner();board()};
$('#toBoard').onclick=()=>board();
$('#fs').onclick=()=>{const d=document;try{(d.fullscreenElement?d.exitFullscreen():d.documentElement.requestFullscreen()).catch(()=>{})}catch(e){}};
['day','date'].forEach(k=>{const el=$('#'+k);el.value=S[k]||'';el.oninput=()=>{S[k]=el.value;save()}});

function winDone(w){return w===5?S.st.every(v=>v==='ok'):WINS[w].qs.every(q=>S.st[q]==='ok')}
function board(){
  cur.win=-1;$('#wtitle').textContent='نوافذ إتقان مهاراتي';rail();
  const v=$('#view');v.innerHTML='<div class="board" id="board"></div>';
  WINS.forEach((w,i)=>{const b=document.createElement('button');b.type='button';b.className='win'+(winDone(i)?' done':'');
    const okc=w.qs.filter(q=>S.st[q]==='ok').length;
    b.innerHTML=`<div class="frame"><div class="pane">${w.icon}</div><div class="shut r"></div><div class="shut l"></div>
      <div class="label">${w.name}</div></div><div class="num">${AR(i+1)}</div><div class="badge">⭐</div>
      ${w.qs.length&&!winDone(i)&&okc?`<div class="cnt">${AR(okc)} / ${AR(w.qs.length)}</div>`:''}`;
    b.setAttribute('aria-label','النافذة '+AR(i+1)+': '+w.name);
    b.onclick=()=>{sOpen();b.classList.add('open');setTimeout(()=>openWin(i,0),650)};
    $('#board').appendChild(b)});
}
function openWin(w,step){cur={win:w,step:step,revealed:false};$('#wtitle').textContent=WINS[w].icon+' '+WINS[w].name;rail();
  [vocab,model,compare,describe,mcq,harvest][w](step)}

function shell(qLabel,page,qi){
  const v=$('#view');v.innerHTML=`<div class="panel" id="panel"><div class="qhead"><span class="qnum">${qLabel}</span><span class="page">${page}</span>
    ${qi!=null?`<span class="status" id="stat"></span>`:''}</div></div>`;
  if(qi!=null)paintStat(qi);return $('#panel')}
function paintStat(qi){const e=$('#stat');if(!e)return;const v=S.st[qi];e.className='status '+v;
  e.textContent=v==='ok'?'🟢 أتقنت المهارة':v==='rv'?'🩷 أحتاج إلى مراجعة':'🟡 لم أبدأ بعد'}
function controls(p,opt){const c=document.createElement('div');c.className='controls';
  const w=WINS[cur.win],n=opt.steps||1;
  c.innerHTML=`${opt.reveal?`<button class="btn reveal" type="button" id="rev">${opt.reveal}</button>`:''}
    ${opt.check?`<button class="btn okb" type="button" id="chk">✔ تحقّقي من الإجابات</button>`:''}
    <button class="btn again" type="button" id="again">↺ أعيد السؤال</button><span class="spacer"></span>
    <button class="btn nav" type="button" id="prev" ${cur.step<=0?'disabled':''}>→ السابق</button>
    <button class="btn nav" type="button" id="next">${cur.step>=n-1?'🪟 النوافذ':'التالي ←'}</button>`;
  p.appendChild(c);
  $('#prev').onclick=()=>openWin(cur.win,cur.step-1);
  $('#next').onclick=()=>cur.step>=n-1?board():openWin(cur.win,cur.step+1);
  return c}
function teacherMark(p,qi){const t=document.createElement('div');t.className='teacher';
  t.innerHTML=`<span>تقييم المعلمة بعد سماع الإجابة:</span><button class="btn okb" type="button">🟢 أتقنت المهارة</button><button class="btn rvb" type="button">🩷 تحتاج إلى مراجعة</button>`;
  const [ok,rv]=t.querySelectorAll('button');
  ok.onclick=()=>{setSt(qi,'ok',ok);paintStat(qi)};
  rv.onclick=()=>{S.st[qi]='rv';save();rail();paintStat(qi);toast('نراجعها معًا مرة أخرى 🌱')};
  return t}

function vocab(){
  const p=shell('أسئلة المفردات ١–٣','صفحة ١٣٢',null);

  VOC.forEach((q,i)=>{const d=document.createElement('div');d.className='sent';
    d.innerHTML=`<span>${q.pre}</span><span class="slot" data-i="${i}"></span>`;
    $('#sents').appendChild(d)});
  const chips={};
  WORDS.forEach(w=>{const c=document.createElement('div');c.className='chip';c.textContent=w;c.dataset.w=w;chips[w]=c;$('#bank').appendChild(c);makeDrag(c)});
  S.filled.forEach((w,i)=>{if(w&&chips[w]){const sl=document.querySelector(`.slot[data-i="${i}"]`);sl.appendChild(chips[w]);if(S.st[i]==='ok')sl.classList.add('ok')}});
  const paintV=()=>{};
  paintV();
  const c=controls(p,{reveal:'💡 كشف الإجابة',check:true});
  $('#chk').onclick=()=>{let any=false;document.querySelectorAll('.slot').forEach(sl=>{const i=+sl.dataset.i,ch=sl.querySelector('.chip');if(!ch||sl.classList.contains('ok'))return;any=true;
      if(ch.dataset.w===VOC[i].ans){sl.classList.add('ok');setSt(i,'ok',sl)}
      else{sl.classList.remove('bad');void sl.offsetWidth;sl.classList.add('bad');$('#bank').appendChild(ch);S.filled[i]=null;setSt(i,'rv')}});
    save();paintV();if(!any)toast('اسحبي عبارة إلى الفراغ أولًا 🌸')};
  $('#rev').onclick=()=>{if($('#vans'))return;const a=document.createElement('div');a.className='answer';a.id='vans';
    a.innerHTML=VOC.map((q,i)=>`<b>${AR(i+1)}</b> ${q.ans.replace(/^/, '')}`).join(' &nbsp;·&nbsp; ');p.insertBefore(a,c)};
  $('#again').onclick=()=>{[0,1,2].forEach(i=>S.st[i]='none');S.filled=[null,null,null];save();openWin(0,0)};
  let sel=null;
  function place(ch,sl){const i=+sl.dataset.i;if(sl.classList.contains('ok'))return false;const old=sl.querySelector('.chip');if(old&&old!==ch)$('#bank').appendChild(old);
    S.filled=S.filled.map(w=>w===ch.dataset.w?null:w);sl.appendChild(ch);S.filled[i]=ch.dataset.w;save();sOpen();return true}
  const slotAt=e=>{for(const el of document.elementsFromPoint(e.clientX,e.clientY)){const s=el.closest&&el.closest('.slot');if(s)return s}return null};
  function makeDrag(ch){let sx,sy,moved=false,id=null;
    ch.addEventListener('pointerdown',e=>{if(ch.parentElement.classList.contains('ok'))return;e.preventDefault();id=e.pointerId;sx=e.clientX;sy=e.clientY;moved=false;ch.setPointerCapture(id)});
    ch.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;const dx=(e.clientX-sx)/scale,dy=(e.clientY-sy)/scale;
      if(!moved&&Math.hypot(dx,dy)>8){moved=true;ch.classList.add('drag')}
      if(moved){ch.style.transform=`translate(${dx}px,${dy}px)`;document.querySelectorAll('.slot').forEach(s=>s.classList.remove('hover'));
        const sl=slotAt(e);if(sl)sl.classList.add('hover')}});
    const end=e=>{if(e.pointerId!==id)return;id=null;ch.classList.remove('drag');ch.style.transform='';document.querySelectorAll('.slot').forEach(s=>s.classList.remove('hover'));
      if(moved){const sl=slotAt(e);if(sl)place(ch,sl);sel&&sel.classList.remove('sel');sel=null}
      else{sel&&sel.classList.remove('sel');sel=sel===ch?null:ch;sel&&sel.classList.add('sel')}};
    ch.addEventListener('pointerup',end);ch.addEventListener('pointercancel',end)}
  document.querySelectorAll('.slot').forEach(sl=>sl.addEventListener('click',()=>{if(sel){place(sel,sl);sel.classList.remove('sel');sel=null}}));
}

  const c=controls(p,{reveal:'💡 كشف الإجابة النموذجية'});

  $('#again').onclick=()=>{S.st[qi]='none';save();openWin(1,0)}}

/* ---- window 4: describe (Q6 then Q7, one at a time) ---- */
function describe(step){
  if(step===0){const qi=5;const p=shell('السؤال ٦','صفحة ١٣٣',qi);
    const LF=[['m_mountain','الْجَبَلُ','#A97B4F','منطقة مرتفعة جدًّا من اليابسة.'],['m_hill','التَّلُّ','#7CB342','منطقة مرتفعة، أقل ارتفاعًا من الجبل.'],
              ['m_plain','السَّهْلُ','#4F8A5B','أرض منبسطة واسعة.'],['m_valley','الْوَادِي','#16A085','أرض منخفضة بين الجبال أو التلال.']];
    p.insertAdjacentHTML('beforeend',`<p class="qtext"><span class="tag">٦-</span> أَصِفُ الأَشْكَالَ الْمُخْتَلِفَةَ لِلْيَابِسَةِ.</p>
      <div class="lfs">${LF.map(l=>`<div class="lf"><img src="${IMG[l[0]]}" alt=""><b style="background:${l[2]}">${l[1]}</b><p hidden>${l[3]}</p></div>`).join('')}</div>`);
    const c=controls(p,{reveal:'💡 كشف الإجابة النموذجية',steps:2});
    $('#rev').onclick=()=>{if(cur.revealed)return;cur.revealed=true;p.querySelectorAll('.lf p').forEach(x=>x.hidden=false);p.insertBefore(teacherMark(p,qi),c)};
    $('#again').onclick=()=>{S.st[qi]='none';save();openWin(3,0)};
  }else{const qi=6;const p=shell('السؤال ٧ – الفكرة العامة','صفحة ١٣٣',qi);
    p.insertAdjacentHTML('beforeend',`<p class="qtext"><span class="tag">٧-</span> كَيْفَ أَصِفُ الْيَابِسَةَ وَالْمَاءَ عَلَى سَطْحِ الْأَرْضِ؟</p>
      <div class="body"><figure class="fig" style="flex:1.7"><img src="${IMG.land}" alt="جبل وتلال وسهل وبحيرة"><figcaption>من كتابي – ص١٣٢</figcaption></figure>
      <div class="col" style="flex:1"><figure class="fig" style="flex:1"><img src="${IMG.earth}" alt="الأرض من الفضاء"><figcaption>الأرض من الفضاء</figcaption></figure>
      <figure class="fig" style="flex:1"><img src="${IMG.fresh}" alt="نهر"><figcaption>ماء عذب</figcaption></figure></div></div>`);
    const c=controls(p,{reveal:'💡 كشف الإجابة النموذجية',steps:2});
    $('#rev').onclick=()=>{if(cur.revealed)return;cur.revealed=true;const a=document.createElement('div');a.className='answer';a.style.fontSize='26px';
      a.innerHTML='<b>🏔️ اليابسة:</b> لها أشكال مختلفة: جبال وتلال مرتفعة، وسهول منبسطة، ووديان منخفضة.<br><b>💧 الماء:</b> يغطي معظم سطح الأرض؛ منه العذب في الأنهار والبحيرات والجداول والجليد، ومنه المالح في البحار والمحيطات.';
      p.insertBefore(a,c);p.insertBefore(teacherMark(p,qi),c)};
    $('#again').onclick=()=>{S.st[qi]='none';save();openWin(3,1)}}}

/* ---- window 5: test model, one question per screen ---- */
function mcq(step){const m=MCQ[step],qi=7+step;const p=shell('نموذج اختبار – السؤال '+AR(step+1)+' من ٣','صفحة ١٣٥',qi);
  p.insertAdjacentHTML('beforeend',`<p class="qtext" style="font-size:24px;color:#7A6170;margin:0">أَخْتَارُ الإِجَابَةَ الصَّحِيحَةَ:</p><p class="qtext" style="font-size:36px">${m.q}</p>
    <div class="body"><figure class="fig${m.img==='diagram'?' contain':''}" style="flex:.9"><img src="${IMG[m.img]}" alt=""><figcaption>${m.cap}</figcaption></figure>
    <div class="col" style="flex:1.4;justify-content:center"><div class="opts" id="opts"></div></div></div>`);
  const order=['أ','ج','ب','د'];
  order.forEach(L=>{const o=m.o.find(x=>x[0]===L);const b=document.createElement('button');b.type='button';b.className='opt';
    b.innerHTML=`<span class="l">${L}</span><span>${o[1]}</span>`;
    b.onclick=()=>{if(L===m.ok){b.classList.add('right');p.querySelectorAll('.opt').forEach(x=>x.classList.add('locked'));setSt(qi,'ok',b);paintStat(qi)}
      else{b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');setSt(qi,'rv');paintStat(qi)}};
    $('#opts').appendChild(b);
    if(S.st[qi]==='ok'&&L===m.ok){b.classList.add('right')}});
  if(S.st[qi]==='ok')p.querySelectorAll('.opt').forEach(x=>x.classList.add('locked'));
  const c=controls(p,{reveal:'💡 كشف الإجابة',steps:3});
  $('#rev').onclick=()=>{if(cur.revealed)return;cur.revealed=true;const a=document.createElement('div');a.className='answer';
    const o=m.o.find(x=>x[0]===m.ok);a.innerHTML=`<b>الإجابة الصحيحة:</b> ${m.ok}. ${o[1]}`;p.insertBefore(a,c)};
  $('#again').onclick=()=>{S.st[qi]='none';save();openWin(4,step)}}

/* ---- window 6: harvest ---- */
let confirmReset=false;
function harvest(){$('#wtitle').textContent='🌟 حصاد الإتقان';
  const ok=S.st.filter(v=>v==='ok').length,rv=S.st.filter(v=>v==='rv').length,no=10-ok-rv;
  const v=$('#view');v.innerHTML=`<div class="harvest"><h2>🌟 حصاد إتقان عالماتي الصغيرات</h2><p class="sub">أتذكر معلوماتي، وأفكر، وأطبق، وأتقن مهاراتي</p>
    <div class="hstars">${S.st.map((s,i)=>`<div class="hs ${s}"><i>${s==='rv'?'🩷':'⭐'}</i><span>س${AR(i+1)}</span></div>`).join('')}</div>
    <div class="counts"><span class="count ok">🟢 أتقنتُ: ${AR(ok)} من ١٠</span><span class="count rv">🩷 أحتاج إلى مراجعة: ${AR(rv)}</span><span class="count none">🟡 لم أبدأ بعد: ${AR(no)}</span></div>
    <div id="hmsg"></div><div class="controls" id="hctl" style="justify-content:center"></div></div>`;
  const ctl=$('#hctl');
  if(ok===10){$('#hmsg').innerHTML='<div class="cheer">رائعة يا عالمتي الصغيرة! لقد أتقنتِ مهارات الفصل الخامس 🏅</div>';sWin();setTimeout(()=>spark($('#hmsg')),200)}
  else{const b=document.createElement('button');b.type='button';b.className='btn reveal';b.textContent='🔁 أراجع مهاراتي من جديد';
    b.onclick=()=>{const q=S.st.findIndex(x=>x!=='ok');const w=WINS.findIndex(w=>w.qs.includes(q));openWin(w,Math.max(0,WINS[w].qs.indexOf(q))*(w===0?0:1))};ctl.appendChild(b)}
  const r=document.createElement('button');r.type='button';r.className='btn again';r.textContent='↺ إعادة المراجعة كاملة';ctl.appendChild(r);
  r.onclick=()=>{const c=document.createElement('span');c.className='confirm';c.innerHTML='هل تبدئين من جديد؟ <button class="btn rvb" type="button">نعم</button><button class="btn nav" type="button">لا</button>';
    r.replaceWith(c);const [y,n]=c.querySelectorAll('button');
    y.onclick=()=>{S.st=Array(10).fill('none');S.filled=[null,null,null];save();rail();board()};n.onclick=()=>harvest()};
  const bb=document.createElement('button');bb.type='button';bb.className='btn nav';bb.textContent='🪟 لوحة النوافذ';bb.onclick=board;ctl.appendChild(bb)}

rail();
