<style>
/* Layout: teacher console — a welcome band and five task cards; activities run full-screen on the classroom board */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --ink:#123033; --muted:#5b6f6f; --line:#d8e2df; --soft:#e9f1ef;
  --accent:#e2a22b; --accent-ink:#3a2600; --teal:#14666b; --teal-ink:#ffffff; --coral:#e0634f; --ok:#1f8a5b; --bad:#c8463a;
  --band1:#0f4f53; --band2:#14666b; --band-ink:#ffffff;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --script:"Aref Ruqaa","Reem Kufi",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1f21; --surface:#142c2f; --ink:#eaf3f1; --muted:#9db3b1; --line:#24423f; --soft:#1a3639;
  --accent:#f0b443; --accent-ink:#2b1c00; --teal:#3fb3b0; --teal-ink:#06292a; --coral:#f07a66; --ok:#4cc38a; --bad:#f07a66;
  --band1:#0b3a3d; --band2:#12585c; --band-ink:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1f21; --surface:#142c2f; --ink:#eaf3f1; --muted:#9db3b1; --line:#24423f; --soft:#1a3639;
  --accent:#f0b443; --accent-ink:#2b1c00; --teal:#3fb3b0; --teal-ink:#06292a; --coral:#f07a66; --ok:#4cc38a; --bad:#f07a66;
  --band1:#0b3a3d; --band2:#12585c; --band-ink:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);direction:rtl;font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4.5vw,42px)} h2{font-size:clamp(20px,3vw,26px)} h3{font-size:19px}
.muted{color:var(--muted)} .small{font-size:14px}
p{margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{border-radius:14px;padding:10px 18px;font-weight:700;background:var(--surface);color:var(--ink);border:2px solid var(--line);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--teal)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.teal{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.btn.danger{color:var(--bad)}
.btn.big{font-family:var(--display);font-size:22px;padding:12px 28px}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);min-width:0}
input[type=text],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;color:var(--ink)}
textarea{resize:vertical;line-height:1.7}
.check{display:inline-flex;align-items:center;gap:8px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--teal)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;background:var(--soft);color:var(--muted)}
.msg{min-height:1.4em;font-weight:700;color:var(--ok)}
.msg.err{color:var(--bad)}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:80;font-weight:700;max-width:90vw}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,20,22,.7);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:20px;padding:22px;width:min(780px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--teal);animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;font-family:var(--display);font-size:24px;flex:none}
.welcome{background:linear-gradient(135deg,var(--band1),var(--band2));color:var(--band-ink);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.welcome h1{color:var(--band-ink)} .welcome h1 span{color:#ffd77a}
.welcome p{opacity:.92}
.welcome::after{content:"";position:absolute;inset:auto -60px -90px auto;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.14);border-radius:12px;padding:6px 12px;font-size:14px}
.stat b{font-family:var(--display);font-size:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.card .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--soft)}
.card p{color:var(--muted);font-size:14px;flex:1}
.back{align-self:flex-start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.q-edit{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.opt-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center}
.opt-row input[type=radio]{width:22px;height:22px;accent-color:var(--ok)}
.opt-row .lt{font-family:var(--display);width:24px;text-align:center}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center}
.act-card{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.bank-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px;border-radius:12px;border:1px solid var(--line)}
.bank-item input{width:20px;height:20px;margin-top:4px;accent-color:var(--teal)}
.bank-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto}
.ranks{display:flex;flex-direction:column;gap:6px}
.rank{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--soft)}
.rank .pos{font-family:var(--display);font-weight:700;text-align:center}
.rank .pts{font-family:var(--display);font-size:20px;color:var(--teal);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--soft);border-radius:14px;padding:12px}
.kpi b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start}
th{color:var(--muted);font-weight:500;font-size:13px}
/* board */
.board{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:flex;flex-direction:column;
  padding:max(18px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.board-in{max-width:1180px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px;flex:1}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.progress{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--teal);transition:width .3s}
.bq{font-size:clamp(26px,3.6vw,46px);font-weight:700;line-height:1.55;text-wrap:pretty}
.bans{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.bans{grid-template-columns:1fr}}
.ans{display:flex;align-items:center;gap:14px;text-align:start;border:3px solid var(--line);background:var(--surface);border-radius:18px;padding:16px 18px;font-size:clamp(20px,2.6vw,32px);font-weight:700;min-height:80px}
.ans b{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:var(--teal-ink);font-family:var(--display)}
.ans:hover:not(:disabled){border-color:var(--teal)}
.ans.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))} .ans.right b{background:var(--ok)}
.ans.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))} .ans.wrong b{background:var(--bad)}
.ans:disabled{cursor:default}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.who .name{font-family:var(--script);font-size:clamp(28px,4vw,46px);color:var(--teal);line-height:1.3}
.timer{position:relative;width:84px;height:84px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.verdict{font-family:var(--display);font-size:clamp(24px,3vw,34px);text-align:center;min-height:1.3em}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
#certImg{width:auto;max-height:58vh;max-width:100%;border-radius:10px;border:1px solid var(--line);align-self:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}.progress i{transition:none}}
</style>

<script>

    if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if(k === 'class') el.className = v;

}

const cc = document.getElementById('confetti'), cx = cc.getContext('2d'); let parts = [], confRun = false;
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cc.width = innerWidth; cc.height = innerHeight;
  for(let i=0;i<180;i++) parts.push({x:innerWidth/2+(rand()-.5)*240, y:innerHeight*.4, vx:(rand()-.5)*16, vy:-rand()*16-4, s:6+rand()*8, r:rand()*6, vr:(rand()-.5)*.3, c:COLORS[i%6], life:0});
  if(!confRun){ confRun = true; requestAnimationFrame(stepConf) }
}
function stepConf(){
  cx.clearRect(0,0,cc.width,cc.height);
  parts.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore() });
  parts = parts.filter(p => p.y < cc.height + 40 && p.life < 400);
  if(parts.length) requestAnimationFrame(stepConf); else { confRun = false; cx.clearRect(0,0,cc.width,cc.height) }
}

function bankAll(){
  const seen = new Set(NAFS.map(q => norm(q.t))), out = NAFS.slice();
  activitiesList().forEach(a => (a.questions||[]).forEach(q => { if(q.topic && q.skill && q.o && q.o.length > 2 && !seen.has(norm(q.t))){ seen.add(norm(q.t)); out.push({topic:q.topic, skill:q.skill, t:q.t, o:q.o, a:q.a, lesson:a.title}) } }));
  return out;
}

function simBtn(url, label, cls, before){
  if(/^https:\/\//.test(url)) return h('a',{class:cls,style:'align-self:flex-start',href:url,target:'_blank',rel:'noopener'},label);
  return h('button',{class:cls,style:'align-self:flex-start',onclick:() => { if(before) before(); openSim(url) }},label);
}
async function loadSim(url){
  const m = /^sims\/([\w-]+)\.html$/.exec(url);
  if(m && db){ try{ const d = await db.doc('sims/'+m[1]).get(); const x = d.exists ? d.data() : null; if(x && x.html) return x.html }catch(e){} }
  for(const u of [url, '/'+url]){ try{ const r = await fetch(u); if(r.ok){ const t = await r.text(); if(/<html|<title/i.test(t)) return t } }catch(e){} }
  throw new Error('sim');
}
function openVideo(url){
  const v = h('video',{src:url,controls:true,playsinline:true,preload:'metadata',poster:window.claude ? '/_blob/dc3a51ef8a03fa7023a3339604f64258' : 'sims/respiratory.jpg',style:'flex:1;width:100%;min-height:0;border-radius:14px;background:#000;object-fit:contain'});

    h('div',{class:'row between'}, h('b',{},'🎬 الفيديو'), h('button',{class:'btn sm',onclick:() => { v.pause(); wrap.remove() }},'✕ إغلاق')), v);
  const note = h('p',{class:'small muted',style:'text-align:center'},'جارٍ تجهيز الفيديو…');
  wrap.append(note);
  document.body.append(wrap);

    for(const u of [url, location.origin + url]){
      try{ const r = await fetch(u); if(r.ok){ const b = await r.blob(); v.src = URL.createObjectURL(new Blob([b],{type:'video/mp4'})); note.textContent = ''; return } }catch(e){}
    }

  (async () => { try{ const a = window.claude ? await claude.use('assets') : null; if(!a) return; const res = await a.list(); const hit = (res.assets||[]).find(x => x.id === id); if(hit && hit.url && hit.url !== url){ v.src = hit.url } }catch(e){} })();
}

let boardEl = null, tHandle = null;
function runBoard(a, cls){
  audio();
  const sid = uid();
  const session = { activity:a.id, title:a.title, cls, date:Date.now(), total:a.questions.length, records:[] };
  const asked = new Set();
  let qi = 0, student = null, answered = false;
  boardEl = h('div',{class:'board',role:'dialog','aria-label':'وضع السبورة'}); document.body.append(boardEl);
  const close = () => { clearInterval(tHandle); boardEl.remove(); boardEl = null; document.removeEventListener('keydown', onKey) };
  const onKey = e => { if(e.key === 'Escape') { close(); results() } };
  document.addEventListener('keydown', onKey);
  const pickStudent = nameBox => {
    const list = DATA.students[cls] || [];
    if(!list.length){ toast('أضيفي أسماء '+className(cls)+' من الإعدادات'); return }
    let pool = list.filter(n => !asked.has(n)); if(!pool.length){ asked.clear(); pool = list.slice() }
    const pick = pool[Math.floor(rand()*pool.length)];
    let n = 0; const steps = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 18;
    const spin = () => {
      n++; nameBox.textContent = n < steps ? list[Math.floor(rand()*list.length)] : pick; tick();
      if(n < steps) setTimeout(spin, 40 + n*9); else { student = pick; asked.add(pick); fanfare() }
    };
    spin();
  };
  const render = () => {
    clearInterval(tHandle); answered = false; student = null;
    const q = a.questions[qi];
    const nameBox = h('span',{class:'name'},'—');
    const timerTxt = h('span',{}), arc = h('circle',{});

      h('div',{class:'bhead'},
        h('div',{}, h('h2',{},a.title), h('div',{class:'muted'}, `${className(cls)} · سؤال ${qi+1} من ${a.questions.length}`)),

      h('p',{class:'bq'}, q.t), answers, verdict,

}

// ---------------- settings ----------------
function settings(){
  const editors = PLATFORM.classes.map(c => {
    const ta = h('textarea',{rows:14,id:'n-'+c.id,placeholder:'اسم واحد في كل سطر'}); ta.value = (DATA.students[c.id]||[]).join('\n');
    const note = h('p',{class:'msg'}), cnt = h('span',{class:'pill'}, (DATA.students[c.id]||[]).length+' طالبة');
    const btn = h('button',{class:'btn teal',onclick:async () => {
      const others = new Set(PLATFORM.classes.filter(x => x.id !== c.id).flatMap(x => (DATA.students[x.id]||[]).map(norm)));
      const seen = new Set(), kept = [], dropped = [];
      ta.value.split('\n').map(s => s.trim()).filter(Boolean).forEach(n => { const k = norm(n); if(seen.has(k) || others.has(k)) dropped.push(n); else { seen.add(k); kept.push(n) } });
      const st = Object.assign({}, DATA.students, {[c.id]: kept}); await save('settings/students', st);
      ta.value = kept.join('\n'); cnt.textContent = kept.length + ' طالبة';
      note.className = dropped.length ? 'msg err' : 'msg'; note.textContent = dropped.length ? `تم الحفظ. حُذف المكرر: ${dropped.join('، ')}` : `تم حفظ ${kept.length} اسم ✅`;

// ---------------- certificate ----------------
const CW = 2000, CH = 1414; let fontsReady = null;
function loadFonts(){
  if(!fontsReady) fontsReady = Promise.all(['700 80px "Aref Ruqaa"','700 80px "Reem Kufi"','500 40px "IBM Plex Sans Arabic"','700 40px "IBM Plex Sans Arabic"']
    .map(f => document.fonts.load(f, 'شهادة تميز'))).catch(() => {});
  return fontsReady;
}
function star(g, x, y, r1, r2, pts){ g.beginPath(); for(let i=0;i<pts*2;i++){ const r = i%2 ? r2 : r1, a = -Math.PI/2 + i*Math.PI/pts; g.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r) } g.closePath() }
async function renderCert(w){
  await loadFonts();
  const c = document.createElement('canvas'); c.width = CW; c.height = CH; const g = c.getContext('2d');
  const TEAL = '#14666b', GOLD = '#c8901f', INK = '#123033', F = '"IBM Plex Sans Arabic", Tahoma, sans-serif';
  g.fillStyle = '#fffdf8'; g.fillRect(0,0,CW,CH);
  const grd = g.createRadialGradient(CW/2, CH/2, 200, CW/2, CH/2, 1200); grd.addColorStop(0,'rgba(255,255,255,0)'); grd.addColorStop(1,'rgba(20,102,107,.08)');
  g.fillStyle = grd; g.fillRect(0,0,CW,CH);
  g.strokeStyle = TEAL; g.lineWidth = 26; g.strokeRect(40,40,CW-80,CH-80);
  g.strokeStyle = GOLD; g.lineWidth = 5; g.strokeRect(80,80,CW-160,CH-160); g.lineWidth = 2; g.strokeRect(96,96,CW-192,CH-192);
  g.fillStyle = GOLD;
  for(let x=150; x<=CW-150; x+=70){ star(g,x,62,10,4.5,8); g.fill(); star(g,x,CH-62,10,4.5,8); g.fill() }
  for(let y=150; y<=CH-150; y+=70){ star(g,62,y,10,4.5,8); g.fill(); star(g,CW-62,y,10,4.5,8); g.fill() }
  [[96,96],[CW-96,96],[96,CH-96],[CW-96,CH-96]].forEach(([x,y]) => { g.fillStyle=TEAL; star(g,x,y,46,24,8); g.fill(); g.fillStyle=GOLD; star(g,x,y,24,12,8); g.fill() });
  g.direction = 'rtl'; g.textAlign = 'center';
  g.fillStyle = TEAL; g.font = `500 40px ${F}`; g.fillText(`${PLATFORM.school} · مادة العلوم · ${clsName(w.cls)}`, CW/2, 215);
  g.fillStyle = GOLD; g.font = '700 150px "Reem Kufi", Tahoma, sans-serif'; g.fillText('شهادة تميّز', CW/2, 390);
  g.strokeStyle = GOLD; g.lineWidth = 4; g.beginPath(); g.moveTo(CW/2-360,440); g.lineTo(CW/2-40,440); g.moveTo(CW/2+40,440); g.lineTo(CW/2+360,440); g.stroke();
  g.fillStyle = TEAL; star(g, CW/2, 440, 22, 10, 8); g.fill();
  g.fillStyle = INK; g.font = `500 50px ${F}`; g.fillText('يسرّني أن أقدّم هذه الشهادة للطالبة المتميزة', CW/2, 560);
  let fs = 150; g.font = `700 ${fs}px "Aref Ruqaa", serif`;
  while(g.measureText(w.name).width > CW-520 && fs > 70){ fs -= 6; g.font = `700 ${fs}px "Aref Ruqaa", serif` }
  g.fillStyle = TEAL; g.fillText(w.name, CW/2, 745);
  const nw = Math.min(CW-480, g.measureText(w.name).width + 160);
  g.strokeStyle = GOLD; g.lineWidth = 3; g.beginPath(); g.moveTo(CW/2-nw/2, 790); g.lineTo(CW/2+nw/2, 790); g.stroke();
  g.fillStyle = INK; g.font = `500 50px ${F}`;
  let line = 'تقديرًا لـ' + w.reason; if(/^[لب]/.test(w.reason)) line = 'تقديرًا ' + w.reason;
  let rs = 50; while(g.measureText(line).width > CW-460 && rs > 34){ rs -= 2; g.font = `500 ${rs}px ${F}` }
  g.fillText(line, CW/2, 900);
  g.font = `500 50px ${F}`; g.fillText('متمنيةً لها دوام التفوّق والنجاح', CW/2, 985);
  const sx = CW/2, sy = 1170;
  g.fillStyle = GOLD; star(g, sx, sy, 120, 100, 24); g.fill();
  g.fillStyle = TEAL; g.beginPath(); g.arc(sx, sy, 88, 0, Math.PI*2); g.fill();
  g.strokeStyle = '#f6d58a'; g.lineWidth = 3; g.beginPath(); g.arc(sx, sy, 76, 0, Math.PI*2); g.stroke();
  g.fillStyle = '#f6d58a'; star(g, sx, sy-22, 26, 11, 5); g.fill();
  g.fillStyle = '#fff'; g.font = '700 36px "Reem Kufi", Tahoma, sans-serif'; g.fillText('متميزة', sx, sy+40);
  g.fillStyle = INK; g.font = `500 40px ${F}`; g.fillText('معلمة المادة', 1560, 1110);
  g.fillStyle = TEAL; g.font = '700 58px "Reem Kufi", Tahoma, sans-serif'; g.fillText(TEACHER, 1560, 1190);
  g.strokeStyle = INK; g.lineWidth = 2; g.beginPath(); g.moveTo(1360,1230); g.lineTo(1760,1230); g.stroke();
  g.fillStyle = INK; g.font = `500 40px ${F}`; g.fillText('التاريخ', 440, 1110);
  const d = new Date(w.date); let hij = '';
  try{ hij = d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}) }catch(e){}
  const greg = d.toLocaleDateString('ar-SA-u-ca-gregory',{day:'numeric',month:'long',year:'numeric'});
  g.fillStyle = TEAL; g.font = `700 44px ${F}`; g.fillText(hij || greg, 440, 1180);
  if(hij){ g.fillStyle = '#5b6f6f'; g.font = `500 34px ${F}`; g.fillText(greg + 'م', 440, 1232) }
  return c;
}
const REASONS = ['تميّزها ومشاركتها الفعّالة في الحصة','تفوّقها في تحدي التميّز وتصدّرها لوحة الصدارة','إجابتها المتميزة في أسئلة نافس','تفوّقها وحسن أدائها في مادة العلوم','التزامها وحسن سلوكها داخل الفصل'];
async function openCert(w){
  const img = h('img',{id:'certImg',alt:'شهادة التميز'}), msg = h('p',{class:'msg'});
  const sel = h('select',{id:'reasonSel'}, REASONS.map(r => h('option',{value:r},r))); if(REASONS.includes(w.reason)) sel.value = w.reason;
  const txt = h('input',{type:'text',id:'reasonTxt',placeholder:'أو اكتبي سببًا خاصًا'});
  let canvas = null;
  const refresh = async () => { w.reason = txt.value.trim() || sel.value; canvas = await renderCert(w); img.src = canvas.toDataURL('image/png') };
  sel.onchange = () => { txt.value = ''; refresh() }; let rt; txt.oninput = () => { clearTimeout(rt); rt = setTimeout(refresh, 400) };
  modal(img, h('div',{class:'grid2'}, h('label',{class:'f',for:'reasonSel'},'سبب التميّز',sel), h('label',{class:'f',for:'reasonTxt'},'سبب خاص',txt)),
    h('div',{class:'row'}, h('button',{class:'btn primary',onclick:async () => {
      msg.className = 'msg'; msg.textContent = 'جارٍ التجهيز…';
      try{
        const blob = await new Promise(r => canvas.toBlob(r,'image/png'));
        const dl = window.claude ? await claude.use('downloads') : null;
        if(!dl){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `شهادة تميز - ${w.name}.png`; document.body.append(a); a.click(); a.remove(); msg.textContent = 'تم حفظ الشهادة ✅'; return }
        await dl.save({filename:`شهادة تميز - ${w.name}.png`, data:blob}); msg.textContent = 'تم حفظ الشهادة ✅';
      }catch(e){ msg.className = 'msg err'; msg.textContent = e && e.code === 'declined' ? 'لم يتم الحفظ.' : 'اضغطي مطولًا على الشهادة واختاري «حفظ الصورة».' }
    }},'حفظ الشهادة صورة')), msg);
  refresh();
}
