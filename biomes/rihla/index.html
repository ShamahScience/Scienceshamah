<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body>
<title>رحلة الاستكشاف</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: classroom stage — a slim wooden bar (stars + navigation), one scene at a time, a footer with the signature.
   Palette taken from the lesson artwork: leaf green, sand beige, wood brown, sky blue, soft gold. Single bright look for smart boards. */
@font-face{font-family:"Tajawal L";src:url("fonts/tajawal-500.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Tajawal L";src:url("fonts/tajawal-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Tajawal L";src:url("fonts/tajawal-800.woff2") format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Naskh L";src:url("fonts/naskh.woff2") format("woff2");font-weight:400 700;font-display:swap}
:root{
  color-scheme:light;
  --leaf:#3f7d3a; --leaf-dk:#24561f; --leaf-soft:#e3f0d8;
  --sand:#f6ecd8; --sand-dk:#e8d6b2; --paper:#fffaf0;
  --wood:#8a5a2b; --wood-dk:#5e3b19; --wood-soft:#f0dfc4;
  --sky:#3d8fc6; --sky-soft:#ddeef9;
  --gold:#d9a521; --gold-soft:#fbefc8; --gold-dk:#8a6510;
  --ink:#2e2418; --muted:#6d5c47;
  --ok:#2f8a4a; --ok-soft:#e1f3e4; --bad:#b9472c; --bad-soft:#fae3dc;
  --f-ui:"Tajawal L","Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  --f-book:"Naskh L","Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;
  --r:16px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sand);color:var(--ink);font-family:var(--f-ui);font-size:clamp(15px,.55vw + 10px,21px);line-height:1.65;direction:rtl}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}


.rulesboard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:18px;align-items:center;border-radius:22px;padding:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.2)),radial-gradient(circle at 20% 20%,#cfe8c0,#9cc985 60%,#6fa65a);border:6px solid #8a5a2b;box-shadow:inset 0 0 0 3px #c99b63,0 6px 18px rgba(60,40,10,.25)}
@media (max-width:760px){.rulesboard{grid-template-columns:minmax(0,1fr)}.rb-side{display:none}}
.rb-side{position:relative;display:flex;justify-content:center}
.rb-side img{width:min(100%,300px);height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.rb-compass{position:absolute;bottom:-6px;inset-inline-start:0;width:30%;filter:drop-shadow(0 0 12px #ffd24a)}
.rb-list{display:flex;flex-direction:column;gap:12px}
.rule-plank{position:relative;display:flex;align-items:center;gap:14px;min-height:68px;padding:8px 18px;border-radius:14px;background:linear-gradient(180deg,#f7e3bd,#e9cd98);border:3px solid #8a5a2b;box-shadow:0 4px 0 #5e3b19;font-weight:800;font-size:1.25em;color:var(--wood-dk);overflow:hidden}
.rule-plank:nth-child(odd){transform:rotate(-.6deg)}.rule-plank:nth-child(even){transform:rotate(.6deg)}
.rp-n{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--leaf);color:#fff;flex:none}
.rp-ic{font-size:1.4em}
.rp-cover{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#a9763d,#8a5a2b);color:#fff8ea;transition:opacity .5s,transform .5s}
.rule-plank.shown .rp-cover{opacity:0;transform:translateX(30%);pointer-events:none}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:6px;
  background:linear-gradient(180deg,#9b6a37,#7a4e24);color:#fff8ea;box-shadow:0 3px 0 #5e3b19}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:40px;height:40px;flex:none}
.brand b{font-size:1.15em;font-weight:800;white-space:nowrap}
.brand small{display:block;font-size:.72em;opacity:.9;white-space:nowrap}
.stars{display:flex;gap:6px;margin-inline:auto;flex-wrap:wrap;justify-content:center}
.star{display:flex;flex-direction:column;align-items:center;gap:0;min-width:58px}
.star svg{width:30px;height:30px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.3))}
.star svg{fill:#c7ad8a;stroke:#5e3b19;stroke-width:1.2}
.star.on svg{fill:#ffd24a;stroke:#8a6510}
.star.on svg{animation:pop .6s ease}
.star span{font-size:.62em;font-weight:700;opacity:.85;white-space:nowrap}
.star.on span{opacity:1;color:#ffe9a3}
@keyframes pop{0%{transform:scale(.4) rotate(-40deg)}60%{transform:scale(1.35)}100%{transform:none}}
.tools{display:flex;gap:6px}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid #c99b63;background:#fff4df;color:var(--wood-dk);border-radius:12px;padding:4px 10px;min-height:42px;font-weight:700;font-size:.85em}
.tbtn:hover{background:#fff}
.tbtn[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold)}
.tbtn svg{width:20px;height:20px}

/* stage */
#stage{overflow-y:auto;overflow-x:hidden;background:radial-gradient(1200px 500px at 80% -10%,#e9f5e0,transparent),var(--sand)}
.view{max-width:1380px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 26px;display:flex;flex-direction:column;gap:16px;animation:enter .45s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.plank{display:inline-block;background:linear-gradient(180deg,#b88449,#93622f);color:#fff8ea;font-weight:800;padding:4px 18px 6px;border-radius:12px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 0 #5e3b19;font-size:.95em}
.vhead h2{font-size:clamp(24px,2.4vw,40px);font-weight:800;color:var(--leaf-dk)}
.page{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);color:var(--gold-dk);border:1.5px solid var(--gold);border-radius:999px;padding:0 12px;font-size:.78em;font-weight:800;white-space:nowrap}
.strategy{display:inline-flex;gap:6px;align-items:center;background:var(--leaf-soft);color:var(--leaf-dk);border-radius:999px;padding:0 12px;font-size:.78em;font-weight:700}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.grid2.wide{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media (max-width:900px){.grid2,.grid2.wide{grid-template-columns:minmax(0,1fr)}}
.grid2>*{min-width:0}
.card{background:var(--paper);border:2px solid var(--sand-dk);border-radius:var(--r);padding:16px;box-shadow:0 3px 0 var(--sand-dk);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.wood{background:linear-gradient(180deg,#fbf1dc,#f3e2c0);border-color:#c99b63;box-shadow:0 3px 0 #b88449}
.card h3{font-size:1.15em;font-weight:800;color:var(--wood-dk)}
.muted{color:var(--muted)}
.book{font-family:var(--f-book);font-size:1.08em;line-height:2}
.clip{position:relative;border-radius:14px;overflow:hidden;border:3px solid var(--gold);background:#fff;cursor:zoom-in;padding:0;display:block;width:100%}
.clip img{display:block;width:100%;height:auto;max-height:64vh;object-fit:contain}
.clip .tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--gold);color:#3a2a00;font-weight:800;font-size:.72em;border-radius:8px;padding:1px 10px}
.clip .zoomi{position:absolute;bottom:8px;inset-inline-end:8px;background:rgba(255,255,255,.9);border-radius:50%;width:34px;height:34px;display:grid;place-items:center}
.photo{border-color:var(--leaf)}
.clip.narrow{max-width:560px;margin-inline:auto}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:8px 18px;min-height:48px;font-weight:800;background:var(--leaf);color:#fff;box-shadow:0 3px 0 var(--leaf-dk)}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--leaf-dk)}
.btn.gold{background:var(--gold);color:#3a2a00;box-shadow:0 3px 0 var(--gold-dk)}
.btn.wood{background:var(--wood);box-shadow:0 3px 0 var(--wood-dk)}
.btn.sky{background:var(--sky);box-shadow:0 3px 0 #23628f}
.btn.ghost{background:var(--paper);color:var(--wood-dk);border:2px solid #c99b63;box-shadow:0 3px 0 #c99b63}
.btn svg{width:20px;height:20px}
.answer{background:var(--ok-soft);border:2px solid var(--ok);border-radius:14px;padding:10px 14px}
.answer b{color:var(--ok)}
.hint{background:var(--gold-soft);border:2px dashed var(--gold);border-radius:14px;padding:8px 14px;color:var(--gold-dk)}
.src{font-size:.72em;font-weight:800;border-radius:6px;padding:0 6px;margin-inline-start:4px;vertical-align:middle}
.src.b{background:var(--gold-soft);color:var(--gold-dk)}
.src.x{background:var(--sky-soft);color:#23628f}

/* image with hotspots */
.hot{position:relative;width:100%;max-width:100%;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(60,40,10,.25);background:#000;aspect-ratio:1672/941}
.hot img{display:block;width:100%;height:100%;object-fit:cover}
.hs{position:absolute;border:0;background:transparent;border-radius:14px;padding:0;transition:box-shadow .2s,background .2s}
.hs:hover,.hs:focus-visible{background:rgba(255,230,140,.18);box-shadow:0 0 0 4px #ffd24a,0 0 22px 6px rgba(255,210,74,.75)}
.hs.pulse{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px rgba(255,210,74,.55)}50%{box-shadow:0 0 0 6px rgba(255,210,74,.95),0 0 26px 8px rgba(255,210,74,.6)}}
.cover-rule{position:absolute;border-radius:12px;background:linear-gradient(180deg,#c9965b,#a9763d);color:#fff8ea;display:grid;place-items:center;font-weight:800;font-size:clamp(14px,1.6vw,26px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);transition:opacity .5s,transform .5s}
.cover-rule.gone{opacity:0;transform:scale(.9);pointer-events:none}
.compass-ring{position:absolute;border-radius:50%;pointer-events:none;border:4px dashed rgba(255,215,90,.9);animation:spin 9s linear infinite}
.strip{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;background:var(--paper);border:2px solid #c99b63;border-radius:16px;padding:10px 16px}
.strip label{display:inline-flex;gap:6px;align-items:center;font-weight:700}
.strip input{border:0;border-bottom:2px dashed #c99b63;background:transparent;width:9em;padding:2px 4px}

/* steps / tabs */
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps button{border:2px solid var(--sand-dk);background:var(--paper);border-radius:999px;padding:4px 14px;font-weight:800;color:var(--muted);min-height:40px}
.steps button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.steps button.done{border-color:var(--leaf);color:var(--leaf-dk)}
.stepbody{display:flex;flex-direction:column;gap:12px}

/* questions */
.mcq{display:flex;flex-direction:column;gap:10px}
.mcq .q{font-weight:800;font-size:1.08em}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opt{text-align:right;border:2.5px solid var(--sand-dk);background:#fff;border-radius:14px;padding:8px 14px;min-height:48px;font-weight:700;transition:transform .15s}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:#1d5a30}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:#7a2a17;animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-radius:12px;padding:8px 12px;font-weight:700}
.fb.ok{background:var(--ok-soft);color:#1d5a30}
.fb.no{background:var(--bad-soft);color:#7a2a17}
.lvl{display:inline-block;font-size:.7em;font-weight:800;border-radius:6px;padding:0 8px;background:var(--sky-soft);color:#23628f;vertical-align:middle;margin-inline-start:6px}
.bookq{border-inline-start:6px solid var(--gold);background:#fffdf6;border-radius:10px;padding:8px 12px}
.bookq .lab{color:var(--sky);font-weight:800}
.kw{background:none;border:0;padding:0 2px;border-radius:4px;border-bottom:2px dotted var(--wood);cursor:pointer;font:inherit;color:inherit}
.kw.on{background:#ffe680;border-bottom-color:transparent}

/* guide bubble */
.guide{display:flex;align-items:flex-end;gap:10px}
.guide img{width:88px;height:auto;flex:none}
.bubble{position:relative;background:#fff;border:2.5px solid #c99b63;border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700;flex:1;min-width:0}

/* region scene */
.scene{position:relative;border-radius:18px;overflow:hidden;border:4px solid #c99b63;box-shadow:0 6px 18px rgba(60,40,10,.25);background:#000}
.scene img{display:block;width:100%;height:auto}
.scene .mask{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;padding:22px 16px 10px;font-weight:800;font-size:1.3em}
.clues{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:700px){.clues{grid-template-columns:minmax(0,1fr)}}
.clue{border:2.5px dashed #c99b63;background:var(--paper);border-radius:14px;padding:10px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;font-weight:700}
.clue .ic{font-size:1.7em;line-height:1}
.clue.shut{background:linear-gradient(180deg,#c9965b,#a9763d);color:#fff8ea;border-style:solid;border-color:#8a5a2b}
.factcard{border-radius:16px;border:3px solid var(--c,var(--leaf));background:#fff;overflow:hidden}
.factcard header{background:var(--c,var(--leaf));color:#fff;font-weight:800;font-size:1.3em;padding:6px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.factcard dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr)}
.factcard dt,.factcard dd{margin:0;padding:7px 12px;border-top:1.5px solid #efe3cc}
.factcard dt{font-weight:800;color:var(--wood-dk);background:#fbf3e3;white-space:nowrap}
.hub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:800px){.hub{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rcard{position:relative;border:0;padding:0;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 4px 0 #b88449;text-align:right}
.rcard img{display:block;width:100%;aspect-ratio:16/7;object-fit:cover;filter:saturate(1.05)}
.rcard .lab{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(30,20,5,.8));color:#fff;padding:18px 12px 8px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rcard .done{background:var(--gold);color:#3a2a00;border-radius:999px;padding:0 10px;font-size:.8em}
.rcard:hover img{transform:scale(1.04);transition:transform .4s}

/* table */
.tablewrap{overflow-x:auto}
table.cmp{width:100%;border-collapse:separate;border-spacing:6px}
.cmp th{background:var(--wood);color:#fff;border-radius:10px;padding:6px 10px}
.cmp td{background:#fff;border:2px solid var(--sand-dk);border-radius:10px;padding:6px 10px;vertical-align:middle}
.cmp td.h{background:var(--wood-soft);font-weight:800;white-space:nowrap}
.cell{border:0;background:var(--gold-soft);border-radius:8px;width:100%;min-height:40px;font-weight:800;color:var(--gold-dk)}
.org td[contenteditable]{min-width:7em;height:42px;background:#fff}
select{border:2px solid #c99b63;border-radius:10px;padding:4px 10px;background:#fff;font-weight:700}

/* bands */
.bands rect.b{cursor:pointer;transition:opacity .3s}
.bands.focus rect.b:not(.on){opacity:.25}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--c);background:#fff;color:var(--ink);border-radius:999px;padding:3px 12px;font-weight:800;min-height:40px}
.chip.on{background:var(--c);color:#fff}

/* timer */
.timer{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid #c99b63;border-radius:999px;padding:2px 4px 2px 12px;font-weight:800}
.timer b{font-variant-numeric:tabular-nums;min-width:3.4ch;text-align:center}
.timer button{border:0;background:var(--leaf);color:#fff;border-radius:999px;padding:2px 12px;min-height:36px;font-weight:800}

/* challenge */
.chal{display:flex;flex-direction:column;gap:12px}
.chal .card.locked{opacity:.45;pointer-events:none}
.badge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--wood);color:#fff;font-weight:800;flex:none}
.bigcompass{width:min(240px,50vw);height:auto;margin:0 auto;display:block}
.bigcompass.lit{filter:drop-shadow(0 0 18px #ffd24a) drop-shadow(0 0 40px #ffd24a)}
.cert{border:6px double var(--gold);background:radial-gradient(circle at top,#fffdf3,#fbefd2);border-radius:22px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.cert h2{font-size:clamp(28px,3vw,46px);color:var(--leaf-dk)}
.cert input{text-align:center;border:0;border-bottom:2px dashed var(--gold);background:transparent;font-size:1.4em;font-weight:800;width:min(420px,80%)}
.exitgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.exitgrid{grid-template-columns:minmax(0,1fr)}}
textarea{width:100%;min-height:110px;border:2px solid var(--sand-dk);border-radius:12px;padding:8px;background:#fff;resize:vertical}

/* notes */
.notes{background:#fff;border:2px dashed var(--sky);border-radius:14px;padding:10px 14px;font-size:.88em}
.notes h3{color:#23628f;font-size:1em}
.notes ul{margin:4px 0 0;padding-inline-start:20px}

/* footer */
.foot{display:flex;align-items:center;gap:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:6px;background:#f0dfc4;border-top:3px solid #c99b63}
.foot .sig{margin-inline:auto;font-weight:800;color:var(--wood-dk);display:flex;align-items:center;gap:8px;white-space:nowrap}
.foot .sig svg{width:22px;height:22px}
.nav{min-height:44px}

/* warp overlay */
#warp{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(circle,rgba(40,28,10,.55),rgba(20,14,5,.85));padding:16px}
#warp .box{display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff8ea;text-align:center}
#warp svg{width:min(260px,55vw);height:auto;filter:drop-shadow(0 0 22px rgba(255,210,74,.85))}
#warp .needle{transform-origin:100px 100px;animation:spinneedle 1.8s cubic-bezier(.4,1.6,.5,1) both}
#warp .dial{transform-origin:100px 100px;animation:spin 3s linear infinite}
#warp .lbl{font-weight:800;font-size:clamp(22px,2.6vw,38px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinneedle{0%{transform:rotate(0)}100%{transform:rotate(720deg)}}
#zoom{position:fixed;inset:0;z-index:70;background:rgba(20,14,5,.9);display:grid;place-items:center;padding:16px;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;border-radius:12px;background:#fff}
#toast{position:fixed;z-index:80;top:70px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--gold);color:#3a2a00;font-weight:800;border-radius:999px;padding:8px 22px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:enter .3s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){.star span,.brand small,.tbtn .t{display:none}.star{min-width:30px}.foot .sig{font-size:.85em}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

  </div>`;

const CH = [
  { t: 'أتعرّف المنطقة من صورتها', img: 'scene-forest', q: 'إلى أي منطقة حيوية تنتمي هذه الصورة؟', o: ['التايجا', 'الغابات المتساقطة الأوراق', 'الأراضي العشبية'], k: 1, w: 'الأوراق الخريفية الملوّنة المتساقطة دليل على الغابات المتساقطة الأوراق.' },
  { t: 'أختار المناخ المناسب', q: 'منطقة يقل معدل أمطارها عن ٢٥ سم في العام، ويتبخر ماء المطر فيها قبل وصوله إلى الأرض. ما هي؟', o: ['الصحراء', 'الغابات الاستوائية المطيرة', 'الأراضي العشبية'], k: 0, w: 'الصحراء تُعرّف بقلة الهطل (ص ١٥٢).' },
  { t: 'أصنّف', sort: [['الصبّار', 'الصحراء'], ['الصنوبر والتنوب', 'التايجا'], ['الحمار الوحشي', 'الأراضي العشبية'], ['البلوط والزان', 'الغابات المتساقطة الأوراق']] },
  { t: 'أقارن بين منطقتين', q: 'ما الفرق بين الأراضي العشبية والغابات المتساقطة الأوراق؟', o: ['الأعشاب المكوّن الرئيس في الأراضي العشبية، والأشجار التي تفقد أوراقها قبل الشتاء في الغابات', 'كلتاهما بلا نباتات', 'الأراضي العشبية أشجار مخروطية دائمة الخضرة'], k: 0, w: 'لكل منطقة نباتها الرئيس بحسب مناخها (ص ١٥٣).' },
  { t: 'أفسّر', q: 'لماذا لا نجد البطريق إلا في المناطق الباردة القطبية؟', o: ['لأن المخلوقات الحية تتكيّف للعيش في ظروف مناخية محددة ومناسبة لها', 'لأن البطريق لا يحب السفر', 'لأن المناطق الحارة لا توجد فيها مياه'], k: 0, w: 'يؤثر المناخ في أنواع المخلوقات الحية، وتتكيّف المخلوقات للعيش في ظروف مناخية محددة (ص ١٥٠).' }
];
const SORT_BINS = ['الصحراء', 'التايجا', 'الأراضي العشبية', 'الغابات المتساقطة الأوراق'];
V.challenge = () => {
  const n = Object.keys(S.chal).length;
  return `${head('تحدي الإتقان', 'خمسة تحديات لعالمة المناطق الحيوية', '', 'التقويم الختامي')}
  <p class="muted">أكملتِ ${AR(n)} من ٥ — كل تحدٍّ يفتح التالي.</p>
  <div class="chal">${CH.map((c, i) => {
    const locked = i > 0 && !S.chal[i - 1] && !S.chal[i];
    let inner;
    if (c.sort) inner = `<p class="q" style="font-weight:800">اختاري المنطقة الحيوية المناسبة لكل مخلوق:</p>${c.sort.map(([it, ans], j) => `<div class="mcq" data-sortitem="${i}-${j}" data-ok="${SORT_BINS.indexOf(ans)}" data-why="${encodeURIComponent('صحيح: ' + it + ' ← ' + ans)}"><div class="row"><b style="min-width:9em">${it}</b><div class="opts inline">${SORT_BINS.map((b, bi) => `<button class="opt" data-i="${bi}">${b}</button>`).join('')}</div></div><div class="fb" hidden></div></div>`).join('')}`;
    else inner = `${c.img ? `<div class="scene" style="max-width:560px"><img src="${A}${c.img}.jpg" alt="منطقة حيوية"></div>` : ''}${mcq(c.q, c.o, c.k, c.w, { id: 'ch' + i })}`;
    return `<div class="card${locked ? ' locked' : ''}" data-ch="${i}"><div class="row"><span class="badge">${AR(i + 1)}</span><h3>${c.t}</h3>${S.chal[i] ? '<span class="page">✓ أتقنت</span>' : ''}</div>${inner}</div>`;
  }).join('')}</div>
  <div class="card" style="align-items:center;text-align:center" ${n < 5 ? 'hidden' : ''} id="chalDone">
    <svg class="bigcompass lit" viewBox="0 0 200 200"><use href="#compass"/></svg><h3>أضاءت البوصلة! أتقنتِ التحديات الخمسة.</h3><button class="btn gold" data-go="essential">إلى السؤال الأساسي</button></div>`;
};

V.essential = () => `
  ${head('تحدي الإتقان', 'السؤال الأساسي', '', 'التأمل والاستنتاج')}
  <div class="card" style="align-items:center;text-align:center">
    <svg class="bigcompass lit" viewBox="0 0 200 200"><use href="#compass"/></svg>
    <h2 style="color:var(--leaf-dk);font-size:clamp(24px,2.6vw,40px)">لماذا تختلف المخلوقات الحية من منطقة إلى أخرى على سطح الأرض؟</h2>
    <p class="muted">تشارك الطالبات بالإجابة أولًا…</p>
    ${reveal('أظهري الخلاصة العلمية', 'لأن <b>المناخ</b> يختلف من منطقة إلى أخرى في درجة الحرارة وكمية الهطل؛ فكلما ابتعدنا عن خط الاستواء أو ارتفعنا قلّت الحرارة. وتتكيّف المخلوقات الحية للعيش في ظروف مناخية محددة ومناسبة لها؛ <b>فتتميّز كل منطقة حيوية بأنواع معيّنة من النباتات والحيوانات</b>.')}
    <button class="btn" data-go="exit">إلى بطاقة الخروج</button></div>`;

V.exit = () => `
  ${head('تحدي الإتقان', 'بطاقة الخروج', '', 'التقويم السريع')}
  <div class="exitgrid">
    ${[['🔍 اكتشفت', 'معلومة جديدة تعلّمتها اليوم:', 'ex1'], ['⚖️ قارنت', 'بين منطقتين حيويتين في المناخ أو النباتات أو الحيوانات:', 'ex2'], ['💡 فسّرت', 'أثر المناخ في المخلوقات الحية:', 'ex3']].map(([h, p, id]) => `<div class="card wood"><h3>${h}</h3><p>${p}</p><textarea id="${id}" aria-label="${h}"></textarea></div>`).join('')}
  </div>
  <div class="row" style="justify-content:center"><button class="btn gold" id="mkCert">أصدري بطاقة الإنجاز 🏅</button></div>
  <div class="cert" id="cert" hidden>
    <svg class="bigcompass lit" viewBox="0 0 200 200" style="width:120px"><use href="#compass"/></svg>
    <h2>عالمة المناطق الحيوية</h2>
    <input id="certName" placeholder="اكتبي اسم الطالبة أو المجموعة" aria-label="اسم الطالبة أو المجموعة">
    <p style="font-size:1.15em">أنهت رحلة الاستكشاف بنجاح، ولاحظت وقارنت واستنتجت كعالمة حقيقية. 🌍</p>
    <div class="row" id="certStars" style="justify-content:center"></div>
    <b style="color:var(--wood-dk)">أ/ شامه البقمي</b>
  </div>`;

/* ------------------------------------------------ render & navigation */
function notesHTML(id) {
  const n = NOTES[id]; if (!n || !S.notes) return '';
  return `<aside class="notes"><h3>دليل المعلمة · الزمن: ${n[0]} · الاستراتيجية: ${n[1]}</h3><ul>${n[2].map(x => `<li>${x}</li>`).join('')}</ul></aside>`;
}
function render(id) {
  if (!V[id]) id = 'opening';
  S.cur = id;
  stage.innerHTML = `<section class="view" data-view="${id}">${V[id]()}${notesHTML(id)}</section>`;
  stage.scrollTop = 0;
  if (id === 'compare') fillCompare();
  if (id === 'opening') { $('#inDay').value = S.day || ''; $('#inDate').value = S.date || ''; }
  const li = LIN.indexOf(id);
  const isR = id.startsWith('r-');
  $('#bPrev').disabled = id === 'opening';
  $('#bNext').disabled = id === 'exit';
  $('#bPrev').dataset.to = isR ? 'regions' : LIN[li - 1] || '';
  $('#bNext').dataset.to = isR ? (RK[RK.indexOf(id.slice(2)) + 1] ? 'r-' + RK[RK.indexOf(id.slice(2)) + 1] : 'where') : LIN[li + 1] || '';
  if (location.hash.slice(1) !== id) { try { history.replaceState(null, '', '#' + id); } catch (e) { } }
}
let warpT = null, warpTo = null;
function go(id) { render(id); }
function warp(id, label) {
  if (!S.motion) { render(id); return; }
  warpTo = id; $('#warpLbl').textContent = label || 'البوصلة تحدد الاتجاه…';
  const w = $('#warp'); w.hidden = false;
  const svg = $('svg', w); svg.replaceWith(svg.cloneNode(true));
  clearTimeout(warpT); warpT = setTimeout(endWarp, 2200);
}
function endWarp() { clearTimeout(warpT); if (warpTo) { const t = warpTo; warpTo = null; $('#warp').hidden = true; render(t); } }
$('#warpSkip').addEventListener('click', endWarp);
$('#warp').addEventListener('click', e => { if (e.target.id === 'warp') endWarp(); });

/* ------------------------------------------------ delegated interactions */
document.addEventListener('click', e => {
  const t = e.target;
  const g = t.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const w = t.closest('[data-warp]'); if (w) { warp(w.dataset.warp, w.dataset.label); return; }
  const z = t.closest('[data-zoom]'); if (z) { $('#zoomImg').src = z.dataset.zoom; $('#zoom').hidden = false; return; }
  if (t.closest('#zoom')) { $('#zoom').hidden = true; return; }
  const rv = t.closest('[data-reveal]'); if (rv) { const box = rv.nextElementSibling; if (!rv.dataset.lab) rv.dataset.lab = rv.textContent; box.hidden = !box.hidden; rv.textContent = box.hidden ? rv.dataset.lab : 'إخفاء'; return; }
  const tab = t.closest('[data-tabs] button');
  if (tab) { const bar = tab.parentElement, i = [...bar.children].indexOf(tab), card = bar.parentElement;
    [...bar.children].forEach((b, j) => { b.classList.toggle('on', j === i); if (j < i) b.classList.add('done'); });
    $$(':scope > [data-tab]', card).forEach(p => p.hidden = +p.dataset.tab !== i); return; }
  const kw = t.closest('.kw'); if (kw) { kw.classList.toggle('on'); if (kw.hasAttribute('data-key') && kw.classList.contains('on')) toast('هذه هي المفردة العلمية الرئيسة!'); return; }
  const opt = t.closest('.opt'); if (opt && !opt.disabled) { answer(opt); return; }
  const cl = t.closest('[data-clue]'); if (cl && cl.classList.contains('shut')) { cl.classList.remove('shut'); $('.t', cl).hidden = false; $('.q', cl).hidden = true; return; }
  const rs = t.closest('[data-rstep]'); if (rs) { S.region[S.cur.slice(2)] = +rs.dataset.rstep; render(S.cur); return; }
  if (t.closest('[data-rnext]')) { regionNext(); return; }
  const cell = t.closest('[data-cell]'); if (cell) { cell.outerHTML = `<span>${cell.dataset.cell}</span>`; return; }
  const wh = t.closest('[data-where]'); if (wh) { const k = wh.dataset.where, [band, txt] = WHERE[k];
    $$('[data-where]').forEach(c => c.classList.toggle('on', c === wh)); $('#bands').classList.add('focus');
    $$('#bands rect.b').forEach(r => r.classList.toggle('on', r.dataset.b === band));
    const o = $('#whereOut'); o.hidden = false; o.innerHTML = `<b>${REG[k].n}:</b> ${txt}`; return; }
  if (t.closest('#nextRule')) { const c = $$('.rule-plank:not(.shown)')[0]; if (c) c.classList.add('shown'); else toast('ظهرت القوانين كلها؛ أنتِ مستعدة!'); return; }
  if (t.closest('#mkCert')) { const c = $('#cert'); c.hidden = false; $('#certStars').innerHTML = STARS.map(([k, l]) => `<span class="star ${S.stars[k] ? 'on' : ''}" style="color:var(--wood-dk)"><svg viewBox="0 0 24 24"><use href="#i-star"/></svg><span style="color:var(--wood-dk)">${l}</span></span>`).join(''); c.scrollIntoView({ behavior: 'smooth' }); return; }
  const tm = t.closest('.timer button'); if (tm) { timer(tm.parentElement); return; }
});
document.addEventListener('change', e => { if (e.target.id === 'selA' || e.target.id === 'selB') fillCompare(); });
document.addEventListener('input', e => { if (e.target.id === 'inDay') S.day = e.target.value; if (e.target.id === 'inDate') S.date = e.target.value; });

function answer(opt) {
  const box = opt.closest('.mcq'), fb = $('.fb', box), ok = +box.dataset.ok === +opt.dataset.i;
  if (ok) {
    opt.classList.add('right'); $$('.opt', box).forEach(b => b.disabled = true);
    fb.className = 'fb ok'; fb.innerHTML = `${praise()} ${decodeURIComponent(box.dataset.why || '')}`;
    award(box.dataset.star);
    if (box.dataset.then === 'rnext') { const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'التالي ←'; b.dataset.rnext = ''; fb.after(b); }
    const ch = box.closest('[data-ch]');
    if (ch) { const i = +ch.dataset.ch, need = $$('.mcq', ch).length, done = $$('.opt.right', ch).length;
      if (done === need) { S.chal[i] = true; setTimeout(() => render('challenge'), 1100); } }
  } else {
    opt.classList.add('wrong'); opt.disabled = true;
    fb.className = 'fb no'; fb.textContent = 'راجعي الأدلة، ثم حاولي مرة أخرى.';
  }
  fb.hidden = false;
}
function regionNext() {
  const k = S.cur.slice(2), st = (S.region[k] || 0) + 1;
  S.region[k] = Math.min(st, 4);
  if (st >= 4) { S.done[k] = true; if (RK.every(x => S.done[x])) award('discover'); }
  render(S.cur);
}
function timer(el) {
  if (el._h) { clearInterval(el._h); el._h = null; $('button', el).textContent = 'تابعي'; return; }
  let left = el._left ?? +el.dataset.sec; const b = $('b', el);
  $('button', el).textContent = 'إيقاف';
  el._h = setInterval(() => { left--; el._left = left; b.textContent = AR(Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'));
    if (left <= 0) { clearInterval(el._h); el._h = null; el._left = +el.dataset.sec; $('button', el).textContent = 'أعيدي'; toast('⏰ انتهى الوقت!'); } }, 1000);
}

/* ------------------------------------------------ toolbar */
$('#bBoard').addEventListener('click', () => warp('board', 'العودة إلى لوحة الانطلاق'));
$('#bPrev').addEventListener('click', e => { const to = e.currentTarget.dataset.to; if (to) go(to); });
$('#bNext').addEventListener('click', e => { const to = e.currentTarget.dataset.to; if (to) go(to); });
$('#bNotes').addEventListener('click', e => { S.notes = !S.notes; e.currentTarget.setAttribute('aria-pressed', S.notes); render(S.cur); });
$('#bMotion').addEventListener('click', e => { S.motion = !S.motion; e.currentTarget.setAttribute('aria-pressed', S.motion); $('.t', e.currentTarget).textContent = S.motion ? 'الحركة: تعمل' : 'الحركة: متوقفة'; });
$('#bFull').addEventListener('click', () => { try { if (document.fullscreenElement) document.exitFullscreen(); else { const p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => { }); } } catch (e) { } });
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select,[contenteditable="true"]')) return;
  if (e.key === 'Escape') { $('#zoom').hidden = true; if (!$('#warp').hidden) endWarp(); }
  if (e.key === 'ArrowLeft') $('#bNext').click();
  if (e.key === 'ArrowRight') $('#bPrev').click();
});
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== S.cur && V[id]) render(id); });
if (!S.motion) { $('#bMotion').setAttribute('aria-pressed', 'false'); $('#bMotion .t').textContent = 'الحركة: متوقفة'; }
render(V[location.hash.slice(1)] ? location.hash.slice(1) : 'opening');
})();
</script>

</body></html>
