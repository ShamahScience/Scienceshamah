<!doctype html>
<html lang="ar" dir="rtl" data-game="respiration" data-title="رحلة الهواء والدم">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رحلة الهواء والدم</title>
<style>
  :root{
    --bg:#F4FAF5; --card:#FFFFFF; --ink:#2B3A55; --muted:#6B7A8F; --green:#2E8B57; --dk:#1E5E3A;
    --pink:#E85D9A; --blue:#2F80C8; --gold:#E3A21A; --red:#D64545; --violet:#7A5BC9; --line:#D7E6DB;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#13201A; --card:#1C2B24; --ink:#EAF2EC; --muted:#A9B8AE; --line:#2F4238; }
  }
  :root[data-theme="dark"]{ --bg:#13201A; --card:#1C2B24; --ink:#EAF2EC; --muted:#A9B8AE; --line:#2F4238; }
  *{box-sizing:border-box}
  body{margin:0; font-family:Tahoma, "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--ink); min-height:100vh}
  .wrap{max-width:900px; margin:0 auto; padding:16px}
  header{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px}
  h1{font-size:clamp(22px,4vw,32px); margin:0; color:var(--dk)}
  .sub{color:var(--muted); font-size:14px}
  .score{background:var(--card); border:2px solid var(--gold); border-radius:999px; padding:6px 14px; font-weight:bold; font-size:18px}
  .card{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:18px; box-shadow:0 4px 14px rgba(0,0,0,.06)}
  .stage-tag{display:inline-block; background:var(--green); color:#fff; border-radius:999px; padding:4px 12px; font-size:14px; margin-bottom:8px}
  h2{margin:4px 0 6px; font-size:clamp(19px,3.2vw,26px)}
  .hint{color:var(--muted); margin:0 0 14px}
  .chain{display:flex; flex-wrap:wrap; gap:8px; min-height:58px; padding:10px; border:2px dashed var(--line); border-radius:14px; margin-bottom:14px; align-items:center}
  .chain .slot{background:var(--green); color:#fff; padding:8px 12px; border-radius:12px; font-weight:bold; animation:pop .3s}
  .chain .arrow{color:var(--muted); font-weight:bold}
  .pool{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
  button{font-family:inherit; cursor:pointer}
  .chip{background:var(--card); color:var(--ink); border:2.5px solid var(--blue); border-radius:14px; padding:14px 10px; font-size:17px; font-weight:bold; min-height:56px; transition:transform .1s}
  .chip:active{transform:scale(.97)}
  .chip.used{visibility:hidden}
  .chip.shake{animation:shake .4s; border-color:var(--red)}
  .opts{display:grid; gap:10px}
  .opt{background:var(--card); color:var(--ink); border:2.5px solid var(--line); border-radius:14px; padding:14px; font-size:18px; text-align:right; font-weight:bold}
  .opt.ok{border-color:var(--green); background:#E7F6EC; color:#1E5E3A}
  .opt.no{border-color:var(--red); animation:shake .4s}
  .feedback{margin-top:12px; min-height:28px; font-weight:bold; font-size:17px}
  .feedback.ok{color:var(--green)} .feedback.no{color:var(--red)}
  .row{display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top:14px; flex-wrap:wrap}
  .btn{background:var(--violet); color:#fff; border:none; border-radius:999px; padding:12px 22px; font-size:17px; font-weight:bold}
  .btn.green{background:var(--green)} .btn.ghost{background:transparent; color:var(--muted); border:2px solid var(--line)}
  .progress{display:flex; gap:6px}
  .dot{width:14px; height:14px; border-radius:50%; background:var(--line)}
  .dot.on{background:var(--gold)}
  .stars{font-size:46px; letter-spacing:6px; text-align:center; margin:10px 0}
  .center{text-align:center}
  .badge{font-size:64px}
  footer{margin-top:14px; text-align:center; color:var(--muted); font-size:14px}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .confetti{position:fixed; top:-20px; font-size:24px; animation:fall 2.2s linear forwards; pointer-events:none}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
</style>
</head>
<body>
<a href="index.html" style="position:fixed;bottom:12px;left:12px;z-index:9999;opacity:.92;background:#fff;border:2px solid #2E8B57;color:#1E5E3A;border-radius:999px;padding:6px 12px;font:700 14px Tahoma,sans-serif;text-decoration:none">← الألعاب</a>
<div class="wrap">
  <header>
    <div>
      <h1>🫁 رحلة الهواء والدم ❤️</h1>
      <div class="sub">لعبة مراجعة · العلوم · الصف السادس · التنفس والدوران (ص١١٢–١١٦)</div>
    </div>
    <div class="score" aria-live="polite">⭐ <span id="score">٠</span></div>
  </header>
  <main id="app" class="card"></main>
  <footer>إعداد المعلمة: أ/ شامه البقمي</footer>
</div>

<script>
const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// المراحل: ترتيب ثم أسئلة
const STAGES = [
  { type: 'order', title: 'المرحلة ١: رحلة الهواء 🌬️', hint: 'اضغطي على الأجزاء بالترتيب الصحيح من دخول الهواء حتى تبادل الغازات (ص١١٣).',
    steps: ['الأنف والفم', 'البلعوم', 'الحنجرة', 'القصبة الهوائية', 'الشعيبتان الهوائيتان', 'الحويصلات الهوائية'],
    done: 'رائع! في الحويصلات الهوائية يتم تبادل الغازات بين الدم والهواء.' },
  { type: 'order', title: 'المرحلة ٢: رحلة الدم ❤️', hint: 'رتّبي الدورة الدموية كما في شكل الكتاب (ص١١٦).',
    steps: ['دم غير مؤكسج يصل إلى القلب', 'يُضخّ إلى الرئتين', 'يتخلص من ثاني أكسيد الكربون ويُحمَّل بالأكسجين', 'يعود مؤكسجًا إلى القلب', 'يُضخّ إلى سائر أجزاء الجسم'],
    done: 'أحسنتِ! هذه هي الدورة الدموية: الأزرق غير مؤكسج، والأحمر مؤكسج.' },
  { type: 'quiz', title: 'المرحلة ٣: تحدي العالمة الصغيرة 🏆', hint: 'اختاري الإجابة الصحيحة.',
    qs: [
      { q: 'عملية إطلاق الطاقة المختزنة في جزيئات الجلوكوز تُسمّى:', o: ['الدوران', 'التنفس', 'الهضم'], a: 1, why: 'التنفس يحدث في الخلايا بوجود الأكسجين.' },
      { q: 'بأيّ تركيب تتبادل الحشرات الغازات؟', o: ['القصيبات', 'الخياشيم', 'الرئات'], a: 0, why: 'أنابيب شديدة التفرع تُسمّى القصيبات.' },
      { q: 'جهاز الدوران في الجرادة:', o: ['مغلق', 'مفتوح', 'لا يوجد'], a: 1, why: 'يتحرك الدم مباشرة من القلب إلى الأنسجة.' },
      { q: 'ما وظيفة الصمامات في الأوردة؟', o: ['تمنع رجوع الدم', 'تصنع الدم', 'تهضم الغذاء'], a: 0, why: 'تجعل الدم يتدفق في اتجاه واحد، كما في تجربة الأنبوب.' },
      { q: 'أيّ هذه الحيوانات ثابتة درجة الحرارة؟', o: ['الثعبان', 'الضفدع', 'الطيور'], a: 2, why: 'الطيور والثدييات ثابتة درجة الحرارة.' },
      { q: 'لماذا يتعب متسلقو الجبال الشاهقة؟', o: ['لأن الهواء قليل الأكسجين', 'لأن الجو حار', 'لأنهم لا يأكلون'], a: 0, why: 'قلة الأكسجين تقلل الطاقة التي تُطلقها الخلايا.' }
    ] }
];

let score = 0, stageIdx = 0, qIdx = 0, mistakesInStage = 0;
const app = document.getElementById('app');
const scoreEl = document.getElementById('score');
function addScore(n) { score += n; scoreEl.textContent = ar(score); }

let actx;
function beep(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [523, 659, 784] : [300, 220];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; o.type = 'sine'; o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime + i * 0.11;
      g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o.start(t); o.stop(t + 0.26);
    });
  } catch (e) {}
}
function confetti() {
  for (let i = 0; i < 24; i++) {
    const s = document.createElement('div'); s.className = 'confetti';
    s.textContent = ['⭐', '🎉', '💚', '❤️', '🫁'][i % 5];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * 0.6 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 3000);
  }
}
function progress() {
  return '<div class="progress">' + STAGES.map((_, i) => `<span class="dot ${i <= stageIdx ? 'on' : ''}"></span>`).join('') + '</div>';
}

function start() {
  app.innerHTML = `
    <div class="center">
      <div class="badge">🔬</div>
      <h2>مرحبًا يا عالمتي الصغيرة!</h2>
      <p class="hint">ثلاث مراحل: رتّبي رحلة الهواء، ثم رحلة الدم، ثم أجيبي عن تحدي العالمة الصغيرة.<br>
      كل إجابة صحيحة = ١٠ نجوم ⭐</p>
      <button class="btn green" id="go">ابدئي الرحلة ◀</button>
    </div>`;
  document.getElementById('go').onclick = () => { stageIdx = 0; render(); };
}

function render() {
  const st = STAGES[stageIdx];
  mistakesInStage = 0;
  if (st.type === 'order') renderOrder(st); else { qIdx = 0; renderQuiz(st); }
}

function renderOrder(st) {
  let next = 0;
  const items = shuffle(st.steps.map((t, i) => ({ t, i })));
  app.innerHTML = `
    <span class="stage-tag">${st.title}</span>
    <h2>رتّبي المراحل</h2>
    <p class="hint">${st.hint}</p>
    <div class="chain" id="chain" aria-live="polite"><span class="hint" style="margin:0">ابدئي بالخطوة الأولى…</span></div>
    <div class="pool" id="pool">${items.map(x => `<button class="chip" data-i="${x.i}">${x.t}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <div class="row">${progress()}<span></span></div>`;
  const chain = document.getElementById('chain'), fb = document.getElementById('fb');
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (i === next) {
      if (next === 0) chain.innerHTML = '';
      else chain.insertAdjacentHTML('beforeend', '<span class="arrow">←</span>');
      chain.insertAdjacentHTML('beforeend', `<span class="slot">${st.steps[i]}</span>`);
      b.classList.add('used'); beep(true); fb.className = 'feedback ok'; fb.textContent = 'صحيح! ✔';
      next++;
      if (next === st.steps.length) {
        addScore(Math.max(10, 30 - mistakesInStage * 5)); confetti();
        fb.textContent = '🌟 ' + st.done;
        app.querySelector('.row span:last-child').outerHTML = '<button class="btn" id="nx">المرحلة التالية ◀</button>';
        document.getElementById('nx').onclick = () => { stageIdx++; render(); };
      }
    } else {
      mistakesInStage++; beep(false);
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      fb.className = 'feedback no'; fb.textContent = 'فكّري مرة أخرى… ما الخطوة التي تأتي الآن؟';
    }
  });
}

function renderQuiz(st) {
  const item = st.qs[qIdx];
  let tries = 0;
  app.innerHTML = `
    <span class="stage-tag">${st.title}</span>
    <h2>السؤال ${ar(qIdx + 1)} من ${ar(st.qs.length)}</h2>
    <p style="font-size:20px;font-weight:bold;margin:6px 0 14px">${item.q}</p>
    <div class="opts">${item.o.map((t, i) => `<button class="opt" data-i="${i}">${'أبج'[i]}) ${t}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <div class="row">${progress()}<span></span></div>`;
  const fb = document.getElementById('fb');
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (b.disabled) return;
    if (i === item.a) {
      app.querySelectorAll('.opt').forEach(x => x.disabled = true);
      b.classList.add('ok'); beep(true); addScore(tries === 0 ? 10 : 5);
      fb.className = 'feedback ok'; fb.textContent = '🌟 أحسنتِ! ' + item.why;
      const last = qIdx === st.qs.length - 1;
      app.querySelector('.row span:last-child').outerHTML = `<button class="btn" id="nx">${last ? 'النتيجة ◀' : 'السؤال التالي ◀'}</button>`;
      document.getElementById('nx').onclick = () => { if (last) finish(); else { qIdx++; renderQuiz(st); } };
    } else {
      tries++; beep(false); b.classList.add('no'); b.disabled = true;
      fb.className = 'feedback no'; fb.textContent = 'حاولي مرة أخرى… الخطأ فرصة لنتعلم 💪';
    }
  });
}

function finish() {
  window.reportGame && window.reportGame(score, 30 + 30 + STAGES[2].qs.length * 10);
  const max = 30 + 30 + STAGES[2].qs.length * 10;
  const ratio = score / max;
  const stars = ratio >= 0.85 ? 3 : ratio >= 0.6 ? 2 : 1;
  confetti();
  app.innerHTML = `
    <div class="center">
      <div class="badge">🏅</div>
      <h2>مبارك يا عالمتي الصغيرة!</h2>
      <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
      <p style="font-size:20px;font-weight:bold">مجموع نجومك: ${ar(score)} من ${ar(max)}</p>
      <p class="hint">لقد أتقنتِ رحلة الهواء والدم في جسم الإنسان.</p>
      <div class="row" style="justify-content:center">
        <button class="btn green" id="again">العبي مرة أخرى ↺</button>
      </div>
    </div>`;
  document.getElementById('again').onclick = () => { score = 0; scoreEl.textContent = '٠'; stageIdx = 0; render(); };
}

start();
</script>
<script src="../assets/student.js"></script>
</body>
</html>
