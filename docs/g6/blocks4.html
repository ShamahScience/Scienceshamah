<head>

<style>
  :root { --p: #7b3fe4; --t: #22b8c8; --ink: #2b2340; --gold: #f5c242; --ok: #2f8a3a; --bad: #d23b3b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Noto Naskh Arabic', Tahoma, serif; font-weight: 700; color: var(--ink);
    background: linear-gradient(#5db7f3, #9fd8ff 70%, #c9ecff); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; top: 8px; inset-inline: 10px; display: flex; gap: 8px; align-items: center; z-index: 5; flex-wrap: wrap; }
  .pill { background: #fffffff2; border: 3px solid var(--p); border-radius: 999px; padding: 1px 14px; font-size: 18px; box-shadow: 0 3px 0 #0002; text-decoration: none; color: var(--ink); }
  button.pill { font: inherit; font-size: 16px; cursor: pointer; }
  .bar { flex: 1; min-width: 120px; height: 16px; background: #fff; border: 3px solid var(--p); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--p), var(--t)); transition: width .5s; }
  .toast { position: fixed; top: calc(108px + env(safe-area-inset-top, 0px)); left: 50%; max-width: 90vw; transform: translateX(-50%); background: #2b2340e6; color: #fff; border-radius: 16px; padding: 6px 18px; font-size: 20px; z-index: 6; display: none; text-align: center; }
  .ov { position: fixed; inset: 0; background: #2b234077; display: none; align-items: center; justify-content: center; z-index: 10; padding: 14px; }
  .ov.on { display: flex; }
  .card { background: #fff; border: 5px solid var(--p); border-radius: 26px; padding: 18px 24px; max-width: 760px; width: 100%; max-height: 94vh; overflow: auto; box-shadow: 0 10px 0 #4a1fa055; text-align: center; animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .num { display: inline-flex; width: 56px; height: 56px; align-items: center; justify-content: center; background: #fff; border: 4px solid #cfcfcf; border-radius: 12px; font-size: 32px; box-shadow: 0 4px 0 #bbb; vertical-align: middle; margin-inline-end: 8px; font-family: Tahoma, sans-serif; }
  .tag { display: inline-block; color: #fff; border-radius: 999px; padding: 2px 16px; font-size: 18px; vertical-align: middle; }
  .q { font-size: 24px; margin: 12px 0; line-height: 1.6; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { font: inherit; font-size: 19px; border: 3px solid var(--ink); background: #fffbef; color: var(--ink); border-radius: 16px; padding: 8px 14px; cursor: pointer; box-shadow: 0 4px 0 #0002; text-decoration: none; }
  .btn:active { transform: translateY(2px); box-shadow: none; }
  .btn.main { background: var(--p); border-color: #4a1fa0; color: #fff; }
  .btn.ok { background: #c9f0c0; border-color: var(--ok); } .btn.no { background: #fde2e2; border-color: var(--bad); }
  .msg { min-height: 30px; margin-top: 10px; font-size: 19px; line-height: 1.6; } .msg.good { color: var(--ok); } .msg.bad { color: var(--bad); }
  /* cover */
  #ovStart { background: linear-gradient(#5db7f3, #9fd8ff 70%, #c9ecff); padding: 0; }
  .cover { position: relative; width: 100%; height: 100%; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .cover > *:not(.cloud):not(.cvs):not(.road) { position: relative; z-index: 2; }
  .cover h1 { margin: 0; font-size: clamp(46px, 9vw, 110px); line-height: 1.15; color: #ffd83a; text-align: center; -webkit-text-stroke: 3px #7a4b00; text-shadow: 0 6px 0 #7a4b00, 0 10px 18px #0004; animation: bob 2.4s ease-in-out infinite; }
  .cover h2 { margin: 6px 0 4px; font-size: clamp(20px, 3vw, 32px); color: #fff; text-shadow: 0 3px 0 #2b5f9e; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .cover .go { margin-top: 10px; background: #ffd83a; border: 4px solid #7a4b00; color: #7a4b00; font-size: 28px; padding: 6px 46px; border-radius: 999px; box-shadow: 0 6px 0 #7a4b00; }
  .cover .ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; margin-top: 10px; background: #ffffffd9; border-radius: 18px; padding: 6px 14px; font-size: 17px; }
  .name { font: inherit; font-size: 19px; border: 3px solid var(--p); border-radius: 14px; padding: 2px 12px; text-align: center; width: 220px; }
  .skin { width: 34px; height: 34px; border-radius: 10px; border: 3px solid #fff; box-shadow: 0 0 0 2px #aaa; cursor: pointer; display: inline-block; vertical-align: middle; }
  .skin.on { box-shadow: 0 0 0 3px var(--ink); }
  .cvs { position: absolute; bottom: 0; height: 46%; pointer-events: none; }
  .cvs.l { left: 1%; } .cvs.r { right: 1%; }
  .cloud { position: absolute; background: #fff; border-radius: 999px; opacity: .95; animation: drift 30s linear infinite; }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 55%; height: 160%; left: 15%; top: -70%; } .cloud::after { width: 40%; height: 130%; right: 12%; top: -45%; }
  @keyframes drift { from { transform: translateX(-30px); } 50% { transform: translateX(30px); } to { transform: translateX(-30px); } }
  .road { position: absolute; bottom: 0; left: 0; right: 0; height: 13%; background: repeating-linear-gradient(90deg, #f2c84b 0 60px, #e7b93a 60px 120px); border-top: 6px solid #d9a520; }
  /* touch */
  .pad { position: fixed; bottom: 12px; left: 12px; z-index: 5; display: none; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 58px); gap: 6px; }
  .touch .pad { display: grid; }
  .pb { border-radius: 16px; border: 3px solid #fff; background: #7b3fe4cc; color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; }
  #cert { max-width: 100%; border-radius: 12px; box-shadow: 0 4px 14px #0003; }
  #printImg { display: none; }
  @media print { body * { visibility: hidden; } #printImg { display: block; visibility: visible; position: fixed; inset: 0; width: 100%; } }
  @media (max-width: 700px) { .opts { grid-template-columns: 1fr; } .q { font-size: 20px; } }
</style>

<script>
(() => {
const ar = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
const $ = (s) => document.querySelector(s);
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
const Q = [
  { sys: '🍽️ الجهاز الهضمي', col: 0xe0457b, q: 'عملية تحويل الغذاء المعقّد إلى مواد بسيطة تستفيد منها الخلايا هي…', o: ['التنفس', 'الهضم', 'الدوران', 'الإخراج'], a: 1, hint: 'تبدأ في الفم وتكتمل في الأمعاء.', fix: 'الهضم يحوّل الغذاء المعقّد إلى مواد بسيطة تستفيد منها الخلايا. 📖 ص١١٠', sim: { q: 'إلى أين يتّجه الطعام بعد هضمه جزئيًا في المعدة؟', o: ['إلى الأمعاء الدقيقة', 'إلى المريء', 'إلى الكبد'], a: 0 } },
  { sys: '🚽 الجهاز الإخراجي', col: 0x2f9b8f, q: 'أيّ مما يأتي يخلّص الجسم من ثاني أكسيد الكربون وبخار الماء؟', o: ['الرئتان', 'المعدة', 'العظام', 'الدماغ'], a: 0, hint: 'نُخرجهما مع هواء الزفير.', fix: 'الرئتان تطرحان ثاني أكسيد الكربون وبخار الماء مع الزفير، والكليتان تنقّيان الدم. 📖 ص١١٦', sim: { q: 'العضو الذي ينقّي الدم ويكوّن البول:', o: ['الكليتان', 'القلب', 'المريء'], a: 0 } },
  { sys: '🫁 الجهاز التنفسي', col: 0x3b7fd8, q: 'أيّ الأجزاء ينقبض وينبسط لتنظيم عملية التنفس؟', o: ['الأنف', 'الفم', 'القصبة الهوائية', 'الحجاب الحاجز'], a: 3, hint: 'عضلة تقع أسفل الرئتين.', fix: 'الحجاب الحاجز عضلة تحت الرئتين تنقبض وتنبسط فيدخل الهواء ويخرج. 📖 ص١١٣', sim: { q: 'تتنفّس الأسماك بواسطة…', o: ['الخياشيم', 'الرئتين', 'القصبة الهوائية'], a: 0 } },
  { sys: '❤️ جهاز الدوران', col: 0xd9483b, q: 'في أيّ جهاز دوران يضخّ القلب الدم مباشرة إلى الأنسجة؟', o: ['المغلق', 'المفتوح', 'الهضمي', 'العصبي'], a: 1, hint: 'يوجد في المفصليات والرخويات.', fix: 'المفتوح: يضخّ القلب الدم إلى الأنسجة (المفصليات والرخويات)، والمغلق: يبقى الدم داخل الأوعية (الفقاريات). 📖 ص١١٤', sim: { q: 'جهاز الدوران في الإنسان…', o: ['مغلق', 'مفتوح', 'لا يوجد فيه قلب'], a: 0 } },
  { sys: '🦴 الهيكلي والعضلي', col: 0xe6892a, q: 'لماذا تعمل العضلات في أزواج متقابلة؟', o: ['لأنها تسحب العظام ولا تدفعها', 'لأنها تدفع العظام فقط', 'لأنها لا تتعب أبدًا', 'لأنها تصنع الدم'], a: 0, hint: 'تذكّري نموذج الماصة والخيط.', fix: 'العضلات تسحب العظام بواسطة الأوتار ولا تدفعها؛ لذلك تعمل في أزواج متقابلة. 📖 ص١٢١', sim: { q: 'النسيج الذي يربط العظام بالعضلات هو…', o: ['الأوتار', 'الأربطة', 'الأعصاب'], a: 0 } },
  { sys: '🧠 العصبي والغدد الصمّاء', col: 0x7e57c2, q: 'أيّ الأجهزة يفرز الهرمونات مباشرة في الدم؟', o: ['الجهاز الهضمي', 'الجهاز التنفسي', 'الجهاز العصبي', 'الغدد الصمّاء'], a: 3, hint: 'غدد تصبّ إفرازها في الدم.', fix: 'الغدد الصمّاء تفرز الهرمونات في الدم مباشرة لتنظيم عمل الجسم. 📖 ص١٢٤', sim: { q: 'هرمون يسرّع نبض القلب وقت الخطر:', o: ['الأدرينالين', 'اللعاب', 'العرق'], a: 0 } },
  { sys: '🌡️ ثابتة ومتغيّرة درجة الحرارة', col: 0x9a7ddc, q: 'لماذا لا تستطيع السحالي العيش في المناطق القطبية الباردة؟', o: ['لأنها متغيّرة درجة الحرارة', 'لأنها ثابتة درجة الحرارة', 'لأنها لا تتنفّس', 'لأنها بلا هيكل'], a: 0, hint: 'حرارة جسمها تتبع حرارة البيئة.', fix: 'السحالي متغيّرة درجة الحرارة؛ والبرد الشديد يُبطئ عملياتها الحيوية ويوقف نشاطها. 📖 ص١٣٠', sim: { q: 'الطيور والثدييات حيوانات…', o: ['ثابتة درجة الحرارة', 'متغيّرة درجة الحرارة', 'بلا جهاز دوران'], a: 0 } },
  { sys: '🪱 الهضم في دودة الأرض', col: 0xc2366f, q: 'الجهاز الهضمي لدودة الأرض عبارة عن…', o: ['أنبوب داخل أنبوب له فتحتان', 'تجويف له فتحة واحدة', 'ثقوب تصفّي الماء', 'معدة وأمعاء وكبد'], a: 0, hint: 'انظري إلى صورة الدودة في ص١١١.', fix: 'دودة الأرض: الفم ← المريء ← الحويصلة ← القانصة ← المعى؛ أنبوب داخل أنبوب. 📖 ص١١١', sim: { q: 'أيّ مما يأتي من أجزاء الجهاز الهضمي لدودة الأرض؟', o: ['الحويصلة', 'الرئة', 'الخياشيم'], a: 0 } },
  { sys: '🔗 تكامل الأجهزة', col: 0x3c9a52, q: 'رأى الأرنب الثعلب… ما الترتيب الصحيح لما يحدث؟', o: ['العينان ← الدماغ ← الأعصاب ← العضلات', 'العضلات ← العينان ← الدماغ ← الأعصاب', 'الدماغ ← العضلات ← العينان ← الأعصاب', 'الأعصاب ← المعدة ← الدماغ ← العينان'], a: 0, hint: 'يبدأ بعضو الحس الذي رأى الثعلب.', fix: 'العينان ترسلان المعلومات إلى الدماغ، فيرسل أوامره عبر الحبل الشوكي والأعصاب إلى عضلات الأرجل. 📖 ص١٢٥', sim: { q: 'ما الذي تفرزه الغدد الصمّاء وقت الخطر فيتسارع القلب؟', o: ['الأدرينالين', 'اللعاب', 'البول'], a: 0 } },
  { sys: '🏅 نافس: نواتج التعلم', col: 0xf0a23b, q: 'ما الذي تشكّله مجموعة من الأعضاء مثل القلب والمعدة والأمعاء التي تعمل معًا؟', o: ['نسيج', 'عنصر', 'جهاز حيوي', 'خلية'], a: 2, hint: 'أكبر من العضو.', fix: 'خلية ← نسيج ← عضو ← جهاز. 📖 مذكرة نافس ص٢', sim: { q: 'الترتيب الصحيح من الأصغر إلى الأكبر:', o: ['خلية ← نسيج ← عضو ← جهاز', 'جهاز ← عضو ← خلية ← نسيج', 'عضو ← خلية ← جهاز ← نسيج'], a: 0 } },
];

const SKINS = ['#8e6ad4', '#e0457b', '#3b7fd8', '#2f9b8f'];
let skin = SKINS[0];
$('#skins').innerHTML = SKINS.map((c, k) => `<span class="skin ${k ? '' : 'on'}" data-k="${k}" style="background:${c}"></span>`).join(' ');
$('#skins').onclick = (e) => { const d = e.target.closest('.skin'); if (!d) return; skin = SKINS[+d.dataset.k]; document.querySelectorAll('.skin').forEach((x) => x.classList.toggle('on', x === d)); drawCover(); };
try { const n = localStorage.getItem('blocks4:name'); if (n) $('#nm').value = n; } catch (e) {}
setTimeout(() => { try { const m = window.currentStudent && window.currentStudent(); if (m && !$('#nm').value) $('#nm').value = m.name; } catch (e) {} }, 1500);
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');

let AC = null;
const tone = (f, d, t = 'sine', v = .12, at = 0) => { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(), s = AC.currentTime + at; o.type = t; o.frequency.value = f; g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(.001, s + d); o.connect(g).connect(AC.destination); o.start(s); o.stop(s + d); } catch (e) {} };
const SND = { step: () => tone(660, .05, 'square', .025), bump: () => tone(140, .08, 'square', .04),
  ok: () => [523, 659, 784, 1047].forEach((f, k) => tone(f, .18, 'triangle', .12, k * .09)), bad: () => tone(200, .25, 'sawtooth', .06),
  win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, k) => tone(f, .22, 'triangle', .12, k * .13)) };

// ───── a blocky student drawn in flat blocks (used on the cover and in the maze)
function drawGirl(g, x, y, s, col, dir = 1, step = 0) {
  // x,y = feet centre; s = height in px
  const u = s / 10, leg = Math.sin(step) * u * .5;
  const R = (cx, cy, w, h, c) => { g.fillStyle = c; g.fillRect(cx - w / 2, cy, w, h); };
  g.save(); g.translate(x, y); g.scale(dir, 1);
  g.fillStyle = '#0002'; g.beginPath(); g.ellipse(0, 0, u * 2.4, u * .5, 0, 0, 7); g.fill();
  R(-u * .75, -u * 2.6 + leg, u * 1.1, u * 2.6 - leg, '#4a3f6b'); R(u * .75, -u * 2.6 - leg, u * 1.1, u * 2.6 + leg, '#4a3f6b');
  R(0, -u * 5.6, u * 3.4, u * 3.2, '#ffffff'); g.strokeStyle = '#d8d0ec'; g.lineWidth = u * .15; g.strokeRect(-u * 1.7, -u * 5.6, u * 3.4, u * 3.2);
  R(-u * 2.2, -u * 5.5, u * 1, u * 2.6, '#ffffff'); R(u * 2.2, -u * 5.5, u * 1, u * 2.6, '#ffffff');
  R(-u * 2.2, -u * 2.9, u * .9, u * .7, '#f6d0b0'); R(u * 2.2, -u * 2.9, u * .9, u * .7, '#f6d0b0');
  R(u * 1.2, -u * 4.6, u * 1.2, u * 1.6, '#7b3fe4');                     // science book
  R(0, -u * 9.9, u * 3.8, u * 4.6, col);                                     // hijab
  R(0, -u * 6.1, u * 4.4, u * 1, col);
  R(0, -u * 9.1, u * 2.6, u * 2.8, '#f6d0b0');                               // face
  g.fillStyle = '#2b2340'; g.fillRect(-u * .8, -u * 8.3, u * .45, u * .7); g.fillRect(u * .35, -u * 8.3, u * .45, u * .7);
  g.fillStyle = '#f48fb1'; g.fillRect(-u * 1.2, -u * 7.4, u * .5, u * .3); g.fillRect(u * .7, -u * 7.4, u * .5, u * .3);
  g.strokeStyle = '#c2366f'; g.lineWidth = u * .25; g.beginPath(); g.arc(0, -u * 7.3, u * .55, .3, Math.PI - .3); g.stroke();
  g.restore();
}

// ───── cover: sky, clouds and three blocky students
function drawCover() {
  document.querySelectorAll('.cvs').forEach((c) => c.remove());
  const cv = $('#cover');
  [['l', [SKINS[1], SKINS[2]]], ['r', [skin, SKINS[3]]]].forEach(([side, cols]) => {
    const c = document.createElement('canvas'); c.className = 'cvs ' + side; c.width = 520; c.height = 520; const g = c.getContext('2d');
    cols.forEach((col, k) => drawGirl(g, 150 + k * 220, 500 - k * 10, 420 - k * 40, col, side === 'l' ? 1 : -1));
    cv.appendChild(c);
  });
}
[[6, 12, 140], [70, 8, 170], [40, 26, 110], [82, 30, 120], [20, 40, 90]].forEach(([l, t, w], k) => {
  const d = document.createElement('div'); d.className = 'cloud'; Object.assign(d.style, { left: l + '%', top: t + '%', width: w + 'px', height: w * .38 + 'px', animationDelay: -k * 6 + 's' }); $('#cover').appendChild(d);
});
drawCover();

// ───── the maze (a perfect maze from a seed; the ten stations lie on the one path from start to finish)
const TALL = innerHeight > innerWidth; let W = TALL ? 7 : 12, H = TALL ? 11 : 7, CW = W * 2 + 1, CH = H * 2 + 1;
let grid, path, stations, seed = 4;
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function build(sd) {
  const r = rng(sd); grid = Array.from({ length: CH }, () => Array(CW).fill(1));
  const st = [[0, 0]], seen = new Set(['0,0']); grid[1][1] = 0;
  while (st.length) {
    const [cx, cy] = st[st.length - 1];
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [cx + dx, cy + dy, dx, dy]).filter(([x, y]) => x >= 0 && y >= 0 && x < W && y < H && !seen.has(x + ',' + y));
    if (!nb.length) { st.pop(); continue; }
    const [nx, ny, dx, dy] = nb[Math.floor(r() * nb.length)]; seen.add(nx + ',' + ny);
    grid[cy * 2 + 1 + dy][cx * 2 + 1 + dx] = 0; grid[ny * 2 + 1][nx * 2 + 1] = 0; st.push([nx, ny]);
  }
  // shortest path from start (bottom-right, RTL reading) to finish (top-left)
  const S0 = [CW - 2, CH - 2], E0 = [1, 1], prev = {}, q = [S0], key = (p) => p[0] + ',' + p[1]; prev[key(S0)] = null;
  while (q.length) { const c = q.shift(); if (c[0] === E0[0] && c[1] === E0[1]) break;
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => { const n = [c[0] + dx, c[1] + dy]; if (!grid[n[1]][n[0]] && !(key(n) in prev)) { prev[key(n)] = c; q.push(n); } }); }
  path = []; for (let c = E0; c; c = prev[key(c)]) path.unshift(c);
  stations = Q.map((_, k) => { const p = path[Math.round((k + 1) * (path.length - 1) / 11)]; return { x: p[0], y: p[1], k, done: false }; });
  return path.length;
}
// pick a seed whose path is long enough so the stations are spread out
function goodSeed(from) { let s = from; while (build(s) < (TALL ? 50 : 60)) s++; seed = s; }
goodSeed(seed);

const C = $('#c'), G = C.getContext('2d');
let tile = 40, ox = 0, oy = 0;
function resize() {
  const dpr = Math.min(2, devicePixelRatio); C.width = innerWidth * dpr; C.height = innerHeight * dpr; G.setTransform(dpr, 0, 0, dpr, 0, 0);
  const padH = document.body.classList.contains('touch') ? 150 : 0; tile = Math.floor(Math.min((innerWidth - 16) / CW, (innerHeight - 110 - padH) / CH)); ox = (innerWidth - tile * CW) / 2; oy = 100 + (innerHeight - 106 - padH - tile * CH) / 2;
}
addEventListener('resize', resize); resize();

const me = { x: CW - 2, y: CH - 2, fx: CW - 2, fy: CH - 2, dir: -1, step: 0 };
let stars = 0, playing = false, busy = false, next = 0, finished = false;
function wallCol(x, y) { return ((Math.floor(x / 3) + Math.floor(y / 2)) % 3 === 0) ? ['#22b8c8', '#1a8f9c', '#7ee3ee'] : ['#7b3fe4', '#5a24b8', '#a77ef5']; }
function draw(t) {
  G.clearRect(0, 0, innerWidth, innerHeight);
  // floor board
  G.fillStyle = '#fbf4e6'; G.fillRect(ox, oy, tile * CW, tile * CH);
  for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) {
    if (!grid[y][x]) continue;
    const [c, d, l] = wallCol(x, y), X = ox + x * tile, Y = oy + y * tile, s = tile;
    G.fillStyle = d; G.fillRect(X, Y + s * .18, s, s * .82);                 // side
    G.fillStyle = c; G.fillRect(X, Y, s, s * .8);                            // top
    G.fillStyle = l; G.beginPath(); G.arc(X + s * .3, Y + s * .38, s * .12, 0, 7); G.arc(X + s * .7, Y + s * .38, s * .12, 0, 7); G.fill();
  }
  // start and finish
  const lab = (x, y, txt, bg) => { const X = ox + x * tile, Y = oy + y * tile; G.fillStyle = bg; G.fillRect(X + 2, Y + 2, tile - 4, tile - 4); G.font = `bold ${tile * .5}px Tahoma`; G.textAlign = 'center'; G.textBaseline = 'middle'; G.fillText(txt, X + tile / 2, Y + tile / 2 + 1); };
  const sx = CW - 2, sy = CH - 2; G.fillStyle = '#ffe082'; G.fillRect(ox + sx * tile + 3, oy + sy * tile + 3, tile - 6, tile - 6);
  G.fillStyle = '#7a4b00'; G.font = `bold ${tile * .32}px 'Noto Naskh Arabic', Tahoma`; G.textAlign = 'center'; G.textBaseline = 'middle'; G.fillText('ابدئي', ox + sx * tile + tile / 2, oy + sy * tile + tile / 2);
  // finish: checkered tile and a trophy
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { G.fillStyle = (i + j) % 2 ? '#222' : '#fff'; G.fillRect(ox + tile + i * tile / 4, oy + tile + j * tile / 4, tile / 4, tile / 4); }
  G.font = `${tile * .8}px serif`; G.fillText('🏆', ox + tile * 1.5, oy + tile * 1.5 + Math.sin(t / 300) * 2);
  // stations
  stations.forEach((st) => {
    const X = ox + st.x * tile, Y = oy + st.y * tile, s = tile, pad = s * .06;
    G.fillStyle = st.done ? '#43a047' : '#bdbdbd'; G.fillRect(X + pad, Y + pad + s * .08, s - pad * 2, s - pad * 2);
    G.fillStyle = st.done ? '#c8f5c4' : '#ffffff'; G.fillRect(X + pad, Y + pad, s - pad * 2, s - pad * 2 - s * .06);
    G.fillStyle = st.k === next && !st.done ? '#7b3fe4' : '#2b2340'; G.font = `bold ${s * .62}px Tahoma, sans-serif`; G.textAlign = 'center'; G.textBaseline = 'middle';
    G.fillText(st.done ? '✔' : String(st.k + 1), X + s / 2, Y + s / 2);
    if (st.k === next && !st.done) { G.strokeStyle = '#ffd83a'; G.lineWidth = 3 + Math.sin(t / 200) * 1.5; G.strokeRect(X + 1, Y + 1, s - 2, s - 2); }
  });
  // the student
  me.fx += (me.x - me.fx) * .35; me.fy += (me.y - me.fy) * .35;
  drawGirl(G, ox + (me.fx + .5) * tile, oy + (me.fy + .95) * tile, tile * 1.15, skin, me.dir, me.step);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function hud() {
  $('#hNum').textContent = next < 10 ? `🔢 المحطة ${ar(next + 1)} / ١٠` : '🏆 إلى الكأس!'; $('#hStar').textContent = `⭐ ${ar(stars)}`;
  $('#hBar').style.width = (stations.filter((s) => s.done).length * 10) + '%';
}
function toast(t, ms = 1800) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { e.style.display = 'none'; }, ms); }
function move(dx, dy) {
  if (!playing || busy || finished) return;
  const nx = me.x + dx, ny = me.y + dy; if (dx) me.dir = dx > 0 ? 1 : -1;
  if (nx < 0 || ny < 0 || nx >= CW || ny >= CH || grid[ny][nx]) { SND.bump(); return; }
  me.x = nx; me.y = ny; me.step += 1.6; SND.step();
  const st = stations.find((s) => s.x === nx && s.y === ny && !s.done);
  if (st) ask(st.k);
  if (nx === 1 && ny === 1) {
    if (stations.every((s) => s.done)) finish(); else toast('🔢 أكملي كل المحطات أولًا، ثم ارجعي إلى الكأس!');
  }
}
const KD = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
addEventListener('keydown', (e) => { if (KD[e.code] && playing) { e.preventDefault(); move(...KD[e.code]); } });
const PD = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] };
document.querySelectorAll('.pb').forEach((b) => { let tm; const go = (e) => { e.preventDefault(); move(...PD[b.dataset.d]); tm = setInterval(() => move(...PD[b.dataset.d]), 170); }, stop = () => clearInterval(tm);
  b.addEventListener('pointerdown', go); ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, stop)); });
// swipe on the board
let sw = null; C.addEventListener('pointerdown', (e) => { sw = [e.clientX, e.clientY]; });
C.addEventListener('pointerup', (e) => {
  if (!sw) return; const dx = e.clientX - sw[0], dy = e.clientY - sw[1]; sw = null;
  if (Math.hypot(dx, dy) < 12) { // a tap: the teacher can open any station's question by tapping its number
    const x = Math.floor((e.clientX - ox) / tile), y = Math.floor((e.clientY - oy) / tile), st = stations.find((s) => s.x === x && s.y === y);
    if (st && playing && !busy) ask(st.k, false, true);
    else if (x === 1 && y === 1 && playing && !busy && !finished) { if (stations.every((s) => s.done)) finish(); else toast('🔢 أكملي كل المحطات أولًا!'); }
    return; }
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1, 0); else move(0, dy > 0 ? 1 : -1);
});

// ───── questions: hint → second try → remediation (book page) → similar question → praise
const praise = () => ['أحسنتِ يا عالمتي! 🌟', 'رائع! تابعي المتاهة 🧱✨', 'ممتاز! أنتِ بطلة 💪', 'إجابة ذكية! 👏'][Math.floor(Math.random() * 4)];
function ask(k, sim, byTap) {
  busy = true; const it = Q[k], t = sim ? it.sim : it; let tries = 0;
  $('#qNum').textContent = k + 1; const tag = $('#qTag'); tag.textContent = it.sys; tag.style.background = hex(it.col);
  $('#qText').textContent = sim ? '🔁 سؤال مشابه: ' + t.q : t.q;
  const idx = t.o.map((_, i) => i).sort(() => Math.random() - .5);
  $('#qOpts').innerHTML = idx.map((i) => `<button class="btn" data-k="${i}">${t.o[i]}</button>`).join('');
  $('#qMsg').className = 'msg'; $('#qMsg').textContent = ''; $('#ovQ').classList.add('on');
  $('#qOpts').querySelectorAll('.btn').forEach((b) => b.onclick = () => {
    const m = $('#qMsg');
    if (+b.dataset.k === t.a) {
      b.classList.add('ok'); $('#qOpts').querySelectorAll('.btn').forEach((x) => x.disabled = true); SND.ok();
      const st = stations[k], first = !st.done, got = first ? (sim ? 1 : tries === 0 ? 3 : 2) : 0; stars += got;
      m.className = 'msg good'; m.textContent = (sim ? 'أحسنتِ! الآن فهمتِ الفكرة 💚' : praise()) + (got ? `  +${ar(got)} ⭐` : '');
      setTimeout(() => { $('#ovQ').classList.remove('on'); busy = false; if (first) { st.done = true; while (next < 10 && stations[next].done) next++; hud();
        toast(next < 10 ? `✔ المحطة ${ar(k + 1)}! اذهبي إلى المحطة ${ar(next + 1)}` : '🏆 أحسنتِ! أنهيتِ المحطات العشر… هذه شهادتك', 2200);
        if (stations.every((x) => x.done)) setTimeout(finish, 1200); } }, 1500);
    } else {
      tries++; b.classList.add('no'); b.disabled = true; SND.bad(); m.className = 'msg bad';
      if (sim || tries === 1) m.textContent = '💡 تلميح: ' + it.hint + ' حاولي مرة أخرى.';
      else { $('#qOpts').querySelectorAll('.btn').forEach((x) => { x.disabled = true; if (+x.dataset.k === t.a) x.classList.add('ok'); });
        m.innerHTML = `📘 لنتعلّم معًا: ${it.fix}<br><button class="btn main" style="margin-top:8px">🔁 جرّبي سؤالًا مشابهًا</button>`;
        m.querySelector('button').onclick = () => ask(k, true); }
    }
  });
}
function finish() {
  if (finished) return; finished = true; SND.win(); $('#hBar').style.width = '100%';
  try { window.reportGame && window.reportGame(stars, 30); } catch (e) {}
  drawCert().catch(() => {}).then(() => $('#ovEnd').classList.add('on'));
}
async function drawCert() {
  try { await document.fonts.load("bold 60px 'Noto Naskh Arabic'"); } catch (e) {}
  const c = $('#cert'), g = c.getContext('2d'), W = c.width, H = c.height, F = (px) => `bold ${px}px 'Noto Naskh Arabic', Tahoma, serif`;
  const gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, '#f6efff'); gr.addColorStop(1, '#ffeef6'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // blocky frame
  for (let x = 0; x < W; x += 50) for (const y of [0, H - 50]) { g.fillStyle = ['#8e6ad4', '#e0457b', '#f5c242', '#3b7fd8'][(x / 50 + y) % 4]; g.fillRect(x + 3, y + 3, 44, 44); }
  for (let y = 50; y < H - 50; y += 50) for (const x of [0, W - 50]) { g.fillStyle = ['#8e6ad4', '#e0457b', '#f5c242', '#3b7fd8'][(y / 50 + x) % 4]; g.fillRect(x + 3, y + 3, 44, 44); }
  g.strokeStyle = '#7e57c2'; g.lineWidth = 6; g.strokeRect(80, 80, W - 160, H - 160);
  g.textAlign = 'center'; g.direction = 'rtl'; g.fillStyle = '#7e57c2';
  g.font = F(92); g.fillText('🏆 شهادة بطلة المكعّبات 🏆', W / 2, 230);
  g.fillStyle = '#2b2340'; g.font = F(44); g.fillText('تشهد معلمة العلوم بأنّ الطالبة', W / 2, 340);
  const name = ($('#nm').value || '').trim() || '……………………………';
  g.fillStyle = '#c2366f'; g.font = F(96); g.fillText(name, W / 2, 470);
  g.fillStyle = '#2b2340'; g.font = F(44); g.fillText('أتمّت «متاهة المكعّبات» في تعزيز مهارات الفصل الرابع: أجهزة الجسم', W / 2, 570);
  g.fillText('وأنجزت المحطات العشر بنجاح، وجمعت', W / 2, 640);
  g.fillStyle = '#e6892a'; g.font = F(72); g.fillText(`⭐ ${ar(stars)} نجمة ⭐`, W / 2, 740);
  g.fillStyle = '#2b2340'; g.font = F(40); g.fillText('مع تمنياتي لكِ بدوام التفوّق والتميّز 💜', W / 2, 820);
  let d = ''; try { d = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-arab', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date()); } catch (e) {}
  g.font = F(36); g.textAlign = 'right'; g.fillText('معلمة العلوم: أ/ شامه البقمي', W - 160, 960); g.textAlign = 'left'; g.fillText(d, 160, 960);
  g.textAlign = 'center'; g.font = F(30); g.fillStyle = '#8a7aa8'; g.fillText('العلوم – الصف السادس الابتدائي • ابتدائية عشرون لتحفيظ القرآن', W / 2, 1020);
  await new Promise((res) => { const im = new Image(); im.onload = () => { g.drawImage(im, 110, 640, 220 * im.width / im.height, 220); res(); }; im.onerror = res; im.src = '../assets/lt.png'; });
  try { const url = c.toDataURL('image/png'); $('#bSave').href = url; $('#printImg').src = url; } catch (e) {}
}

$('#bPrint').onclick = () => window.print();
$('#bAgain').onclick = () => location.reload();
$('#bNew').onclick = () => { if (busy) return; goodSeed(seed + 1); Object.assign(me, { x: CW - 2, y: CH - 2, fx: CW - 2, fy: CH - 2 }); stations.forEach((s) => s.done = false); next = 0; stars = 0; finished = false; hud(); toast('🔀 متاهة جديدة!'); };
$('#go').onclick = () => {
  try { localStorage.setItem('blocks4:name', $('#nm').value.trim()); } catch (e) {}
  $('#ovStart').classList.remove('on'); playing = true; hud(); toast('🚀 ابدئي من «ابدئي» واذهبي إلى المحطة ١', 2400);
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); } catch (e) {}
};
hud();
window.__maze = { get me() { return me; }, get stations() { return stations; }, get path() { return path; }, get stars() { return stars; }, move, ask, Q };
})();
